// Client-side activity reporting (page views, downloads, searches, saves).
// Chat and escalation events are recorded server-side and need not be sent.
syntax = "proto3";

package career.v1;

import "buf/validate/validate.proto";
import "career/v1/common.proto";
import "career/v1/options.proto";

option go_package = "github.com/reh3376/career-site/services/api/gen/career/v1;careerv1";

// Batched, fire-and-forget activity reporting.
service ActivityService {
  // Records a batch of events. Duplicate `client_event_id`s are ignored, so
  // clients may retry a failed batch safely. Failures never affect page
  // rendering; clients should send with `keepalive` on page hide.
  rpc RecordEvents(RecordEventsRequest) returns (RecordEventsResponse) {
    option (career.v1.auth) = AUTH_LEVEL_MEMBER;
    option (career.v1.rate_limit_per_minute) = 120;
  }
}

// A batch of events.
message RecordEventsRequest {
  // Events, 1–50 per batch.
  repeated ActivityEvent events = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 50
  }];
}

// Batch result.
message RecordEventsResponse {
  // Events accepted (new).
  int32 accepted = 1;
  // Events ignored as duplicates.
  int32 duplicates = 2;
}
