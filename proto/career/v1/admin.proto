}

// SupportCategory is defined in contact.proto (used by SubmitContact
// on the public side); admin-side messages reference the same enum
// so there's one source of truth for the category set.

// Support message resolution status.
enum SupportStatus {
  // Default (proto3 requires a zero value). Treated as "any" in list
  // requests and as "resolved" in ResolveContactMessage.
  SUPPORT_STATUS_UNSPECIFIED = 0;
  // Message is waiting for a reply / triage.
  SUPPORT_STATUS_OPEN = 1;
  // Message has been handled.
  SUPPORT_STATUS_RESOLVED = 2;
}

// One row of the support_messages table, as the owner sees it.
message SupportMessage {
  // Numeric ID (bigserial); string over the wire so callers don't
  // hard-code JSON number precision.
  string id = 1;
  // Ticket ID (public reference shown in the "we got your message" email).
  string ticket_id = 2;
  // Category the sender picked on the contact form.
  SupportCategory category = 3;
  // Open vs resolved state.
  SupportStatus status = 4;
  // Subject line the sender wrote.
  string subject = 5;
  // Message body, plain text.
  string body = 6;
  // Sender name (as submitted or copied from the user row for members).
  string sender_name = 7;
  // Sender email (as submitted or copied from the user row for members).
  string sender_email = 8;
  // The signed-in user_id if the sender was a member at submit time,
  // empty for anonymous submissions.
  string user_id = 9;
  // When the message was received.
  google.protobuf.Timestamp created_at = 10;
  // When the row last changed (initially = created_at; bumps on
  // status changes).
  google.protobuf.Timestamp updated_at = 11;
  // Set only for resolved messages.
  google.protobuf.Timestamp resolved_at = 12;
  // Role the sender is considering Roger for; populated only when
  // category is HIRING_INQUIRY.
  string hiring_role = 13;
  // URL of the job posting; populated only when category is
  // HIRING_INQUIRY.
  string hiring_jd_url = 14;
  // Free-text target start date; populated only when category is
  // HIRING_INQUIRY.
  string hiring_target_start = 15;
}

// Contact-message list request.
message ListContactMessagesRequest {
  // Case-insensitive substring match against subject / body / sender.
  string query = 1 [(buf.validate.field).string.max_len = 200];
  // Restrict to one status; unspecified returns all.
  SupportStatus status = 2 [(buf.validate.field).enum.defined_only = true];
  // Restrict to one category; unspecified returns all.
  SupportCategory category = 3 [(buf.validate.field).enum.defined_only = true];
  // Pagination.
  PageRequest page = 4;
}

// Contact-message list response.
message ListContactMessagesResponse {
  // Messages matching the filter, newest first.
  repeated SupportMessage messages = 1;
  // Pagination.
  PageResponse page = 2;
  // Unfiltered count of messages currently in the "open" state.
  int32 open_count = 3;
  // Unfiltered count of messages currently in the "resolved" state.
  int32 resolved_count = 4;
}

// Mark-resolved / re-open request.
message ResolveContactMessageRequest {
  // ID from SupportMessage.id.
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
  // Target status. UNSPECIFIED defaults to RESOLVED.
  SupportStatus status = 2 [(buf.validate.field).enum.defined_only = true];
}

// Updated message.
message ResolveContactMessageResponse {
  // The message row after the status flip.
  SupportMessage message = 1;
}

// Approve-registration request.
message ApproveRegistrationRequest {
  // Member ID from MemberRecord.me.id.
  string member_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // Optional free-text reason recorded in the audit log.
  string reason = 2 [(buf.validate.field).string.max_len = 1000];
}

// Approve-registration response.
message ApproveRegistrationResponse {
  // Updated member record.
  MemberRecord member = 1;
}

// Decline-registration request.
message DeclineRegistrationRequest {
  // Member ID from MemberRecord.me.id.
  string member_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // Optional free-text reason recorded in the audit log.
  string reason = 2 [(buf.validate.field).string.max_len = 1000];
}

// Decline-registration response.
message DeclineRegistrationResponse {
  // Updated member record.
  MemberRecord member = 1;
}

// Extend-access request. Set exactly one of extend_days /
// new_expires_at / permanent to specify the new expiry.
message ExtendAccessRequest {
  // Member ID from MemberRecord.me.id.
  string member_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // Add this many days to the current expires_at (or, if the member
  // has no expires_at set, from now). 1..3650.
  int32 extend_days = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 3650
  }];
  // Set expires_at to this exact moment.
  google.protobuf.Timestamp new_expires_at = 3;
  // Make access permanent (clears expires_at).
  bool permanent = 4;
  // Optional free-text reason recorded in the audit log.
  string reason = 5 [(buf.validate.field).string.max_len = 1000];
}

// Extend-access response.
message ExtendAccessResponse {
  // Updated member record.
  MemberRecord member = 1;
}

// One column of a database table.
message DbColumn {
  // Column name.
  string name = 1;
  // SQL type as reported by information_schema (e.g. "text",
  // "bigint", "timestamp with time zone").
  string data_type = 2;
  // Whether the column is nullable.
  bool nullable = 3;
}

// One table in the public schema.
message DbTable {
  // Table name.
  string name = 1;
  // Columns, ordered as declared.
  repeated DbColumn columns = 2;
  // Approximate row count from pg_class.reltuples (updated by
  // ANALYZE; may be stale — the console labels it as such).
  int64 approx_row_count = 3;
}

// List-tables request (empty for now; a future revision might
// add filters).
message ListDbTablesRequest {}

// List-tables response.
message ListDbTablesResponse {
  // Public-schema tables, ordered by name.
  repeated DbTable tables = 1;
}

// Run-query request.
message RunDbQueryRequest {
  // SQL statement to execute. MVP: only SELECT is accepted.
  string sql = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4000
  }];
  // Statement timeout in milliseconds; server-clamped to [100, 10000].
  int32 timeout_ms = 2;
  // Optional column of the result to sort by (informational only —
  // the client can reorder locally; the server passes it back so a
  // caller can round-trip UI state).
  string sort = 3 [(buf.validate.field).string.max_len = 64];
}

// One row of results, as a list of stringified cell values in the
// same order as the columns array on the response. NULLs come across
// as an empty string with a companion `null_mask` bit set on the row
// (see below).
message DbRow {
  // Cell values, stringified. Callers must not attempt to parse them
  // as JSON; the type is columns[i].data_type on the response.
  repeated string cells = 1;
  // Bitmask, LSB = column 0. A set bit means the corresponding cell
  // is NULL and its stringified value should be ignored.
  uint64 null_mask = 2;
}

// Run-query response.
message RunDbQueryResponse {
  // Column names (order matches DbRow.cells).
  repeated string columns = 1;
  // SQL types (order matches columns).
  repeated string column_types = 2;
  // Rows, in whatever order the query returned them.
  repeated DbRow rows = 3;
  // True when the result was cut off at the server-side row cap.
  bool truncated = 4;
  // Number of rows returned (before truncation, if applicable —
  // matches len(rows) when truncated is false).
  int32 row_count = 5;
  // Milliseconds the query took on the server, wall-clock.
  int32 elapsed_ms = 6;
}

// The whitelisted set of TTL choices from FSD FR-AUTH-17. Mirrors
// the `access_ttl` enum type in the DB (`1d` / `3d` / `7d` / `30d`
// / `permanent`).
enum GrantTTL {
  // Not set (proto3 requires a zero value). Rejected in the
  // upsert request; validation forces the caller to pick one.
  GRANT_TTL_UNSPECIFIED = 0;
  // 24 hours.
  GRANT_TTL_1D = 1;
  // 72 hours.
  GRANT_TTL_3D = 2;
  // 7 days.
  GRANT_TTL_7D = 3;
  // 30 days.
  GRANT_TTL_30D = 4;
  // No expiry — access does not auto-lapse.
  GRANT_TTL_PERMANENT = 5;
}

// One row of the access_grants table.
message AccessGrant {
  // Numeric ID (bigserial); string over the wire so callers don't
  // hard-code JSON number precision.
  string id = 1;
  // Whitelisted email address (citext in the DB).
  string email = 2;
  // TTL granted on signup.
  GrantTTL default_ttl = 3;
  // Free-text admin notes (why this email was whitelisted, etc.).
  string notes = 4;
  // When the whitelist entry itself lapses; unset means never.
  google.protobuf.Timestamp entry_expires_at = 5;
  // Admin user_id that created the entry; empty for seeded rows.
  string created_by = 6;
  // When the entry was created.
  google.protobuf.Timestamp created_at = 7;
  // When the entry was last updated.
  google.protobuf.Timestamp updated_at = 8;
}

// List-grants request.
message ListAccessGrantsRequest {
  // Case-insensitive substring match against email or notes.
  string query = 1 [(buf.validate.field).string.max_len = 200];
}

// List-grants response.
message ListAccessGrantsResponse {
  // Whitelist entries, newest first.
  repeated AccessGrant grants = 1;
  // Count of entries currently active (entry_expires_at unset or
  // in the future).
  int32 active_count = 2;
  // Count of entries whose entry_expires_at has passed.
  int32 expired_count = 3;
}

// Upsert-grant request. If a row with this email already exists it
// is updated in place; otherwise a new row is created.
message UpsertAccessGrantRequest {
  // Email to whitelist. Lower-cased server-side.
  string email = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 254
    email: true
  }];
  // TTL that new registrations get on approval.
  GrantTTL default_ttl = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Free-text admin notes.
  string notes = 3 [(buf.validate.field).string.max_len = 1000];
  // When this whitelist entry itself should lapse; unset = never.
  google.protobuf.Timestamp entry_expires_at = 4;
}

// Upsert-grant response.
message UpsertAccessGrantResponse {
  // The stored entry (with fields filled in by the server).
  AccessGrant grant = 1;
  // True when the request created a new row; false when it
  // updated an existing one.
  bool created = 2;
}

// Delete-grant request.
message DeleteAccessGrantRequest {
  // ID from AccessGrant.id.
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
}

// Delete-grant response.
message DeleteAccessGrantResponse {}

// One saved SQL statement on the /admin/db page, scoped to a single
// admin. Names are unique per owner but not globally.
message SavedQuery {
  // Numeric id (bigserial); string over the wire to avoid JSON
  // number-precision drift.
  string id = 1;
  // The admin's chosen label, shown in the dropdown.
  string name = 2;
  // The SELECT text. Same 4000-char cap as RunDbQuery.sql.
  string sql = 3;
  // When the row was first saved.
  google.protobuf.Timestamp created_at = 4;
  // When the row was last overwritten via upsert.
  google.protobuf.Timestamp updated_at = 5;
}

// List-saved-queries request. No filters yet — the response is
// naturally scoped to the caller and expected to be small.
message ListSavedQueriesRequest {}

// List-saved-queries response.
message ListSavedQueriesResponse {
  // The caller's saved queries, ordered by name (case-insensitive).
  repeated SavedQuery queries = 1;
}

// Upsert-saved-query request. A row with (owner, name) is created
// if it doesn't exist and overwritten if it does.
message UpsertSavedQueryRequest {
  // Label to save under. Trimmed server-side; empty is rejected.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 80
  }];
  // The SQL text. Enforcement (SELECT-only, single statement) is
  // applied at execute time by RunDbQuery, not on save — so an
  // admin can save a draft and finish it later.
  string sql = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4000
  }];
}

// Upsert-saved-query response.
message UpsertSavedQueryResponse {
  // The stored row (fields populated by the server).
  SavedQuery query = 1;
  // True when the request created a new row; false when it
  // overwrote an existing (owner, name) tuple.
  bool created = 2;
}

// Delete-saved-query request.
message DeleteSavedQueryRequest {
  // ID from SavedQuery.id.
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
}

// Delete-saved-query response.
message DeleteSavedQueryResponse {}

// One row of the /admin/activity aggregate view: per-member counts
// + the last recorded event. `last_event_at` is unset for members
// with no recorded activity yet.
message MemberActivitySummary {
  // Member id (numeric, stringified over the wire).
  string user_id = 1;
  // Display name.
  string name = 2;
  // Email address.
  string email = 3;
  // Current lifecycle state.
  MemberStatus status = 4;
  // Number of sessions ever created for this member.
  int32 total_sessions = 5;
  // Sum of session wall-clock time in seconds, approximated as
  // (LEAST(revoked_at, last_active_at, now()) − created_at) per
  // session.
  int64 total_active_secs = 6;
  // Number of `chat` events (Ask Roger interactions).
  int32 ask_roger_count = 7;
  // Total number of activity_events rows for this member.
  int32 total_events = 8;
  // Kind of the most-recent event (matching ActivityEvent.Kind
  // values as a slug: "view", "login", …). Empty for members with
  // no events yet.
  string last_kind = 9;
  // Timestamp of the most-recent event; unset when no events.
  google.protobuf.Timestamp last_event_at = 10;
}

// Sort order for ListMemberActivity.
enum ActivitySort {
  // Default: name (case-insensitive ascending).
  ACTIVITY_SORT_UNSPECIFIED = 0;
  // Newest activity first.
  ACTIVITY_SORT_LAST_EVENT_DESC = 1;
  // Highest total session count first.
  ACTIVITY_SORT_SESSIONS_DESC = 2;
  // Highest total active-time first.
  ACTIVITY_SORT_ACTIVE_TIME_DESC = 3;
  // Most Ask Roger interactions first.
  ACTIVITY_SORT_ASK_ROGER_DESC = 4;
}

// List-member-activity request.
message ListMemberActivityRequest {
  // Which column to sort by.
  ActivitySort sort = 1 [(buf.validate.field).enum.defined_only = true];
}

// List-member-activity response.
message ListMemberActivityResponse {
  // One row per member (up to 500).
  repeated MemberActivitySummary members = 1;
}

// Ingest one document into the Ask Roger corpus.
message IngestCorpusTextRequest {
  // Where the text came from: 'article', 'resume', 'career_note',
  // 'adr', 'other'. Kept as free text (not enum) so a new source
  // kind is just a new value at the ingest form, not a proto edit.
  string source_kind = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 40
  }];
  // Stable per-source_kind key. Filesystem sources pass the relative
  // path; pasted documents pass a slug like `paste/2026-09-21-notes`.
  string source_path = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // Human-readable title. Empty falls back to the first non-blank
  // line of the body (with a leading `#` stripped) at ingest time.
  string title = 3 [(buf.validate.field).string.max_len = 300];
  // The document text, post-front-matter for markdown. Capped at
  // 200 KiB so the form doesn't paste in an unbounded blob.
  string body = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 204800
  }];
  // `public` (default) or `corpus_only`.
  string visibility = 5 [(buf.validate.field).string.max_len = 16];
}

// Ingest response — mirrors ingest.IngestResult.
message IngestCorpusTextResponse {
  // ID of the stored corpus_documents row.
  string document_id = 1;
  // Number of chunks written this run (0 if skipped).
  int32 chunks_inserted = 2;
  // Number of chunks successfully embedded this run.
  int32 chunks_embedded = 3;
  // True when the body's content hash matched the stored row and
  // no chunk / embed work ran.
  bool skipped = 4;
  // Stable identifier of the chunker version used (e.g. "paragraph.v1").
  string chunker_name = 5;
  // Embedder model reported by the sidecar (e.g. "stub", "ollama").
  string embedder_model = 6;
}

// List-corpus-documents request. No filters yet — corpus is small
// enough that the admin surface returns everything.
message ListCorpusDocumentsRequest {}

// One row in the corpus with a computed chunk count.
message CorpusDocumentRow {
  // ID of the corpus_documents row.
  string id = 1;
  // Source kind slug.
  string source_kind = 2;
  // Stable per-source_kind key.
  string source_path = 3;
  // Human-readable title.
  string title = 4;
  // Count of chunk rows referencing this document.
  int32 chunk_count = 5;
  // Count of chunks that have an embedding populated.
  int32 embedded_count = 6;
  // When the row was first written.
  google.protobuf.Timestamp ingested_at = 7;
  // When any field changed (title / hash / meta).
  google.protobuf.Timestamp updated_at = 8;
  // `public` (citable on the site) or `corpus_only` (informs answers,
  // never quoted or named).
  string visibility = 9;
}

// List-corpus-documents response.
message ListCorpusDocumentsResponse {
  // All documents, newest first.
  repeated CorpusDocumentRow documents = 1;
  // Aggregate document count across the whole corpus (rendered as
  // a header chip on /admin/corpus).
  int32 total_documents = 2;
  // Aggregate chunk count across every stored document.
  int32 total_chunks = 3;
  // Aggregate count of chunks that have an embedding populated.
  int32 total_embedded = 4;
  // Documents with visibility=public.
  int32 total_public = 5;
  // Documents with visibility=corpus_only.
  int32 total_corpus_only = 6;
  // Chunk counts grouped by the embedder that produced their vector.
  repeated EmbedderCount embedder_counts = 7;
}

// One row of the per-embedder chunk breakdown.
message EmbedderCount {
  // Embedder name as reported by the sidecar (e.g. `stub`,
  // `ollama:nomic-embed-text`); empty for chunks with no vector yet,
  // `untracked` for vectors written before per-chunk tracking existed.
  string model = 1;
  // Number of chunks.
  int32 count = 2;
}

// Sweep-corpus-embeddings request.
message SweepCorpusEmbeddingsRequest {
  // Upper bound on chunks to (re)embed in this call. 0 → 512.
  int32 max_chunks = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 5000
  }];
}

// Sweep-corpus-embeddings response — mirrors ingest.SweepResult.
message SweepCorpusEmbeddingsResponse {
  // Embedder the sidecar is currently serving; every chunk is
  // converged onto this.
  string model = 1;
  // Chunks selected as stale this call.
  int32 considered = 2;
  // Chunks successfully re-embedded this call.
  int32 embedded = 3;
  // Chunks that failed (left stale for the next sweep).
  int32 failed = 4;
  // Chunks still stale after this call; zero means converged.
  int32 remaining = 5;
}

// Get-jd-submission request.
message GetJdSubmissionRequest {
  // Submission id (numeric, stringified).
  string submission_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
}

// Get-jd-submission response.
message GetJdSubmissionResponse {
  // The list row for this submission (status, scores, hints).
  JdSubmissionRow row = 1;
  // Full JD text as submitted.
  string jd_text = 2;
  // Assessment derivation as JSON (requirements, evidence chunk ids,
  // per-requirement verdicts, prompt versions, score formula); empty
  // before scoring or when the assessor was not wired.
  string assessment_json = 3;
  // Generated résumé in markdown; empty until generation lands.
  string resume_markdown = 4;
  // Model that produced the résumé.
  string llm_model = 5;
  // Prompt id that produced the résumé.
  string prompt_id = 6;
  // Prompt version that produced the résumé.
  int32 prompt_version = 7;
  // Download path for the locked PDF, including the submission's
  // result token, when a PDF was rendered; empty otherwise. Admin-only
  // by virtue of this RPC's auth level.
  string download_url = 8;
  // Every pipeline run for this submission, newest attempt first. The
  // fields above reflect only the most recent run, because a re-score
  // overwrites them; these rows survive it, so a superseded verdict can
  // still be read and compared with the one that replaced it.
  repeated JdRun runs = 9;
  // What happened in the world after this review; unset until recorded.
  JdOutcome outcome = 10;
  // Judgments recorded about this posting's output, newest first.
  repeated JdFeedback feedback = 11;
}

// What happened after a review. One per posting, revised in place.
message JdOutcome {
  // not_pursued | applied | screening | interview | offer | rejected |
  // no_response | withdrew.
  string status = 1;
  // The day that status became true, as YYYY-MM-DD; empty when unknown.
  string decided_on = 2;
  // Free note.
  string note = 3;
  // When the record was last revised.
  google.protobuf.Timestamp updated_at = 4;
}

// One person's judgment of one run's output.
message JdFeedback {
  // The run being judged; empty for a posting that predates run records.
  string run_id = 1;
  // owner | submitter. Never averaged together.
  string source = 2;
  // score | resume.
  string target = 3;
  // For score: accurate | too_generous | too_harsh | unusable.
  // For resume: would_send | needs_edits | wrong.
  string rating = 4;
  // Free note.
  string note = 5;
  // When it was recorded.
  google.protobuf.Timestamp created_at = 6;
}

// Set-jd-outcome request.
message SetJdOutcomeRequest {
  // Submission id (numeric, stringified).
  string submission_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
  // One of the outcome statuses; validated server-side.
  string status = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
  // YYYY-MM-DD, or empty when the day is unknown.
  string decided_on = 3 [(buf.validate.field).string.max_len = 10];
  // Free note, trimmed to 4000 characters.
  string note = 4 [(buf.validate.field).string.max_len = 4000];
}

// Set-jd-outcome response.
message SetJdOutcomeResponse {
  // The stored outcome.
  JdOutcome outcome = 1;
}

// Record-jd-feedback request. The owner's judgment of a run's output.
message RecordJdFeedbackRequest {
  // Submission id (numeric, stringified).
  string submission_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
  // Run being judged; empty attaches the judgment to the newest run.
  string run_id = 2 [(buf.validate.field).string.max_len = 64];
  // score | resume.
  string target = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 16
  }];
  // Rating from the vocabulary for that target; validated server-side.
  string rating = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
  // Free note, trimmed to 4000 characters.
  string note = 5 [(buf.validate.field).string.max_len = 4000];
}

// Record-jd-feedback response.
message RecordJdFeedbackResponse {}

// One job description with a stated expectation (data layer D4). The
// expectation is which side of the gate it belongs on, not a score:
// a score is model-dependent and would have to be rewritten on every
// change, and that rewriting is how a regression hides.
message GoldenPosting {
  // Row id.
  int64 id = 1;
  // Short unique label used in summaries.
  string name = 2;
  // The posting itself.
  string jd_text = 3;
  // Role hint passed to the pipeline, as a submitter would give it.
  string role_hint = 4;
  // Employer hint passed to the pipeline.
  string employer_hint = 5;
  // above | below: the side of the gate this posting belongs on.
  string expected_gate = 6;
  // Advisory band; not asserted, because band edges are tuned.
  string expected_band = 7;
  // Why it is in the set and what it is meant to catch.
  string note = 8;
  // Retired postings stay for history and are skipped by new runs.
  bool active = 9;
  // chosen (the owner picked it) or random (drawn without reading it
  // first). Reported apart, because a gate clean on chosen postings and
  // noisy on random ones is the finding that matters.
  string selection = 13;
  // Where the posting came from.
  string source = 14;
  // Score from the most recent evaluation that included it.
  optional double last_score = 10;
  // Whether that evaluation put it on the expected side.
  bool last_passed = 11;
  // When that evaluation scored it.
  google.protobuf.Timestamp last_eval_at = 12;
}

// List-golden-postings request.
message ListGoldenPostingsRequest {
  // True omits retired postings.
  bool active_only = 1;
}

// List-golden-postings response.
message ListGoldenPostingsResponse {
  // The set, expected-above first then by name.
  repeated GoldenPosting postings = 1;
}

// Upsert-golden-posting request. Keyed by name within the tenant.
message UpsertGoldenPostingRequest {
  // Short unique label.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 80
  }];
  // The posting text.
  string jd_text = 2 [(buf.validate.field).string = {
    min_len: 40
    max_len: 50000
  }];
  // Role hint.
  string role_hint = 3 [(buf.validate.field).string.max_len = 200];
  // Employer hint.
  string employer_hint = 4 [(buf.validate.field).string.max_len = 200];
  // above, below, or empty to add it unlabelled for review later.
  string expected_gate = 5 [(buf.validate.field).string.max_len = 8];
  // chosen or random; defaults to chosen.
  string selection = 8 [(buf.validate.field).string.max_len = 16];
  // Where the posting came from.
  string source = 9 [(buf.validate.field).string.max_len = 500];
  // Advisory band.
  string expected_band = 6 [(buf.validate.field).string.max_len = 20];
  // Why it is in the set.
  string note = 7 [(buf.validate.field).string.max_len = 2000];
}

// Upsert-golden-posting response.
message UpsertGoldenPostingResponse {
  // Row id of the created or replaced posting.
  int64 id = 1;
}

// Set-golden-active request.
message SetGoldenActiveRequest {
  // Row id.
  int64 id = 1;
  // False retires it.
  bool active = 2;
}

// Set-golden-active response.
message SetGoldenActiveResponse {}

// Label-golden-posting request. Labelling is its own call so recording
// a judgment does not mean resending the whole posting text.
message LabelGoldenPostingRequest {
  // Row id.
  int64 id = 1;
  // above or below.
  string expected_gate = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 8
  }];
  // Why, in a sentence. Appended to the posting's note.
  string note = 3 [(buf.validate.field).string.max_len = 2000];
}

// Label-golden-posting response.
message LabelGoldenPostingResponse {}

// One scoring of the whole active golden set under one configuration.
message EvalRun {
  // Row id.
  int64 id = 1;
  // Stable external identifier.
  string eval_id = 2;
  // running | done | failed.
  string status = 3;
  // Free note describing what was being tested.
  string note = 4;
  // Build the api was running.
  string app_commit = 5;
  // Where the model ran.
  string host = 6;
  // Judge model.
  string model = 7;
  // Context window asked for.
  int32 num_ctx = 8;
  // Embedding model behind the corpus.
  string embedder_model = 9;
  // Prompt id to "version:hash" as JSON.
  string prompts_json = 10;
  // Corpus fingerprint at the time of the run.
  string corpus_fingerprint = 11;
  // Gate in force.
  optional double threshold = 12;
  // Postings in the set.
  int32 total = 13;
  // Postings that produced a score.
  int32 scored = 14;
  // Scored postings that landed on the expected side of the gate.
  int32 gate_correct = 15;
  // Pairs where a posting expected below outscored one expected above.
  // Worse than a gate miss: a gate can be moved, an inversion cannot.
  int32 order_violations = 16;
  // Smallest gap between the two groups; a shrinking margin is a
  // regression that gate accuracy hides.
  optional double margin = 17;
  // Postings that failed to score.
  int32 errors = 18;
  // When it started.
  google.protobuf.Timestamp started_at = 19;
  // When it finished; unset while running.
  google.protobuf.Timestamp finished_at = 20;
  // Per-posting results; populated by GetEvalRun only.
  repeated EvalItem items = 21;
  // What the corpus held when the run started; populated by GetEvalRun
  // only. The fingerprint above says whether two runs read the same
  // corpus; this says what that corpus was. Empty for runs that predate
  // the snapshot, which means unknown rather than none.
  repeated EvalCorpusDoc corpus_documents = 22;
}

// One document the corpus held when an evaluation began. Title and kind
// are copied at capture rather than joined at read, so re-indexing a
// document later does not rewrite the history of a run that read the
// version before it.
message EvalCorpusDoc {
  // Corpus document id.
  int64 document_id = 1;
  // Document title as it was at capture.
  string title = 2;
  // Its source kind, such as career_note or article.
  string source_kind = 3;
  // public or corpus_only.
  string visibility = 4;
  // Chunks the document held at capture.
  int32 chunk_count = 5;
  // What the document's text hashed to at capture, hex. Empty for runs
  // captured before this was recorded, which means unknown rather than
  // unchanged. Without it the manifest says which documents a run read
  // and not whether they were the same documents: an edit that
  // preserves the chunk count is otherwise invisible.
  string content_hash = 6;
}

// One posting's result inside one evaluation.
message EvalItem {
  // Golden posting id.
  int64 golden_id = 1;
  // Its label.
  string golden_name = 2;
  // The side of the gate it was expected on.
  string expected_gate = 3;
  // The pipeline run that produced this result.
  string run_id = 4;
  // The submission the run belongs to, for opening the derivation.
  int64 submission_id = 5;
  // Score it got; unset when it failed.
  optional double match_score = 6;
  // Fit band it landed in.
  string fit = 7;
  // The side it actually landed on.
  string gate_side = 8;
  // Whether that matched the expectation.
  bool passed = 9;
  // Why it failed to score.
  string error = 10;
}

// List-eval-runs request.
message ListEvalRunsRequest {
  // Maximum rows, default 25.
  int32 limit = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
}

// List-eval-runs response.
message ListEvalRunsResponse {
  // Evaluations, newest first.
  repeated EvalRun runs = 1;
}

// Get-eval-run request.
message GetEvalRunRequest {
  // Row id.
  int64 id = 1;
}

// Get-eval-run response.
message GetEvalRunResponse {
  // The evaluation, with its per-posting results.
  EvalRun run = 1;
}

// Get-metrics request.
message GetMetricsRequest {}

// Read request.
message GetGateRequest {}

// The criteria, in the order the owner wrote them.
message GetGateResponse {
  // One row per criterion.
  repeated GateRow rows = 1;
}

// One criterion, answered.
message GateRow {
  // Which criterion, as the owner named it.
  string criterion = 1;
  // Whether the target is met. Unset means it cannot be answered yet:
  // not enough data, or no target has been set. An unset value is not
  // a failure and must not be rendered as one.
  optional bool pass = 2;
  // The measurement, already phrased for reading.
  string value = 3;
  // What would count as met.
  string target = 4;
  // When the measurement is from.
  google.protobuf.Timestamp as_of = 5;
  // Anything that qualifies the answer, such as how short the sample
  // is or which part of the target failed.
  string detail = 6;
  // Whether this row is a criterion at all. False means it is measured
  // on purpose and gated on purpose: reach moves with who happened to
  // find the site, not with whether the reviewer improved. Such a row
  // must not be rendered as permanently unanswered, which would read as
  // a standing reproach for something that is not a fault.
  bool gated = 7;
}

// One fit band against what actually happened afterwards.
message OutcomeByFit {
  // Fit band the run assigned.
  string fit = 1;
  // Recorded outcome.
  string outcome = 2;
  // How many submissions.
  int32 submissions = 3;
}

// The state of the reviewer. Every field comes from a view in
// migration 00028; none is computed here.
message GetMetricsResponse {
  // Real runs in the last twenty.
  int32 recent_runs = 1;
  // Of those, how many finished without intervention.
  int32 recent_completed = 2;
  // Of those, how many failed.
  int32 recent_failed = 3;
  // Of those, how many are still claiming to run.
  int32 recent_stuck = 4;

  // Requirement verdicts the owner has reviewed.
  int32 reviewed = 5;
  // Of those, how many the owner agreed with.
  int32 agreed = 6;
  // Agreement as a percentage of the gradeable rows; unset when none.
  optional double agreement_pct = 7;
  // Disagreements where one side said partial: the judge being unsure.
  int32 soft_disagreements = 8;
  // Disagreements between met and unmet: the judge being wrong.
  int32 hard_disagreements = 9;
  // Reviewed rows the owner could actually judge.
  int32 gradeable = 27;
  // Rows the owner could not judge from what they were shown. Excluded
  // from the agreement rate, and the most actionable number here: a
  // pile of them means retrieval is failing, which no prompt fixes.
  int32 ungradeable = 28;
  // Disagreements where the model said unmet and the owner did not.
  int32 too_harsh = 29;
  // Disagreements where the model credited more than the owner did.
  int32 too_generous = 30;

  // Runs that reached a result.
  int32 finished_runs = 10;
  // Median minutes to a result.
  optional double median_minutes = 11;
  // 95th percentile minutes to a result.
  optional double p95_minutes = 12;
  // Median minutes spent queued, reported apart from work.
  optional double median_queued_minutes = 13;

  // Thirty-day funnel: visitors who reached the landing page.
  int32 landed = 14;
  // Visitors who read an article.
  int32 read_writing = 15;
  // Visitors who clicked a call to action.
  int32 clicked = 16;
  // Visitors who submitted a registration.
  int32 registered = 17;
  // Visitors who verified their email.
  int32 verified = 18;
  // Visitors who signed in.
  int32 signed_in = 19;
  // Visitors who submitted a posting.
  int32 submitted = 20;

  // Model calls in the last 30 days.
  int32 calls = 21;
  // Of those, how many failed.
  int32 call_failures = 22;
  // Prompt tokens in the last 30 days.
  int64 prompt_tokens = 23;
  // Completion tokens in the last 30 days.
  int64 completion_tokens = 24;

  // Newest finished evaluation; unset before the first one.
  EvalRun latest_eval = 25;
  // Fit band against recorded outcomes.
  repeated OutcomeByFit outcomes = 26;
}

// One pipeline run: what produced a verdict and what it decided
// (data layer D2, table `jd_runs`).
message JdRun {
  // Stable run identifier; `llm_usage` and `decision_log` rows carry it.
  string run_id = 1;
  // 1 for the first run, 2 for the first re-score, and so on.
  int32 attempt = 2;
  // `submit` or `rescore`.
  string trigger = 3;
  // Admin who triggered a re-score; 0 for a submission.
  int64 triggered_by = 4;
  // running | ready | below_threshold | failed.
  string status = 5;
  // Why it failed, empty otherwise.
  string error = 6;
  // Build the api was running.
  string app_commit = 7;
  // Where the model ran.
  string host = 8;
  // Judge model as the gateway reported it.
  string model = 9;
  // Context window the sidecar was asked for.
  int32 num_ctx = 10;
  // Embedding model the corpus chunks were built with.
  string embedder_model = 11;
  // Prompt id to "version:hash" as JSON, so an edited prompt is visible
  // even when its version did not change.
  string prompts_json = 12;
  // Hash over the corpus documents this run could retrieve from.
  string corpus_fingerprint = 13;
  // Documents in the corpus at run time.
  int32 corpus_documents = 14;
  // Chunks in the corpus at run time.
  int32 corpus_chunks = 15;
  // Name of the arithmetic that produced the score.
  string score_formula = 16;
  // Mean top-K cosine, the cheap pre-score.
  optional double retrieval_score = 17;
  // Requirement-weighted score, the one the gate reads.
  optional double match_score = 18;
  // Gate in force for this run.
  optional double threshold = 19;
  // Fit band the score fell in.
  string fit = 20;
  // Requirements the posting was broken into.
  int32 requirement_count = 21;
  // Requirements judged met.
  int32 met_count = 22;
  // Requirements judged partly met.
  int32 partial_count = 23;
  // Requirements judged unmet.
  int32 unmet_count = 24;
  // Whether this run produced a tailored résumé.
  bool resume_generated = 25;
  // Time spent waiting for a pipeline slot.
  int64 queued_ms = 26;
  // Time spent working, once it held the slot.
  int64 duration_ms = 27;
  // When the run opened.
  google.protobuf.Timestamp started_at = 28;
  // When the run closed; unset while it is still running.
  google.protobuf.Timestamp finished_at = 29;
}

// Rescore-jd request.
message RescoreJdRequest {
  // Submission id (numeric, stringified).
  string submission_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
}

// Rescore-jd response.
message RescoreJdResponse {
  // Status the row was set to when the run was queued (`scoring`).
  JdStatus status = 1;
}

// Reindex-corpus request. `scope` picks the mount: `public` walks the
// committed content under CORPUS_ROOT (documents land as
// visibility=public); `private` walks CORPUS_PRIVATE_ROOT, where each
// top-level directory is a source_kind and every document lands as
// visibility=corpus_only. `source_kind` optionally narrows either
// scope to one kind.
message ReindexCorpusRequest {
  // Optional kind filter (e.g. `article`, `worksheet`). Empty walks
  // every kind in the scope. Validated against the ingest allow-list.
  string source_kind = 1 [(buf.validate.field).string.max_len = 40];
  // `public` (default) or `private`.
  string scope = 2 [(buf.validate.field).string.max_len = 16];
}

// Reindex-corpus response — mirrors ingest.WalkResult.
message ReindexCorpusResponse {
  // Absolute path the handler actually walked.
  string root = 1;
  // Visibility stamped on every document this run: public or corpus_only.
  string visibility = 8;
  // Source kinds that were walked, sorted.
  repeated string kinds_walked = 9;
  // Number of `.md` files the walker saw.
  int32 files_scanned = 2;
  // Number of files handed to the ingester without error. Includes
  // skipped-because-unchanged.
  int32 docs_ingested = 3;
  // Subset of docs_ingested whose content_hash matched the stored
  // row and did no chunk / embed work this run.
  int32 docs_skipped = 4;
  // Sum of newly-inserted chunk rows across all files this run.
  int32 chunks_inserted = 5;
  // Sum of chunks successfully embedded across all files this run.
  int32 chunks_embedded = 6;
  // Per-file error strings from files that failed mid-walk. Capped
  // at 20 entries so a broken directory can't produce an unbounded
  // response.
  repeated string errors = 7;
}

// List-jd-submissions request. No filters yet.
message ListJdSubmissionsRequest {}

// One row of the /admin/jd triage table.
message JdSubmissionRow {
  // Submission id (numeric, stringified).
  string id = 1;
  // Lifecycle status (mirrors JdStatus).
  JdStatus status = 2;
  // Aggregated match score in [0, 1]; unset before scoring runs.
  optional double match_score = 3;
  // First ~400 chars of the JD text so the admin can preview
  // without loading the full body.
  string text_head = 4;
  // Optional role the submitter typed on the form.
  string role_hint = 5;
  // Optional employer the submitter typed on the form.
  string employer_hint = 6;
  // Optional email the submitter provided for the tailored-résumé
  // handoff.
  string contact_email = 7;
  // Where the JD text came from (paste / pdf / text_upload).
  JdSource source = 8;
  // Truncated provider error when status is FAILED; empty otherwise.
  string error_message = 9;
  // Download path of the locked résumé PDF (without the token) when
  // status is READY; empty until then.
  string generated_resume_url = 10;
  // When the submission was received.
  google.protobuf.Timestamp created_at = 11;
  // When the terminal state was reached; unset while in-flight.
  google.protobuf.Timestamp completed_at = 12;
  // Retrieval pre-score (mean top-K cosine), diagnostics only, never a
  // gate; unset before scoring. match_score is the requirement-weighted
  // score the gate is applied to.
  optional double retrieval_score = 13;
  // Email of the signed-in member who submitted; empty for rows created
  // before JD upload became members-only.
  string submitter_email = 14;
  // Optional link to apply for the position, as given by the submitter.
  string apply_url = 15;
}

// List-jd-submissions response.
message ListJdSubmissionsResponse {
  // Rows, newest first (up to 500).
  repeated JdSubmissionRow submissions = 1;
  // Number of rows currently in a terminal READY state.
  int32 ready_count = 2;
  // Number that scored below the résumé gate (the strong band).
  int32 below_threshold_count = 3;
  // Number that failed during scoring / generation.
  int32 failed_count = 4;
  // Number still in flight (received / scoring / generating).
  int32 in_flight_count = 5;
}

// ---------------------------------------------------------------
// Decision log (human-in-the-loop review of the JD reviewer)
// ---------------------------------------------------------------

// One logged decision: what the model (or the code) decided, from
// what, and the owner's review of it. See docs/decision-log.md.
message DecisionLogRow {
  // Row id (numeric, stringified).
  string id = 1;
  // Decision kind: jd_requirement_verdict, jd_gate, ...
  string kind = 2;
  // What the decision belongs to (e.g. jd_submission).
  string ref_kind = 3;
  // Id of the ref (numeric, stringified).
  string ref_id = 4;
  // Item within the ref (requirement id); empty when per-ref.
  string key = 5;
  // Who decided: the gateway model name, or "code".
  string model = 6;
  // Prompt id that produced it; empty for code decisions.
  string prompt_id = 7;
  // Prompt version that produced it; 0 for code decisions.
  int32 prompt_version = 8;
  // Context window requested for the call; 0 for code decisions.
  int32 num_ctx = 9;
  // What it was decided from, as JSON (shape depends on kind).
  string input_json = 10;
  // What was decided, as JSON (shape depends on kind).
  string output_json = 11;
  // Exact system + user prompt sent; empty for code decisions.
  string prompt_text = 12;
  // Raw model output; empty for code decisions.
  string response_text = 13;
  // Prompt tokens as reported by the provider.
  int32 prompt_tokens = 14;
  // Completion tokens as reported by the provider.
  int32 completion_tokens = 15;
  // Call latency in milliseconds.
  int64 latency_ms = 16;
  // When the decision was made.
  google.protobuf.Timestamp created_at = 17;
  // The owner's verdict in the same vocabulary as the output; empty
  // until reviewed.
  string human_verdict = 18;
  // The owner's free-text note on the review.
  string human_note = 19;
  // User id of the reviewer (numeric, stringified); empty until reviewed.
  string reviewed_by = 20;
  // When the review was saved; unset until reviewed.
  google.protobuf.Timestamp reviewed_at = 21;
  // Why this call produced no usable verdict; empty when it produced
  // one. A row carrying it still carries prompt_text and
  // response_text, which is the point: the response that failed to
  // decode is the one worth reading, and it used to be the only one
  // not kept.
  string error = 22;
  // The wording the owner would have given, for a decision whose
  // output is prose rather than a label. This is what an adapter is
  // trained on: with response_text it forms a preference pair, and on
  // its own it is a supervised target. Empty for a classification
  // decision, where human_verdict is already the gold output, and
  // empty for an answer the owner thought was right.
  string human_answer = 23;
  // Per-rubric grades, e.g. grounded / citations / voice / scope /
  // length, each marked yes, partial, no or n/a. One overall verdict
  // cannot express an answer that is factually right and in the wrong
  // voice, and cannot produce the grounding and citation-validity
  // rates the chat acceptance criteria are stated in.
  map<string, string> human_dimensions = 24;
  // Milliseconds to the first token. Separate from latency_ms because
  // on a CPU-only box the first-token wait tracks how much context was
  // retrieved while the total tracks how much was written, and one
  // number cannot tell a retrieval regression from a verbose one. Zero
  // where it does not apply.
  int64 first_token_ms = 25;
}

// Filters for the decision-review list.
message ListDecisionLogRequest {
  // Restrict to one kind; empty for all kinds.
  string kind = 1;
  // Restrict to one ref id (e.g. a JD submission); empty for all.
  string ref_id = 2;
  // Only rows the owner has not reviewed yet.
  bool unreviewed_only = 3;
  // Page size, newest first; server caps at 500 (default 200).
  int32 limit = 4;
  // Only calls that produced no usable verdict. They are rare by
  // construction and are the rows most worth reading, so finding them
  // should not mean scrolling past two hundred successes.
  bool failed_only = 5;
}
// A page of logged decisions plus table-wide counts.
message ListDecisionLogResponse {
  // Rows, newest first.
  repeated DecisionLogRow decisions = 1;
  // Rows in the whole table, any kind.
  int64 total_count = 2;
  // Rows the owner has reviewed.
  int64 reviewed_count = 3;
}

// The owner's label for one decision.
message ReviewDecisionRequest {
  // Row id to label.
  string id = 1;
  // The owner's verdict; the vocabulary of the row's output (met /
  // partial / unmet for requirement verdicts).
  string human_verdict = 2;
  // Optional note explaining the label. Read by a human; never used as
  // a training target. A rewrite goes in human_answer.
  string human_note = 3;
  // The wording the owner would have given, for a decision whose
  // output is prose. Optional, and the single most valuable field on
  // this message: a graded answer with no correction can be counted,
  // while a graded answer with one can be learned from.
  string human_answer = 4;
  // Per-rubric grades for kinds that have a rubric (chat answers:
  // grounded, citations, voice, scope, length). Each value is yes,
  // partial, no or n/a. Unknown keys and values are rejected rather
  // than stored, because a grade nobody can interpret still counts in
  // a rate.
  map<string, string> human_dimensions = 5;
}
// Empty: success is the absence of an error.
message ReviewDecisionResponse {}

// A source shown beneath a Q&A bank answer.
message QaSource {
  // Title to display.
  string title = 1 [(buf.validate.field).string.max_len = 200];
  // Site path to link to.
  string path = 2 [(buf.validate.field).string.max_len = 256];
}

// One way of asking a bank entry's question.
message QaPhrasing {
  // Phrasing id (numeric, stringified).
  string id = 1;
  // The wording.
  string text = 2;
  // True for the phrasing generated from the entry's own question.
  // There is exactly one per entry and it cannot be deleted.
  bool canonical = 3;
  // Whether this phrasing has an embedding yet. A phrasing without one
  // never matches, so this is the difference between an entry being in
  // the bank and being reachable.
  bool embedded = 4;
}

// One owner-written answer, served verbatim.
message QaEntry {
  // Entry id (numeric, stringified).
  string id = 1;
  // The question as the owner would put it. Also used as a suggested
  // question, and it is the canonical phrasing.
  string question = 2;
  // The answer, in the owner's voice, served word for word. No model
  // ever rewrites this.
  string answer = 3;
  // Sources to show beneath the answer.
  repeated QaSource sources = 4;
  // Free tags for filtering and grouping.
  repeated string tags = 5;
  // Marks an entry that deliberately answers something the assistant
  // otherwise refuses: compensation, references, an employer matter,
  // something personal. Not enforcement; this is so every such
  // statement can be listed, and so opening one of those doors is a
  // deliberate act.
  bool covers_restricted = 6;
  // Enabling is the approval. A disabled entry is never matched.
  bool enabled = 7;
  // When it was written.
  google.protobuf.Timestamp created_at = 8;
  // When it last changed.
  google.protobuf.Timestamp updated_at = 9;
  // Every way of asking it, canonical first.
  repeated QaPhrasing phrasings = 10;
}

// Bank listing request.
message ListQaEntriesRequest {
  // Include entries that are not enabled. False for anything
  // member-facing.
  bool include_disabled = 1;
}
// The bank, newest first.
message ListQaEntriesResponse {
  // Entries.
  repeated QaEntry entries = 1;
  // Phrasings still waiting for an embedding across the whole bank. A
  // non-zero count means part of the bank cannot match yet.
  int32 awaiting_embedding = 2;
}

// New entry.
message CreateQaEntryRequest {
  // The question.
  string question = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }];
  // The answer, served verbatim.
  string answer = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 8000
  }];
  // Sources to show beneath it.
  repeated QaSource sources = 3;
  // Tags.
  repeated string tags = 4;
  // Whether this deliberately answers an otherwise-refused topic.
  bool covers_restricted = 5;
  // Whether to approve it now.
  bool enabled = 6;
  // Extra ways of asking it; the question itself is added
  // automatically.
  repeated string phrasings = 7;
}
// The new entry.
message CreateQaEntryResponse {
  // Entry id (numeric, stringified).
  string id = 1;
}

// Entry edit.
message UpdateQaEntryRequest {
  // Entry to change.
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // The question. Changing it clears the canonical phrasing's vector.
  string question = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }];
  // The answer.
  string answer = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 8000
  }];
  // Sources.
  repeated QaSource sources = 4;
  // Tags.
  repeated string tags = 5;
  // Whether this deliberately answers an otherwise-refused topic.
  bool covers_restricted = 6;
  // Whether it is approved.
  bool enabled = 7;
}
// Empty: success is the absence of an error.
message UpdateQaEntryResponse {}

// Approval change.
message SetQaEntryEnabledRequest {
  // Entry to approve or withdraw.
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // True approves it.
  bool enabled = 2;
}
// Empty: success is the absence of an error.
message SetQaEntryEnabledResponse {}

// Entry removal.
message DeleteQaEntryRequest {
  // Entry to delete.
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}
// Empty: success is the absence of an error.
message DeleteQaEntryResponse {}

// New phrasing.
message AddQaPhrasingRequest {
  // Entry it belongs to.
  string entry_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // The wording.
  string text = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }];
}
// The new phrasing.
message AddQaPhrasingResponse {
  // Phrasing id (numeric, stringified).
  string id = 1;
}

// Phrasing removal.
message DeleteQaPhrasingRequest {
  // Entry it belongs to.
  string entry_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // Phrasing to remove. The canonical one cannot be removed.
  string phrasing_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}
// Empty: success is the absence of an error.
message DeleteQaPhrasingResponse {}

// Selects which rows the JSONL export includes.
message ExportDecisionLogRequest {
  // Only rows the owner has reviewed (the training set); false exports
  // everything.
  bool reviewed_only = 1;
}
// The rendered export.
message ExportDecisionLogResponse {
  // JSON Lines, one decision per line, oldest first.
  string jsonl = 1;
  // Number of lines in jsonl.
  int32 row_count = 2;
}

// ---------------------------------------------------------------
// JD fit bands
// ---------------------------------------------------------------

// Read request.
message GetJdFitBandsRequest {}

// The bands in force and who last changed them.
message GetJdFitBandsResponse {
  // Current bands.
  JdFitBands bands = 1;
}

// New bands; must satisfy 0 < weak < possible < strong < very_strong <= 1.
message SetJdFitBandsRequest {
  // The bands to store.
  JdFitBands bands = 1;
}

// The bands as stored.
message SetJdFitBandsResponse {
  // Stored bands.
  JdFitBands bands = 1;
}

// One bookable range on one weekday. Held as minutes from local
// midnight rather than as a clock time, so a window survives a
// daylight-saving change underneath it instead of drifting an hour.
message SchedulerWindow {
  // Day of the week, 0 for Sunday through 6 for Saturday, matching
  // Go's time.Weekday so the server needs no translation table.
  int32 weekday = 1;
  // Minutes from local midnight at which the window opens.
  int32 start_minutes = 2;
  // Minutes from local midnight at which it closes. Must be after the
  // start and inside the same day.
  int32 end_minutes = 3;
}

// The owner's availability, as the admin surface edits it.
message SchedulerSettings {
  // IANA zone name, for example "America/New_York". Never a fixed
  // offset: an offset is correct for half the year and silently an
  // hour wrong for the other half.
  string zone = 1;
  // Meeting lengths a member may choose, in minutes.
  repeated int32 duration_minutes = 2;
  // Clearance between meetings, in minutes, applied on both sides of a
  // candidate. Not carved out of the grid in advance: nothing is held
  // until something is booked.
  int32 gap_minutes = 3;
  // How finely start times are offered, in minutes.
  int32 step_minutes = 4;
  // Most meetings that may be taken in one day.
  int32 max_per_day = 5;
  // How far ahead the earliest bookable slot sits, in hours.
  int32 lead_hours = 6;
  // How many days ahead the calendar is offered.
  int32 horizon_days = 7;
  // The weekly windows. Two windows on one day are how a lunch break
  // is expressed; one range with a break bolted on later is the usual
  // way this ends up wrong.
  repeated SchedulerWindow windows = 8;
}

// Request for GetSchedulerSettings.
message GetSchedulerSettingsRequest {}

// The settings in force.
message GetSchedulerSettingsResponse {
  // Current settings.
  SchedulerSettings settings = 1;
  // False when the calendar provider is not connected or unreachable,
  // so the surface can say booking is off rather than implying these
  // windows are live.
  bool calendar_connected = 2;
  // Why the calendar is not usable, when calendar_connected is false.
  string calendar_status = 3;
}

// Replacement settings. Refused whole if any part is invalid.
message SetSchedulerSettingsRequest {
  // The settings to store.
  SchedulerSettings settings = 1;
}

// The settings as stored.
message SetSchedulerSettingsResponse {
  // Stored settings.
  SchedulerSettings settings = 1;
}

// Request for GetCalendarConnectURL.
message GetCalendarConnectURLRequest {}

// Where to send the owner to authorise.
message GetCalendarConnectURLResponse {
  // The full consent URL, including the signed state.
  string url = 1;
}

// The authorisation code Google handed back.
message ConnectCalendarRequest {
  // The one-time code from the callback's query string.
  string code = 1 [(buf.validate.field).string.min_len = 1];
  // The state from the callback, verified against the one issued.
  string state = 2 [(buf.validate.field).string.min_len = 1];
}

// The connection as stored.
message ConnectCalendarResponse {
  // Current status after connecting.
  CalendarStatus status = 1;
}

// Request for GetCalendarStatus.
message GetCalendarStatusRequest {}

// Whether a calendar is connected, and whether it is working.
message CalendarStatus {
  // True when this deployment has the client credentials and sealing
  // key needed to connect at all. False means set the environment
  // variables, which is a different fix from pressing connect.
  bool configured = 1;
  // True when a credential is stored.
  bool connected = 2;
  // The Google account that authorised, for the owner to recognise.
  string account_email = 3;
  // Which calendar is written to; "primary" is the account's own.
  string calendar_id = 4;
  // Scopes Google actually granted, so a consent screen that returned
  // less than was asked for is visible rather than surfacing later as
  // a puzzling refusal.
  string scopes = 5;
  // When the owner connected it.
  google.protobuf.Timestamp connected_at = 6;
  // When Google last answered successfully. Absent means it has never
  // worked, which is different from having stopped.
  google.protobuf.Timestamp last_ok_at = 7;
  // Why the last call failed, if it did. Empty when healthy.
  string last_error = 8;
}

// The current connection.
message GetCalendarStatusResponse {
  // Current status.
  CalendarStatus status = 1;
}

// Request for DisconnectCalendar.
message DisconnectCalendarRequest {}

// The connection after forgetting the credential.
message DisconnectCalendarResponse {
  // Current status.
  CalendarStatus status = 1;
}

// One booked meeting, as the owner sees it. Carries who booked it,
// which the member-facing message deliberately does not.
message AdminMeeting {
  // Stable id, used to cancel.
  int64 id = 1;
  // When it begins.
  google.protobuf.Timestamp start = 2;
  // When it ends.
  google.protobuf.Timestamp end = 3;
  // Length in minutes, as booked.
  int32 duration_minutes = 4;
  // What the member said they wanted to discuss.
  string topic = 5;
  // The member's name, as held on their account.
  string member_name = 6;
  // The member's email.
  string member_email = 7;
  // The member's account id, 0 when the row has none.
  int64 member_id = 8;
  // The calendar event this created. Empty means the claim exists here
  // but no event was made, which is worth seeing.
  string event_id = 9;
  // When the booking was made.
  google.protobuf.Timestamp created_at = 10;
  // Set when cancelled. Cancelled rows are kept rather than deleted, so
  // a meeting that vanished can be explained.
  google.protobuf.Timestamp cancelled_at = 11;
  // video | phone, or empty for a booking made before this was asked.
  string meeting_type = 12;
  // google_meet | teams | zoom, when the type is video.
  string video_provider = 13;
  // The number the member will call from, when the type is phone.
  // Empty on a phone meeting means they said it is in the comments.
  string phone_number = 14;
}

// Request for ListMeetings.
message ListMeetingsRequest {
  // Include meetings that have already happened or been cancelled.
  bool include_past = 1;
}

// Booked meetings.
message ListMeetingsResponse {
  // Meetings, soonest first.
  repeated AdminMeeting meetings = 1;
  // IANA zone the times should be rendered in.
  string zone = 2;
}

// Request for CancelMeetingAsAdmin.
message CancelMeetingAsAdminRequest {
  // Which meeting to cancel.
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

// The meeting after cancelling.
message CancelMeetingAsAdminResponse {
  // The cancelled meeting.
  AdminMeeting meeting = 1;
}

// Read request.
message GetJdSubmissionLimitRequest {}

// The limit in force.
message GetJdSubmissionLimitResponse {
  // Postings one member may submit per rolling window.
  int32 limit = 1;
  // How long the window is, in hours.
  int32 window_hours = 2;
}

// A new limit.
message SetJdSubmissionLimitRequest {
  // Postings one member may submit per rolling window. 0 removes the
  // cap, which on a box that reviews one posting an hour means one
  // member with a script can fill the queue indefinitely.
  int32 limit = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
}

// The limit as stored.
message SetJdSubmissionLimitResponse {
  // Stored limit.
  int32 limit = 1;
  // How long the window is, in hours.
  int32 window_hours = 2;
}


// Empty.
message GetOpsStatusRequest {}

// Which job to describe.
message GetJobDetailRequest {
  // The runner id, as GetOpsStatus reports it.
  string job_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

// One job and everything it reported while it ran.
message GetJobDetailResponse {
  // The job itself, the same row GetOpsStatus lists.
  JobRow job = 1;
  // Every progress report, oldest first, capped by the runner.
  repeated JobEvent events = 2;
  // True when the runner dropped older events at its cap, so a reader
  // knows the timeline starts mid-run rather than at the beginning.
  bool truncated = 3;
}

// One progress report, kept with the time it arrived. The gap between
// consecutive events is the measurement; the text is only how the job
// described what it was doing.
message JobEvent {
  // When the report arrived.
  google.protobuf.Timestamp at = 1;
  // Percent complete at that moment, 0 when the job does not report it.
  int32 progress = 2;
  // What the job said it was doing.
  string summary = 3;
  // The record this report is about, empty when there is none. Opaque
  // to the runner: the job that reports the event chooses the form.
  // An evaluation writes "eval:<run id>:<golden id>", with golden id 0
  // meaning the run itself, so the console can open a posting's result
  // from its line in the timeline instead of parsing the summary.
  string ref = 4;
}

// What the box is doing.
//
// The reason this exists: the job runner keeps jobs in memory, so a
// deploy recreates the api container and any running job dies with it.
// That happened twice on 2026-09-24, the second time losing an
// evaluation seven postings in. A deploy is safe or unsafe depending on
// this answer, and it was not visible anywhere.
message GetOpsStatusResponse {
  // Jobs the runner still remembers, newest first. Finished jobs are
  // forgotten after a day.
  repeated JobRow jobs = 1;
  // True when any job is running or queued, which is the one thing to
  // check before deploying.
  bool busy = 2;
  // Submissions by pipeline status.
  repeated PipelineCount pipeline = 3;
  // The most recent evaluation, running or not.
  EvalRun latest_eval = 4;
  // Model calls in the last hour.
  int32 calls_last_hour = 5;
  // Of those, how many failed.
  int32 call_failures_last_hour = 6;
  // Average seconds per call in the last hour.
  double avg_call_seconds = 7;
  // Host load average over one minute, as the kernel reports it.
  double load_1 = 8;
  // Over five minutes.
  double load_5 = 9;
  // Total host memory in megabytes.
  int32 mem_total_mb = 10;
  // Host memory available in megabytes.
  int32 mem_available_mb = 11;
  // Free disk in gigabytes on the filesystem the api is running from.
  int32 disk_free_gb = 12;
  // Total disk in gigabytes on that filesystem.
  int32 disk_total_gb = 13;
  // Anything this snapshot could not read. A section that failed and a
  // section that is genuinely empty look identical otherwise, and on
  // 2026-09-25 that difference hid a broken query behind the words "no
  // submissions" for as long as nobody read the logs.
  repeated string warnings = 14;
}

// One job the runner remembers.
message JobRow {
  // Runner id.
  string id = 1;
  // Which kind of work.
  string kind = 2;
  // queued, running, succeeded, failed or cancelled.
  string status = 3;
  // Percent complete, 0 when the job does not report progress.
  int32 progress = 4;
  // What it is doing, or what it finished with.
  string summary = 5;
  // When it started.
  google.protobuf.Timestamp started_at = 6;
  // When it ended; unset while running.
  google.protobuf.Timestamp finished_at = 7;
}

// How many submissions sit at one pipeline status.
message PipelineCount {
  // The status.
  string status = 1;
  // How many.
  int32 count = 2;
  // The oldest one still at this status, for spotting something stuck.
  google.protobuf.Timestamp oldest = 3;
}

// Asks for the decision test's timings.
message GetDecisionTestSettingsRequest {}

// The decision test's timings, with the instrument version they produce.
message GetDecisionTestSettingsResponse {
  // How long the number to hold is shown, in milliseconds.
  int32 memorise_ms = 1;
  // Hard limit per question, covering reading, deciding and rating.
  int32 question_ms = 2;
  // Limit on entering the number at the end of a block.
  int32 recall_ms = 3;
  // Derived from the three above, and stored on every session taken
  // under them. Shown so the owner can see that changing a timing
  // changes the instrument.
  string instrument_version = 4;
  // How many sessions have already been recorded under this version.
  // Changing a timing starts a new one, which is the cost of the change.
  int32 sessions_on_this_version = 5;
}

// Changes the decision test's timings.
message SetDecisionTestSettingsRequest {
  // How long the number to hold is shown. Clamped to 1 to 30 seconds.
  int32 memorise_ms = 1 [(buf.validate.field).int32.gte = 0];
  // Hard limit per question. Clamped to 5 to 120 seconds, because a
  // question nobody can answer in time is not a harder test, it is an
  // unanswerable one.
  int32 question_ms = 2 [(buf.validate.field).int32.gte = 0];
  // Limit on entering the number. Clamped to 5 to 120 seconds.
  int32 recall_ms = 3 [(buf.validate.field).int32.gte = 0];
}

// The timings after the change.
message SetDecisionTestSettingsResponse {
  // The instrument version now in force.
  string instrument_version = 1;
}

// Asks for the list of runs.
message ListDecisionTestRunsRequest {
  // Include runs driven by an agent rather than taken by a person.
  // Excluded by default, because they are not data.
  bool include_synthetic = 1;
  // Only runs with this review status. Empty returns everything;
  // "unreviewed" returns the queue, which is the common case when the
  // point of opening the page is to work through it.
  string review_status = 2 [(buf.validate.field).string.max_len = 24];
}

// Runs, newest first.
message ListDecisionTestRunsResponse {
  // The queue, counted across every real run regardless of the filter,
  // so the page can say how much is left without a second call.
  DecisionTestReviewCounts counts = 2;
  // The runs.
  repeated DecisionTestRun runs = 1;
  // Each category's room to vary.
  //
  // On the list rather than tucked away, because a pool that cannot
  // vary is the one fault here that looks exactly like success: the
  // draw runs, every block is balanced, and every participant sits the
  // same test.
  repeated DecisionTestItemPool item_pools = 3;
}

// One run, summarised for a list.
message DecisionTestRun {
  // Opaque handle, used to open the run.
  string session_key = 1;
  // running, completed or abandoned. Abandoned runs are kept, because
  // where people stop measures the fifteen-minute burden.
  string status = 2;
  // Who, where they gave a name. Empty is the normal case.
  string display_name = 3;
  // Banded age, education and occupation, each empty where not given.
  string age_range = 4;
  // Highest level of education completed.
  string education = 5;
  // Free-text occupation.
  string occupation = 6;
  // Whether an address was left, rather than the address itself.
  bool gave_email = 7;
  // sound or visual.
  string audio_mode = 8;
  // desktop, tablet or phone.
  string device_class = 9;
  // Whether the tap-along check was passed.
  bool tap_check_passed = 10;
  // Unloaded synchronisation offset from the tap check, in ms.
  int32 baseline_rt_ms = 11;
  // A second or later run by the same person, flagged not blocked.
  bool is_repeat = 12;
  // Driven by an agent rather than taken by a person.
  bool is_synthetic = 13;
  // The timings and item set this run was taken under. Runs on
  // different versions are different instruments and must not be pooled.
  string instrument_version = 14;
  // Which items, in which order.
  string item_set_version = 15;
  // Questions answered correctly, of those scored.
  int32 correct = 16;
  // Questions presented.
  int32 answered = 17;
  // Questions that ran out of time, which is its own outcome.
  int32 expired = 18;
  // Mean confidence across the run, 0 to 100.
  int32 mean_confidence = 19;
  // Seconds from start to finish, zero while still running.
  int32 duration_s = 20;
  // When it started, RFC3339.
  string started_at = 21;
  // Curation (M9). Empty status means nobody has looked at it yet,
  // which is a state rather than a verdict.
  string review_status = 22;
  // Why it was excluded. Only set alongside do_not_use.
  string review_reason = 23;
  // The reviewer's note.
  string review_note = 24;
  // When it was reviewed, RFC3339, empty if it has not been.
  string reviewed_at = 25;
  // How many of its blocks are individually excluded. Non-zero on a run
  // whose own status is not do_not_use is the case this exists for: a
  // spoiled block inside an otherwise good run.
  int32 blocks_excluded = 26;
  // What the participant said about holding the number: encode or
  // defer. Asked in the debrief, because the two produce different
  // loads during the questions and an uncontrolled variable becomes a
  // recorded one.
  string recall_strategy = 27;
  // Variability of the tap-check presses, a cheap read on baseline
  // attention. Sits beside baseline_rt_ms, which the list already had:
  // a slow participant is only interesting against their own unloaded
  // speed, and a jittery one against their own steadiness.
  int32 baseline_rt_sd_ms = 28;
  // How a repeat was recognised: account, email or cookie. Descending
  // reliability, and worth knowing which: a cookie match is defeated by
  // a private window, so it is weaker evidence than an account.
  string repeat_matched_by = 29;
  // Which sitting this was for this participant, 1 for a first run.
  // Zero means no identity could place the run at all, which is a
  // different statement from "first" and must not be read as one.
  int32 attempt_no = 30;
  // The same number read from the single most reliable identity that
  // had an answer, rather than from the union of all three. Published
  // beside attempt_no so a reader can see both; they differ when the
  // identities saw different histories.
  int32 attempt_no_strongest = 31;
  // Which identity produced attempt_no: account, email, cookie, or
  // none. A sequence resting on a cookie is weaker evidence than one
  // resting on an account, and the reviewer decides what that is worth.
  string attempt_source = 32;
  // The two readings disagree, so the sequence needs a human rather
  // than a default.
  bool attempt_sources_disagree = 33;
  // Deprecated: use prior_sittings, which can express a zero.
  //
  // These three shipped as plain int32 and cannot carry the one
  // distinction they exist for. Under proto3 implicit presence a scalar
  // equal to its default is omitted from the JSON entirely, so a link
  // that existed and saw zero prior sittings arrives indistinguishable
  // from a link that never existed at all.
  //
  // They are kept and still populated, because career.v1 is
  // additive-only and a published field is not edited in place. A
  // reader that uses them gets the lossy answer, which is why the
  // replacement sits beside them rather than quietly reusing a number.
  int32 prior_by_account = 34 [deprecated = true];
  // Deprecated: use prior_sittings.
  int32 prior_by_email = 35 [deprecated = true];
  // Deprecated: use prior_sittings.
  int32 prior_by_cookie = 36 [deprecated = true];
  // Which answer key graded this run. Part of the provenance triple
  // with instrument_version and item_set_version.
  string key_version = 37;
  // Whether the participant asked for their results.
  bool wants_results = 38;
  // When it ended, RFC3339, empty while still running.
  string finished_at = 39;
  // Who signed the current verdict. A curated dataset whose exclusions
  // cannot be attributed has anonymous decisions in it.
  string reviewed_by_name = 40;
  // What each identity could see when the run started, as recorded.
  //
  // A message rather than three scalars, because a message has natural
  // presence: each field can distinguish "this link existed and saw
  // nothing" from "there was no such link", which is the entire reason
  // three observations are stored instead of one derived number.
  DecisionTestPriorSittings prior_sittings = 41;
}

// Prior sittings each identity could see at the moment a run started.
//
// Point-in-time observations, not a conclusion. The sitting number is
// derived from them in SQL (dt_attempt_no and friends), so the sequence
// can be recomputed under a different rule later without the raw
// observations having been thrown away.
//
// Every field is `optional`: absent means there was no such link, and
// zero means there was one and it saw no earlier sittings. Collapsing
// those two would manufacture a fact about a person.
message DecisionTestPriorSittings {
  // Prior sittings visible by account at the moment this run started.
  optional int32 by_account = 1;
  // Prior sittings visible by email address at the moment this started.
  optional int32 by_email = 2;
  // Prior sittings visible by visitor cookie at the moment this started.
  optional int32 by_cookie = 3;
}

// One of a run's thirty questions, as drawn.
message DecisionTestDrawnItem {
  // Position in the whole test, 1-based.
  int32 position = 1;
  // Which block it falls in.
  int32 block_no = 2;
  // Stable item code.
  string item_code = 3;
  // arithmetic, base_rate, conjunction or syllogism.
  string family = 4;
  // Whether the participant ever reached it.
  //
  // The reason this list exists separately from the answers: an
  // abandoned run has six answers and says nothing about the
  // twenty-four questions that had already been chosen for it.
  bool answered = 5;
  // A placeholder from the fixture bank rather than a real item. Always
  // false in production, where fixtures are refused.
  bool fixture = 6;
}

// One category's room to vary.
message DecisionTestItemPool {
  // arithmetic, base_rate, conjunction or syllogism.
  string category = 1;
  // Active scored items in this category, real ones only.
  int32 real_items = 2;
  // Placeholders, which production never serves.
  int32 fixtures = 3;
  // How many a single test consumes.
  int32 per_test = 4;
  // real_items minus per_test. Negative means a test cannot be filled.
  int32 spare = 5;
  // Whether there is anything to leave behind.
  //
  // False means every participant is served the same questions however
  // random the selection claims to be, which is the failure that looks
  // exactly like success.
  bool can_vary = 6;
}

// Asks for the decision test's analysis views.
message GetDecisionTestAnalysisRequest {}

// The three views that answer the research question.
//
// Each is grouped by instrument, because runs taken under different
// items or different timings are different instruments and must never
// pool into one claim (FR-DT-15).
message GetDecisionTestAnalysisResponse {
  // Accuracy and confidence by load level.
  repeated DecisionTestLoadPoint load_curve = 1;
  // What each confidence band actually achieved.
  repeated DecisionTestCalibrationPoint calibration = 2;
  // Per participant, the lowest load at which they were confidently
  // wrong.
  repeated DecisionTestThreshold thresholds = 3;
}

// One load level on the curve.
message DecisionTestLoadPoint {
  // Which items, so two item sets never pool.
  string item_set_version = 1;
  // Which timings, so two instruments never pool.
  string instrument_version = 2;
  // d3, d4, d4_plus1, d4_plus3 or d3_control.
  string load = 3;
  // Ordering on the ramp. d3_control ranks 1, the same as d3, because
  // it is d3: block 5 returns to block 1's difficulty.
  int32 load_rank = 4;
  // Runs contributing to this point.
  int32 sessions = 5;
  // Of those, how many nobody has reviewed yet.
  int32 sessions_unreviewed = 6;
  // First sittings, and repeats, counted apart.
  int32 sessions_first_attempt = 7;
  // Second or later sittings by the same participant.
  int32 sessions_repeat = 8;
  // Answers behind this point.
  int32 answers = 9;
  // Correct, as a percentage.
  int32 accuracy_pct = 10;
  // How often the intended wrong answer was taken.
  int32 lure_pct = 11;
  // How often the clock ran out.
  int32 expiry_pct = 12;
  // Mean reported confidence.
  int32 mean_confidence = 13;
  // Confidence minus accuracy. Positive is more sure than right, which
  // is the finding this instrument exists to measure.
  int32 gap_pct = 14;
  // Wrong and reported at or above the confident threshold.
  int32 confidently_wrong_pct = 15;
  // Mean Brier score, 0 is perfect calibration.
  double mean_brier = 16;
  // The item families behind this point, joined with '+'. One family
  // means the point measures the family rather than the load.
  string families = 17;
}

// One confidence band at one load.
message DecisionTestCalibrationPoint {
  // Which items.
  string item_set_version = 1;
  // Which timings.
  string instrument_version = 2;
  // The load this band was measured at.
  string load = 3;
  // Ordering on the ramp.
  int32 load_rank = 4;
  // The band, in tens: 10 is 10 to 19 percent confident.
  int32 confidence_band = 5;
  // Answers in this band.
  int32 answers = 6;
  // What the band actually achieved.
  int32 accuracy_pct = 7;
  // Confidence minus accuracy for this band. Positive is overclaiming.
  int32 overclaim_pct = 8;
  // Mean Brier score for the band.
  double mean_brier = 9;
}

// One participant's threshold.
message DecisionTestThreshold {
  // The run, so the console can link to it.
  string session_key = 1;
  // Which sitting this was. Zero means no identity could place it.
  int32 attempt_no = 2;
  // Curation status, empty where nobody has judged it.
  string review_status = 3;
  // Accuracy across the run.
  int32 accuracy_pct = 4;
  // Confidence minus accuracy across the run.
  int32 gap_pct = 5;
  // Block 5 against block 1, which are the same difficulty. Negative
  // means accuracy fell by the end.
  int32 fatigue_delta_pct = 6;
  // The lowest rank on the ramp at which they were confidently lured.
  // Zero means it never happened.
  int32 lured_at_rank = 7;
  // That rank's load, as a name.
  string lured_at_load = 8;
  // Whether it happened in block 5, the fatigue control. That is a
  // different claim from being lured on the hardest block.
  bool lured_in_control = 9;
  // How many answers in the run were wrong and confident.
  int32 confidently_wrong = 10;
}

// Asks for one run as downloadable files.
message ExportDecisionTestRunRequest {
  // Which run, from the list.
  string session_key = 1 [(buf.validate.field).string.max_len = 64];
  // Add the prompt, the chosen option and the correct option to the
  // answers file.
  //
  // Off by default, matching the collapsed section on the run page. An
  // answer key that escapes contaminates a standardized instrument
  // permanently, and a file is easier to forward than a screen. The
  // whole-dataset export never carries these at all (FR-DT-16); this is
  // one run, downloaded deliberately.
  bool include_key = 2;
}

// One run as two CSV files.
message ExportDecisionTestRunResponse {
  // Base filename, without an extension or a suffix.
  string filename_stem = 1;
  // The by-block table, one row per block, with the session context on
  // every row so the file stands alone.
  string blocks_csv = 2;
  // The every-answer table, one row per answer, same context.
  string answers_csv = 3;
  // Rows in the blocks file, excluding its header.
  int32 block_rows = 4;
  // Rows in the answers file, excluding its header.
  int32 answer_rows = 5;
}

// Asks for one run in full.
message GetDecisionTestRunRequest {
  // From the list.
  string session_key = 1 [(buf.validate.field).string.max_len = 64];
}

// One run in full.
message GetDecisionTestRunResponse {
  // The run's summary.
  DecisionTestRun run = 1;
  // One row per block, in running order.
  repeated DecisionTestBlock blocks = 2;
  // Every answer, in presentation order.
  repeated DecisionTestAnswer answers = 3;
  // Every judgement ever recorded for this run, oldest first.
  repeated DecisionTestReviewEvent review_history = 4;
  // The thirty questions this run was drawn, in order, including any it
  // never reached.
  repeated DecisionTestDrawnItem drawn_items = 5;
}

// Asks for the dataset as CSV.
message ExportDecisionTestDataRequest {
  // Include runs driven by an agent rather than a person. Off by
  // default: a synthetic run is useful for checking the instrument and
  // ruinous if it is averaged into a claim about people, so including
  // it has to be asked for.
  bool include_synthetic = 1;
  // Include runs and blocks the owner marked do_not_use. Off by
  // default, because curation that does not reach the export is
  // decoration: the export is the thing that leaves for analysis, and
  // shipping a run marked unusable is worse than not curating at all,
  // since the mark creates a belief the data has been cleaned.
  bool include_excluded = 2;
}

// Records a curation judgement.
message ReviewDecisionTestRunRequest {
  // Which run.
  string session_key = 1 [(buf.validate.field).string.max_len = 64];
  // 0 judges the whole run; 1 to 5 judges one block, so a single
  // spoiled block does not cost the other four.
  int32 block_no = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 5
  }];
  // good, incomplete, hold or do_not_use. Empty clears a run's review
  // back to unreviewed, and for a block removes the judgement
  // altogether, since a block has no stored unreviewed state.
  string status = 3 [(buf.validate.field).string.max_len = 24];
  // instrument_fault, participant_reported, duplicate or other, and
  // only alongside do_not_use. The first two are the split that earns
  // this field: one is a bug to go and repair, the other is nothing to
  // fix and simply costs a data point.
  string reason = 4 [(buf.validate.field).string.max_len = 32];
  // Free text, for what the participant said or what was observed.
  string note = 5 [(buf.validate.field).string.max_len = 2000];
}

// The run as it now reads.
message ReviewDecisionTestRunResponse {
  // The updated summary, so the caller does not have to refetch to
  // render the new state.
  DecisionTestRun run = 1;
}

// The dataset.
message ExportDecisionTestDataResponse {
  // The whole file, RFC 4180, header row first. Thirty rows per
  // completed run, so this stays small enough to hand over in one
  // response for as long as the volunteer count is realistic.
  string csv = 1;
  // Suggested filename, carrying the date so two exports do not
  // overwrite each other in a downloads folder.
  string filename = 2;
  // Rows in the body, not counting the header.
  int32 rows = 3;
  // Runs those rows came from.
  int32 sessions = 4;
}

// How many real runs sit in each curation state.
message DecisionTestReviewCounts {
  // Every real run. Synthetic runs are excluded throughout: they await
  // nobody's judgement and counting them would invent work.
  int32 total = 1;
  // Nobody has looked at it yet.
  int32 unreviewed = 2;
  // Judged usable.
  int32 good = 3;
  // Did not finish, and not thereby excluded: whether an interrupted
  // run is usable is judged per run.
  int32 incomplete = 4;
  // Something is odd and the reviewer has not decided.
  int32 hold = 5;
  // Excluded from every view that makes a claim about people, and from
  // the export by default. Never deleted.
  int32 do_not_use = 6;
}

// One block of a run.
message DecisionTestBlock {
  // 1 to 5.
  int32 block_no = 1;
  // d3, d4, d4_plus1, d4_plus3 or d3_control.
  string load = 2;
  // Correct answers in this block.
  int32 correct = 3;
  // Questions in this block.
  int32 total = 4;
  // Intuitive wrong answers chosen.
  int32 lure = 5;
  // Questions that ran out of time.
  int32 expired = 6;
  // Mean confidence in this block, 0 to 100.
  int32 mean_confidence = 7;
  // Mean time to answer, in milliseconds.
  int32 mean_latency_ms = 8;
  // The number that was shown.
  string presented_digits = 9;
  // What a correct response was, after any transformation.
  string expected_digits = 10;
  // What came back.
  string response_digits = 11;
  // exact, untransformed, wrong_digits, partial or expired.
  // untransformed means the number survived and the operation did not.
  string recall_outcome = 12;
  // How much of the number was lost, 0 to 100. Zero is a number held
  // intact, 100 one lost entirely. Scored against whichever of the
  // presented or expected number the response is closer to, so an
  // untransformed answer reads as perfect retention rather than as
  // total loss. Negative where the recall expired and nothing was
  // attempted, which is not a memory failure of any size.
  int32 memory_failure_pct = 13;
  // Curation for this block alone, so one spoiled block costs six
  // answers rather than thirty. Empty means nobody has judged it.
  string review_status = 14;
  // The note attached to this block's judgement.
  string review_note = 15;
  // Digit positions matching the expected number, after any
  // transformation the block required.
  int32 digits_correct = 16;
  // Digit positions that survived, scored against whichever of the
  // presented or the expected number the response is closer to. This is
  // what memory_failure_pct is derived from, and why an untransformed
  // answer reads as full retention: the number was held and only the
  // operation failed. Not the length of the number.
  int32 digits_held = 17;
  // How long the participant took to give the number back, in ms.
  int32 recall_latency_ms = 18;
  // Mean latency for this block in units of the tap-check offset, from
  // v_dt_blocks. Where the ratio earns its place: the load effect is
  // the research question, and comparing block 1 with block 4 across
  // participants needs each person's answers on their own scale.
  double mean_latency_vs_baseline = 19;
}

// One answer.
message DecisionTestAnswer {
  // Position in the whole test, 1-based.
  int32 position = 1;
  // Which block it belonged to.
  int32 block_no = 2;
  // Stable item code, e.g. A1 or D4.
  string item_code = 3;
  // arithmetic, base_rate, conjunction or syllogism.
  string item_family = 4;
  // correct, lure, other or expired.
  string outcome = 5;
  // The participant's own rating, 0 to 100.
  int32 confidence = 6;
  // Time to answer, in milliseconds.
  int32 latency_ms = 7;
  // The question as it was put.
  string prompt = 8;
  // The option the participant chose, as text. Empty on an expiry,
  // where nothing was chosen at all.
  string chosen_text = 9;
  // The option that was correct, as text.
  //
  // Admin-only and deliberately so. This is never served to a
  // participant and never leaves in the CSV export, whose view carries
  // no chosen_index and no prompt precisely so the answer key cannot be
  // reconstructed from it (FR-DT-16). The owner built the instrument
  // and cannot judge whether a run is usable without seeing what was
  // actually picked.
  string correct_text = 10;
  // Zero-based index of the chosen option, -1 where it expired.
  int32 chosen_index = 11;
  // Position within its own block, 1-based.
  int32 position_in_block = 12;
  // Which revision of the item was served.
  int32 item_version = 13;
  // The intuitive wrong answer was taken.
  bool is_lure = 14;
  // Wrong, and reported at or above the confident threshold. This is
  // the research question in one field.
  bool confidently_wrong = 15;
  // Took the lure and was confident about it.
  bool confidently_lured = 16;
  // Time to answer against this participant's own unloaded baseline,
  // as a ratio. 1.0 is baseline speed.
  double latency_vs_baseline = 17;
  // Brier score for this answer, 0 is perfect calibration and 1 is
  // maximally wrong. Negative where it could not be scored.
  double brier = 18;
}

// One entry in a run's curation history.
//
// Every judgement is appended, including a clearing, so an exclusion
// can always be explained. Written since migration 00056 and readable
// only through the SQL console until now.
message DecisionTestReviewEvent {
  // 0 for a verdict on the whole run, 1 to 5 for one block.
  int32 block_no = 1;
  // The status recorded, or "cleared" where a block judgement was
  // removed.
  string status = 2;
  // Why, where one was given.
  string reason = 3;
  // The reviewer's note at the time.
  string note = 4;
  // Who recorded it.
  string reviewed_by = 5;
  // When, RFC3339.
  string created_at = 6;
}
