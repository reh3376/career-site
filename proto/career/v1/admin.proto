}

// Delete-saved-query request.
message DeleteSavedQueryRequest {
  // ID from SavedQuery.id.
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
}

// Delete-saved-query response.
message DeleteSavedQueryResponse {}

// One row of the /admin/activity aggregate view: per-member counts
// + the last recorded event. `last_event_at` is unset for members
// with no recorded activity yet.
message MemberActivitySummary {
  // Member id (numeric, stringified over the wire).
  string user_id = 1;
  // Display name.
  string name = 2;
  // Email address.
  string email = 3;
  // Current lifecycle state.
  MemberStatus status = 4;
  // Number of sessions ever created for this member.
  int32 total_sessions = 5;
  // Sum of session wall-clock time in seconds, approximated as
  // (LEAST(revoked_at, last_active_at, now()) − created_at) per
  // session.
  int64 total_active_secs = 6;
  // Number of `chat` events (Ask Roger interactions).
  int32 ask_roger_count = 7;
  // Total number of activity_events rows for this member.
  int32 total_events = 8;
  // Kind of the most-recent event (matching ActivityEvent.Kind
  // values as a slug: "view", "login", …). Empty for members with
  // no events yet.
  string last_kind = 9;
  // Timestamp of the most-recent event; unset when no events.
  google.protobuf.Timestamp last_event_at = 10;
}

// Sort order for ListMemberActivity.
enum ActivitySort {
  // Default: name (case-insensitive ascending).
  ACTIVITY_SORT_UNSPECIFIED = 0;
  // Newest activity first.
  ACTIVITY_SORT_LAST_EVENT_DESC = 1;
  // Highest total session count first.
  ACTIVITY_SORT_SESSIONS_DESC = 2;
  // Highest total active-time first.
  ACTIVITY_SORT_ACTIVE_TIME_DESC = 3;
  // Most Ask Roger interactions first.
  ACTIVITY_SORT_ASK_ROGER_DESC = 4;
}

// List-member-activity request.
message ListMemberActivityRequest {
  // Which column to sort by.
  ActivitySort sort = 1 [(buf.validate.field).enum.defined_only = true];
}

// List-member-activity response.
message ListMemberActivityResponse {
  // One row per member (up to 500).
  repeated MemberActivitySummary members = 1;
}

// Ingest one document into the Ask Roger corpus.
message IngestCorpusTextRequest {
  // Where the text came from: 'article', 'resume', 'career_note',
  // 'adr', 'other'. Kept as free text (not enum) so a new source
  // kind is just a new value at the ingest form, not a proto edit.
  string source_kind = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 40
  }];
  // Stable per-source_kind key. Filesystem sources pass the relative
  // path; pasted documents pass a slug like `paste/2026-09-21-notes`.
  string source_path = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // Human-readable title. Empty falls back to the first non-blank
  // line of the body (with a leading `#` stripped) at ingest time.
  string title = 3 [(buf.validate.field).string.max_len = 300];
  // The document text, post-front-matter for markdown. Capped at
  // 200 KiB so the form doesn't paste in an unbounded blob.
  string body = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 204800
  }];
  // `public` (default) or `corpus_only`.
  string visibility = 5 [(buf.validate.field).string.max_len = 16];
}

// Ingest response — mirrors ingest.IngestResult.
message IngestCorpusTextResponse {
  // ID of the stored corpus_documents row.
  string document_id = 1;
  // Number of chunks written this run (0 if skipped).
  int32 chunks_inserted = 2;
  // Number of chunks successfully embedded this run.
  int32 chunks_embedded = 3;
  // True when the body's content hash matched the stored row and
  // no chunk / embed work ran.
  bool skipped = 4;
  // Stable identifier of the chunker version used (e.g. "paragraph.v1").
  string chunker_name = 5;
  // Embedder model reported by the sidecar (e.g. "stub", "ollama").
  string embedder_model = 6;
}

// List-corpus-documents request. No filters yet — corpus is small
// enough that the admin surface returns everything.
message ListCorpusDocumentsRequest {}

// One row in the corpus with a computed chunk count.
message CorpusDocumentRow {
  // ID of the corpus_documents row.
  string id = 1;
  // Source kind slug.
  string source_kind = 2;
  // Stable per-source_kind key.
  string source_path = 3;
  // Human-readable title.
  string title = 4;
  // Count of chunk rows referencing this document.
  int32 chunk_count = 5;
  // Count of chunks that have an embedding populated.
  int32 embedded_count = 6;
  // When the row was first written.
  google.protobuf.Timestamp ingested_at = 7;
  // When any field changed (title / hash / meta).
  google.protobuf.Timestamp updated_at = 8;
  // `public` (citable on the site) or `corpus_only` (informs answers,
  // never quoted or named).
  string visibility = 9;
}

// List-corpus-documents response.
message ListCorpusDocumentsResponse {
  // All documents, newest first.
  repeated CorpusDocumentRow documents = 1;
  // Aggregate document count across the whole corpus (rendered as
  // a header chip on /admin/corpus).
  int32 total_documents = 2;
  // Aggregate chunk count across every stored document.
  int32 total_chunks = 3;
  // Aggregate count of chunks that have an embedding populated.
  int32 total_embedded = 4;
  // Documents with visibility=public.
  int32 total_public = 5;
  // Documents with visibility=corpus_only.
  int32 total_corpus_only = 6;
  // Chunk counts grouped by the embedder that produced their vector.
  repeated EmbedderCount embedder_counts = 7;
}

// One row of the per-embedder chunk breakdown.
message EmbedderCount {
  // Embedder name as reported by the sidecar (e.g. `stub`,
  // `ollama:nomic-embed-text`); empty for chunks with no vector yet,
  // `untracked` for vectors written before per-chunk tracking existed.
  string model = 1;
  // Number of chunks.
  int32 count = 2;
}

// Sweep-corpus-embeddings request.
message SweepCorpusEmbeddingsRequest {
  // Upper bound on chunks to (re)embed in this call. 0 → 512.
  int32 max_chunks = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 5000
  }];
}

// Sweep-corpus-embeddings response — mirrors ingest.SweepResult.
message SweepCorpusEmbeddingsResponse {
  // Embedder the sidecar is currently serving; every chunk is
  // converged onto this.
  string model = 1;
  // Chunks selected as stale this call.
  int32 considered = 2;
  // Chunks successfully re-embedded this call.
  int32 embedded = 3;
  // Chunks that failed (left stale for the next sweep).
  int32 failed = 4;
  // Chunks still stale after this call; zero means converged.
  int32 remaining = 5;
}

// Get-jd-submission request.
message GetJdSubmissionRequest {
  // Submission id (numeric, stringified).
  string submission_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
}

// Get-jd-submission response.
message GetJdSubmissionResponse {
  // The list row for this submission (status, scores, hints).
  JdSubmissionRow row = 1;
  // Full JD text as submitted.
  string jd_text = 2;
  // Assessment derivation as JSON (requirements, evidence chunk ids,
  // per-requirement verdicts, prompt versions, score formula); empty
  // before scoring or when the assessor was not wired.
  string assessment_json = 3;
  // Generated résumé in markdown; empty until generation lands.
  string resume_markdown = 4;
  // Model that produced the résumé.
  string llm_model = 5;
  // Prompt id that produced the résumé.
  string prompt_id = 6;
  // Prompt version that produced the résumé.
  int32 prompt_version = 7;
  // Download path for the locked PDF, including the submission's
  // result token, when a PDF was rendered; empty otherwise. Admin-only
  // by virtue of this RPC's auth level.
  string download_url = 8;
  // Every pipeline run for this submission, newest attempt first. The
  // fields above reflect only the most recent run, because a re-score
  // overwrites them; these rows survive it, so a superseded verdict can
  // still be read and compared with the one that replaced it.
  repeated JdRun runs = 9;
  // What happened in the world after this review; unset until recorded.
  JdOutcome outcome = 10;
  // Judgments recorded about this posting's output, newest first.
  repeated JdFeedback feedback = 11;
}

// What happened after a review. One per posting, revised in place.
message JdOutcome {
  // not_pursued | applied | screening | interview | offer | rejected |
  // no_response | withdrew.
  string status = 1;
  // The day that status became true, as YYYY-MM-DD; empty when unknown.
  string decided_on = 2;
  // Free note.
  string note = 3;
  // When the record was last revised.
  google.protobuf.Timestamp updated_at = 4;
}

// One person's judgment of one run's output.
message JdFeedback {
  // The run being judged; empty for a posting that predates run records.
  string run_id = 1;
  // owner | submitter. Never averaged together.
  string source = 2;
  // score | resume.
  string target = 3;
  // For score: accurate | too_generous | too_harsh | unusable.
  // For resume: would_send | needs_edits | wrong.
  string rating = 4;
  // Free note.
  string note = 5;
  // When it was recorded.
  google.protobuf.Timestamp created_at = 6;
}

// Set-jd-outcome request.
message SetJdOutcomeRequest {
  // Submission id (numeric, stringified).
  string submission_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
  // One of the outcome statuses; validated server-side.
  string status = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
  // YYYY-MM-DD, or empty when the day is unknown.
  string decided_on = 3 [(buf.validate.field).string.max_len = 10];
  // Free note, trimmed to 4000 characters.
  string note = 4 [(buf.validate.field).string.max_len = 4000];
}

// Set-jd-outcome response.
message SetJdOutcomeResponse {
  // The stored outcome.
  JdOutcome outcome = 1;
}

// Record-jd-feedback request. The owner's judgment of a run's output.
message RecordJdFeedbackRequest {
  // Submission id (numeric, stringified).
  string submission_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
  // Run being judged; empty attaches the judgment to the newest run.
  string run_id = 2 [(buf.validate.field).string.max_len = 64];
  // score | resume.
  string target = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 16
  }];
  // Rating from the vocabulary for that target; validated server-side.
  string rating = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
  // Free note, trimmed to 4000 characters.
  string note = 5 [(buf.validate.field).string.max_len = 4000];
}

// Record-jd-feedback response.
message RecordJdFeedbackResponse {}

// One job description with a stated expectation (data layer D4). The
// expectation is which side of the gate it belongs on, not a score:
// a score is model-dependent and would have to be rewritten on every
// change, and that rewriting is how a regression hides.
message GoldenPosting {
  // Row id.
  int64 id = 1;
  // Short unique label used in summaries.
  string name = 2;
  // The posting itself.
  string jd_text = 3;
  // Role hint passed to the pipeline, as a submitter would give it.
  string role_hint = 4;
  // Employer hint passed to the pipeline.
  string employer_hint = 5;
  // above | below: the side of the gate this posting belongs on.
  string expected_gate = 6;
  // Advisory band; not asserted, because band edges are tuned.
  string expected_band = 7;
  // Why it is in the set and what it is meant to catch.
  string note = 8;
  // Retired postings stay for history and are skipped by new runs.
  bool active = 9;
  // chosen (the owner picked it) or random (drawn without reading it
  // first). Reported apart, because a gate clean on chosen postings and
  // noisy on random ones is the finding that matters.
  string selection = 13;
  // Where the posting came from.
  string source = 14;
  // Score from the most recent evaluation that included it.
  optional double last_score = 10;
  // Whether that evaluation put it on the expected side.
  bool last_passed = 11;
  // When that evaluation scored it.
  google.protobuf.Timestamp last_eval_at = 12;
}

// List-golden-postings request.
message ListGoldenPostingsRequest {
  // True omits retired postings.
  bool active_only = 1;
}

// List-golden-postings response.
message ListGoldenPostingsResponse {
  // The set, expected-above first then by name.
  repeated GoldenPosting postings = 1;
}

// Upsert-golden-posting request. Keyed by name within the tenant.
message UpsertGoldenPostingRequest {
  // Short unique label.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 80
  }];
  // The posting text.
  string jd_text = 2 [(buf.validate.field).string = {
    min_len: 40
    max_len: 50000
  }];
  // Role hint.
  string role_hint = 3 [(buf.validate.field).string.max_len = 200];
  // Employer hint.
  string employer_hint = 4 [(buf.validate.field).string.max_len = 200];
  // above, below, or empty to add it unlabelled for review later.
  string expected_gate = 5 [(buf.validate.field).string.max_len = 8];
  // chosen or random; defaults to chosen.
  string selection = 8 [(buf.validate.field).string.max_len = 16];
  // Where the posting came from.
  string source = 9 [(buf.validate.field).string.max_len = 500];
  // Advisory band.
  string expected_band = 6 [(buf.validate.field).string.max_len = 20];
  // Why it is in the set.
  string note = 7 [(buf.validate.field).string.max_len = 2000];
}

// Upsert-golden-posting response.
message UpsertGoldenPostingResponse {
  // Row id of the created or replaced posting.
  int64 id = 1;
}

// Set-golden-active request.
message SetGoldenActiveRequest {
  // Row id.
  int64 id = 1;
  // False retires it.
  bool active = 2;
}

// Set-golden-active response.
message SetGoldenActiveResponse {}

// Label-golden-posting request. Labelling is its own call so recording
