// The owner's console: members, activity, conversation review, escalation
// replies, corpus inspection, persona, analytics, and the audit log.
//
// Every method requires an admin session with a fresh TOTP verification. All
// admin actions are written to the audit log (FSD FR-ADM-09).
syntax = "proto3";

package career.v1;

import "buf/validate/validate.proto";
import "career/v1/chat.proto";
import "career/v1/common.proto";
import "career/v1/contact.proto";
import "career/v1/jd.proto";
import "career/v1/options.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/reh3376/career-site/services/api/gen/career/v1;careerv1";

// Owner console.
service AdminService {
  // Lists members with search, filters, and pagination.
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.mfa_fresh) = true;
  }
  // Re-sends the approval or decline email to a member and returns
  // the audited attempt so the console can show the provider's verdict
  // inline. Backs the "Resend" button on /admin/registrations/[id].
  rpc ResendNotification(ResendNotificationRequest) returns (ResendNotificationResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.mfa_fresh) = true;
  }
  // Returns one member with recent activity, conversations, admin notes,
  // and email delivery history.
  rpc GetMember(GetMemberRequest) returns (GetMemberResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.mfa_fresh) = true;
  }
  // Adds a private admin note to a member.
  rpc AddMemberNote(AddMemberNoteRequest) returns (AddMemberNoteResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.mfa_fresh) = true;
  }
  // Approves or rejects a registration waiting in PENDING_APPROVAL (approval
  // mode only), or disables/re-enables an account.
  rpc SetMemberStatus(SetMemberStatusRequest) returns (SetMemberStatusResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.mfa_fresh) = true;
  }
  // Lists items needing the owner's attention: negative feedback,
  // "I don't know" answers, escalations, and out-of-scope refusals.
  rpc GetReviewQueue(GetReviewQueueRequest) returns (GetReviewQueueResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.mfa_fresh) = true;
  }
  // Resolves a review item, optionally recording that it was converted into
  // a Q&A-bank entry (the entry itself is authored in `content/qa/`).
  rpc ResolveReviewItem(ResolveReviewItemRequest) returns (ResolveReviewItemResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.mfa_fresh) = true;
  }
  // Replies to an escalation. The reply is appended to the member's
  // conversation as an OWNER message and the member is emailed.
  rpc ReplyEscalation(ReplyEscalationRequest) returns (ReplyEscalationResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.mfa_fresh) = true;
  }
  // Returns any member's conversation with messages, sources, and persona
  // versions (read-only).
  rpc GetMemberConversation(GetMemberConversationRequest) returns (GetMemberConversationResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.mfa_fresh) = true;
  }
  // Returns corpus statistics: documents, chunks, Q&A entries, last ingest,
  // embedding model, and persona version.
  rpc GetCorpusStatus(GetCorpusStatusRequest) returns (GetCorpusStatusResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.mfa_fresh) = true;
  }
  // Runs retrieval for a question and returns the chunks the assistant
  // would see, with scores ("what would the assistant retrieve?").
  rpc TestRetrieval(TestRetrievalRequest) returns (TestRetrievalResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.mfa_fresh) = true;
  }
  // Starts a sidecar job (re-ingest, content index, résumé build, evaluation).
  rpc RunJob(RunJobRequest) returns (RunJobResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.mfa_fresh) = true;
  }
  // Returns the status of a job started by RunJob or the scheduler.
  rpc GetJob(GetJobRequest) returns (GetJobResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.mfa_fresh) = true;
  }
  // Returns the active persona version and its history. The prompt text is
  // governed in the repository and pinned by its ULTS hash; this shows which
  // version is live.
  rpc GetPersona(GetPersonaRequest) returns (GetPersonaResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.mfa_fresh) = true;
  }
  // Returns aggregate analytics for a date range.
  rpc GetAnalytics(GetAnalyticsRequest) returns (GetAnalyticsResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.mfa_fresh) = true;
  }
  // Lists audit-log entries.
  rpc GetAudit(GetAuditRequest) returns (GetAuditResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.mfa_fresh) = true;
  }

  // Lists messages sent via the public contact form (FR-ADM-14). Backs
  // /admin/contacts in the console; every submission from
  // ContactService.SubmitContact lands in the same support_messages
  // table this reads from.
  rpc ListContactMessages(ListContactMessagesRequest) returns (ListContactMessagesResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.mfa_fresh) = true;
  }
  // Marks a contact message as resolved (or re-opens it). Records the
  // acting admin's user_id + timestamp so the audit trail is clean.
  rpc ResolveContactMessage(ResolveContactMessageRequest) returns (ResolveContactMessageResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.mfa_fresh) = true;
  }
  // Approves a pending registration from the admin console. Same DB
  // transitions + emails as the one-click Accept link, but recorded
  // as decided_via="console" in the audit trail.
  rpc ApproveRegistration(ApproveRegistrationRequest) returns (ApproveRegistrationResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.mfa_fresh) = true;
  }
  // Declines a pending registration from the admin console. Same DB
  // transitions + emails as the one-click Decline link, but recorded
  // as decided_via="console" in the audit trail.
  rpc DeclineRegistration(DeclineRegistrationRequest) returns (DeclineRegistrationResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.mfa_fresh) = true;
  }
  // Extends an active member's access period by a fixed duration
  // (`extend_days`), or sets a specific new `expires_at`. Absolute
  // and relative are exclusive; passing both is InvalidArgument.
  rpc ExtendAccess(ExtendAccessRequest) returns (ExtendAccessResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.mfa_fresh) = true;
  }
  // Returns the public tables + columns of the API database, from
  // information_schema. Backs the schema panel on /admin/db.
  rpc ListDbTables(ListDbTablesRequest) returns (ListDbTablesResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.mfa_fresh) = true;
  }
  // Runs a SQL query against the API database from the /admin/db
  // console. MVP is read-only: only SELECT statements are accepted;
  // any other statement kind returns InvalidArgument. A per-statement
  // timeout is enforced server-side and the result row-count is
  // capped (rows past the cap are dropped with `truncated=true`).
  rpc RunDbQuery(RunDbQueryRequest) returns (RunDbQueryResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.mfa_fresh) = true;
  }
  // Lists the access whitelist entries. An entry with an email means
  // a registration from that address is auto-approved for
  // `default_ttl`. Backs /admin/access.
  rpc ListAccessGrants(ListAccessGrantsRequest) returns (ListAccessGrantsResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.mfa_fresh) = true;
  }
  // Creates a new access whitelist entry or updates an existing one
  // by email (email is the natural key). The default_ttl controls how
  // long access lasts once the user signs up; entry_expires_at (optional)
  // controls how long the whitelist entry itself stays active.
  rpc UpsertAccessGrant(UpsertAccessGrantRequest) returns (UpsertAccessGrantResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.mfa_fresh) = true;
  }
  // Removes a whitelist entry. Existing accounts already granted
  // access are unaffected — this only stops future auto-approvals.
  rpc DeleteAccessGrant(DeleteAccessGrantRequest) returns (DeleteAccessGrantResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.mfa_fresh) = true;
  }
  // Returns the calling admin's saved SQL statements from /admin/db.
  // Scoped to the caller — one admin never sees another's slots.
  rpc ListSavedQueries(ListSavedQueriesRequest) returns (ListSavedQueriesResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.mfa_fresh) = true;
  }
  // Creates or updates a saved query for the caller. The tuple
  // (caller, name) is the natural key: passing an existing name
  // overwrites the body.
  rpc UpsertSavedQuery(UpsertSavedQueryRequest) returns (UpsertSavedQueryResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.mfa_fresh) = true;
  }
  // Removes one of the caller's saved queries by id.
  rpc DeleteSavedQuery(DeleteSavedQueryRequest) returns (DeleteSavedQueryResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.mfa_fresh) = true;
  }
  // Returns one row per member with engagement aggregates (session
  // count, total active time, ask-roger count, last event). Backs
  // /admin/activity — Roger's request for a sortable "who's using
  // the site" surface.
  rpc ListMemberActivity(ListMemberActivityRequest) returns (ListMemberActivityResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.mfa_fresh) = true;
  }
  // Ingests one text document into the Ask Roger corpus. Chunks
  // it, embeds via the sidecar, and stores under (source_kind,
  // source_path). Idempotent: an identical body with the same
  // (source_kind, source_path) is a no-op (skipped=true). Backs
  // the paste-a-document form on /admin/corpus.
  rpc IngestCorpusText(IngestCorpusTextRequest) returns (IngestCorpusTextResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.mfa_fresh) = true;
  }
  // Returns every document currently in the corpus with a per-row
  // chunk count. Backs the list on /admin/corpus.
  rpc ListCorpusDocuments(ListCorpusDocumentsRequest) returns (ListCorpusDocumentsResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.mfa_fresh) = true;
  }
  // Walks a filesystem tree for markdown files and runs each through
  // IngestCorpusText, so the corpus can be seeded from committed
  // article content instead of paste-by-paste. Idempotent — files
  // whose content_hash matches the stored row are skipped. Root is
  // resolved from CORPUS_ROOT + a subdirectory per source_kind
  // (e.g. `article` → `${CORPUS_ROOT}/articles`). Backs the
  // "Reindex articles" button on /admin/corpus.
  rpc ReindexCorpus(ReindexCorpusRequest) returns (ReindexCorpusResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.mfa_fresh) = true;
  }
  // Re-embeds every chunk whose vector is missing or was produced by a
  // different embedder than the sidecar's current one. Bounded per call
  // (max_chunks); the response's `remaining` says whether to call again.
  // This is the safe path for flipping SIDECAR_EMBED_PROVIDER or
  // changing the embedding model: nothing is deleted, the corpus is
  // walked until every chunk carries the current model's vector.
  rpc SweepCorpusEmbeddings(SweepCorpusEmbeddingsRequest) returns (SweepCorpusEmbeddingsResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.mfa_fresh) = true;
  }
  // Returns every JD submission with score + status. Backs
  // /admin/jd — Roger's triage view for the JD-upload flow. Full
  // JD body is elided from the list; the detail lookup returns it.
  rpc ListJdSubmissions(ListJdSubmissionsRequest) returns (ListJdSubmissionsResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.mfa_fresh) = true;
  }
  // Returns one JD submission in full: the JD text, both scores, the
  // assessment derivation (requirements, evidence, verdicts) and the
  // generated résumé when present. Backs /admin/jd/[id].
  rpc GetJdSubmission(GetJdSubmissionRequest) returns (GetJdSubmissionResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.mfa_fresh) = true;
  }
  // Re-runs the scoring pipeline (retrieval pre-score, assessment,
  // résumé and PDF when above threshold) for one submission in the
  // background, e.g. after a transient sidecar failure or a prompt
  // change. Returns immediately; poll GetJdSubmission for the outcome.
  rpc RescoreJd(RescoreJdRequest) returns (RescoreJdResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.mfa_fresh) = true;
  }
}

// Activity counts for a member.
message MemberCounts {
  // Content views.
  int32 views = 1;
  // Downloads.
  int32 downloads = 2;
  // Assistant messages sent.
  int32 chat_messages = 3;
  // Escalations raised.
  int32 escalations = 4;
  // Saved items.
  int32 saved = 5;
}

// A member as the owner sees it.
message MemberRecord {
  // The member.
  Me me = 1;
  // Activity counts.
  MemberCounts counts = 2;
  // First sign-in.
  google.protobuf.Timestamp first_seen_at = 3;
  // Number of admin notes.
  int32 note_count = 4;
}

// Member list filters.
message ListMembersRequest {
  // Case-insensitive match on name, email, or organization.
  string query = 1 [(buf.validate.field).string.max_len = 200];
  // Restrict to one status; unspecified returns all.
  MemberStatus status = 2 [(buf.validate.field).enum.defined_only = true];
  // Restrict to members interested in this track.
  string track_id = 3 [(buf.validate.field).string.max_len = 64];
  // Sort order.
  Sort sort = 4 [(buf.validate.field).enum.defined_only = true];
  // Pagination.
  PageRequest page = 5;

  // Sort orders.
  enum Sort {
    // Most recently seen first.
    SORT_UNSPECIFIED = 0;
    // Most recently registered first.
    SORT_NEWEST = 1;
    // Most active first.
    SORT_MOST_ACTIVE = 2;
    // Alphabetical by name.
    SORT_NAME = 3;
  }
}

// Member list.
message ListMembersResponse {
  // Members.
  repeated MemberRecord members = 1;
  // Pagination.
  PageResponse page = 2;
}

// Member detail request.
message GetMemberRequest {
  // Member ID.
  string member_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

// A private admin note.
message AdminNote {
  // Note ID.
  string id = 1;
  // Note text.
  string text = 2;
  // When it was written.
  google.protobuf.Timestamp created_at = 3;
}

// One audited email attempt for a member.
message NotificationDelivery {
  // Delivery row id.
  string id = 1;
  // Slug of the mail: user_approved, user_declined, welcome_whitelist,
  // verify_email, password_reset, expiry_warn, expired, user_auto_declined.
  string kind = 2;
  // Address the mail was sent to.
  string recipient = 3;
  // Provider that handled it (resend / smtp).
  string provider = 4;
  // "system" for automatic sends; "admin:<id>" for console resends.
  string triggered_by = 5;
  // Provider round-trip in milliseconds.
  int64 duration_ms = 6;
  // True when the provider accepted the message.
  bool ok = 7;
  // Truncated provider error when ok is false; empty otherwise.
  string error = 8;
  // When the attempt happened.
  google.protobuf.Timestamp sent_at = 9;
}

// Member detail.
message GetMemberResponse {
  // The member.
  MemberRecord member = 1;
  // Most recent 50 activity events, newest first.
  repeated ActivityEvent recent_activity = 2;
  // Conversations, most recent first.
  repeated Conversation conversations = 3;
  // Admin notes, newest first.
  repeated AdminNote notes = 4;
  // Most recent 20 email attempts, newest first.
  repeated NotificationDelivery deliveries = 5;
}

// Resend-notification request.
message ResendNotificationRequest {
  // Member ID.
  string member_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // Which mail to re-fire. Only `user_approved` (member must be
  // active) and `user_declined` (member must be declined) are
  // resendable; token-bearing mails (verify, reset) are not.
  string kind = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 40
  }];
}

// Resend-notification response.
message ResendNotificationResponse {
  // The audited attempt, including any provider error.
  NotificationDelivery delivery = 1;
}

// Note request.
message AddMemberNoteRequest {
  // Member ID.
  string member_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // Note text.
  string text = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4000
  }];
}

// The stored note.
message AddMemberNoteResponse {
  // The note.
  AdminNote note = 1;
}

// Status change.
message SetMemberStatusRequest {
  // Member ID.
  string member_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // New status: ACTIVE (approve or re-enable) or DISABLED.
  MemberStatus status = 2 [(buf.validate.field).enum = {
    in: [
      2,
      4
    ]
  }];
  // Reason, recorded in the audit log.
  string reason = 3 [(buf.validate.field).string.max_len = 1000];
}

// Updated member.
message SetMemberStatusResponse {
  // The member after the change.
  MemberRecord member = 1;
}

// Kinds of review items.
enum ReviewKind {
  // Not set (no filter).
  REVIEW_KIND_UNSPECIFIED = 0;
  // A member rated an answer down.
  REVIEW_KIND_NEGATIVE_FEEDBACK = 1;
  // The assistant found no supporting material.
  REVIEW_KIND_NO_SUPPORT = 2;
  // A member escalated to the owner.
  REVIEW_KIND_ESCALATION = 3;
  // The assistant declined an out-of-scope question.
  REVIEW_KIND_OUT_OF_SCOPE = 4;
}

// Review item lifecycle.
enum ReviewStatus {
  // Not set (no filter).
  REVIEW_STATUS_UNSPECIFIED = 0;
  // Awaiting the owner.
  REVIEW_STATUS_OPEN = 1;
  // Handled.
  REVIEW_STATUS_RESOLVED = 2;
  // Handled by adding a Q&A-bank entry.
  REVIEW_STATUS_CONVERTED_TO_QA = 3;
  // Handled by replying to the member.
  REVIEW_STATUS_REPLIED = 4;
}

// Review queue filters.
message GetReviewQueueRequest {
  // Restrict to one kind.
  ReviewKind kind = 1 [(buf.validate.field).enum.defined_only = true];
  // Restrict to one status; unspecified returns OPEN items.
  ReviewStatus status = 2 [(buf.validate.field).enum.defined_only = true];
  // Pagination.
  PageRequest page = 3;
}

// A review item.
message ReviewItem {
  // Review item ID.
  string id = 1;
  // Kind.
  ReviewKind kind = 2;
  // Status.
  ReviewStatus status = 3;
  // The member.
  Me member = 4;
  // Conversation ID.
  string conversation_id = 5;
  // Message ID that triggered the item.
  string message_id = 6;
  // The member's question.
  string question = 7;
  // The assistant's answer, truncated to 500 characters.
  string answer_excerpt = 8;
  // Member comment, for negative feedback.
  string comment = 9;
  // Escalation ID, for escalations.
  string escalation_id = 10;
  // When the item was created.
  google.protobuf.Timestamp created_at = 11;
}

// Review queue page.
message GetReviewQueueResponse {
  // Items, oldest open first.
  repeated ReviewItem items = 1;
  // Pagination.
  PageResponse page = 2;
  // Open items in total.
  int32 open_count = 3;
}

// Resolution request.
message ResolveReviewItemRequest {
  // Review item ID.
  string review_item_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // Resolution: RESOLVED or CONVERTED_TO_QA.
  ReviewStatus resolution = 2 [(buf.validate.field).enum = {
    in: [
      2,
      3
    ]
  }];
  // Note for the audit log; optional.
  string note = 3 [(buf.validate.field).string.max_len = 1000];
}

// Empty.
message ResolveReviewItemResponse {}

// Escalation reply.
message ReplyEscalationRequest {
  // Escalation ID.
  string escalation_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // Reply text (Markdown).
  string text = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 8000
  }];
  // Also email the member (default true when unset in the UI).
  bool notify_member = 3;
}

// The stored reply.
message ReplyEscalationResponse {
  // The OWNER message appended to the conversation.
  Message message = 1;
}

// Any member's conversation.
message GetMemberConversationRequest {
  // Conversation ID.
  string conversation_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

// Conversation with messages.
message GetMemberConversationResponse {
  // The member.
  Me member = 1;
  // The conversation.
  Conversation conversation = 2;
  // Messages in chronological order, with citations.
  repeated Message messages = 3;
}

// Empty.
message GetCorpusStatusRequest {}

// Corpus statistics.
message GetCorpusStatusResponse {
  // Indexed documents.
  int32 documents = 1;
  // Chunks with embeddings.
  int32 chunks = 2;
  // Q&A-bank entries.
  int32 qa_entries = 3;
  // Documents by content type, keyed by the enum name (e.g. `CONTENT_TYPE_ARTICLE`).
  map<string, int32> documents_by_type = 4;
  // Private-corpus documents (not linked to site content).
  int32 private_documents = 5;
  // Last successful ingest.
  google.protobuf.Timestamp last_ingest_at = 6;
  // Embedding model identifier.
  string embedding_model = 7;
  // Embedding dimensions.
  int32 embedding_dimensions = 8;
  // Active persona version.
  string persona_version = 9;
}

// Retrieval test.
message TestRetrievalRequest {
  // The question to retrieve for.
  string query = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4000
  }];
  // Chunks to return, 1–50; zero selects the assistant's default.
  int32 top_k = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 50
  }];
  // Apply the sidecar reranker after hybrid retrieval.
  bool rerank = 3;
}

// One retrieved chunk.
message RetrievalHit {
  // Chunk ID.
  string chunk_id = 1;
  // Content item, when the chunk is site content.
  string content_id = 2;
  // Document title.
  string title = 3;
  // Heading path within the document.
  string heading = 4;
  // Fused score.
  float score = 5;
  // Chunk text.
  string text = 6;
  // Rank before reranking (1-based).
  int32 pre_rerank_rank = 7;
}

// Retrieval test result.
message TestRetrievalResponse {
  // Chunks in rank order.
  repeated RetrievalHit hits = 1;
  // Matching Q&A-bank entry, when the question matched one above threshold.
  ContentSummary qa_match = 2;
  // Similarity of the Q&A match.
  float qa_similarity = 3;
  // Retrieval latency in milliseconds.
  int32 latency_ms = 4;
}

// Sidecar jobs the owner can start.
enum JobKind {
  // Not set.
  JOB_KIND_UNSPECIFIED = 0;
  // Validate content files against the schema.
  JOB_KIND_CONTENT_VALIDATE = 1;
  // Rebuild the content catalog in the database.
  JOB_KIND_CONTENT_INDEX = 2;
  // Ingest changed content into the corpus.
  JOB_KIND_INGEST_CHANGED = 3;
  // Re-ingest the entire corpus.
  JOB_KIND_INGEST_FULL = 4;
  // Rebuild résumé PDFs from structured content.
  JOB_KIND_RESUME_BUILD = 5;
  // Run the UVTS retrieval evaluation (quick profile).
  JOB_KIND_EVAL_QUICK = 6;
