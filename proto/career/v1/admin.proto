  MemberRecord member = 1;
}

// Decline-registration request.
message DeclineRegistrationRequest {
  // Member ID from MemberRecord.me.id.
  string member_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // Optional free-text reason recorded in the audit log.
  string reason = 2 [(buf.validate.field).string.max_len = 1000];
}

// Decline-registration response.
message DeclineRegistrationResponse {
  // Updated member record.
  MemberRecord member = 1;
}

// Extend-access request. Set exactly one of extend_days /
// new_expires_at / permanent to specify the new expiry.
message ExtendAccessRequest {
  // Member ID from MemberRecord.me.id.
  string member_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // Add this many days to the current expires_at (or, if the member
  // has no expires_at set, from now). 1..3650.
  int32 extend_days = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 3650
  }];
  // Set expires_at to this exact moment.
  google.protobuf.Timestamp new_expires_at = 3;
  // Make access permanent (clears expires_at).
  bool permanent = 4;
  // Optional free-text reason recorded in the audit log.
  string reason = 5 [(buf.validate.field).string.max_len = 1000];
}

// Extend-access response.
message ExtendAccessResponse {
  // Updated member record.
  MemberRecord member = 1;
}

// One column of a database table.
message DbColumn {
  // Column name.
  string name = 1;
  // SQL type as reported by information_schema (e.g. "text",
  // "bigint", "timestamp with time zone").
  string data_type = 2;
  // Whether the column is nullable.
  bool nullable = 3;
}

// One table in the public schema.
message DbTable {
  // Table name.
  string name = 1;
  // Columns, ordered as declared.
  repeated DbColumn columns = 2;
  // Approximate row count from pg_class.reltuples (updated by
  // ANALYZE; may be stale — the console labels it as such).
  int64 approx_row_count = 3;
}

// List-tables request (empty for now; a future revision might
// add filters).
message ListDbTablesRequest {}

// List-tables response.
message ListDbTablesResponse {
  // Public-schema tables, ordered by name.
  repeated DbTable tables = 1;
}

// Run-query request.
message RunDbQueryRequest {
  // SQL statement to execute. MVP: only SELECT is accepted.
  string sql = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4000
  }];
  // Statement timeout in milliseconds; server-clamped to [100, 10000].
  int32 timeout_ms = 2;
  // Optional column of the result to sort by (informational only —
  // the client can reorder locally; the server passes it back so a
  // caller can round-trip UI state).
  string sort = 3 [(buf.validate.field).string.max_len = 64];
}

// One row of results, as a list of stringified cell values in the
// same order as the columns array on the response. NULLs come across
// as an empty string with a companion `null_mask` bit set on the row
// (see below).
message DbRow {
  // Cell values, stringified. Callers must not attempt to parse them
  // as JSON; the type is columns[i].data_type on the response.
  repeated string cells = 1;
  // Bitmask, LSB = column 0. A set bit means the corresponding cell
  // is NULL and its stringified value should be ignored.
  uint64 null_mask = 2;
}

// Run-query response.
message RunDbQueryResponse {
  // Column names (order matches DbRow.cells).
  repeated string columns = 1;
  // SQL types (order matches columns).
  repeated string column_types = 2;
  // Rows, in whatever order the query returned them.
  repeated DbRow rows = 3;
  // True when the result was cut off at the server-side row cap.
  bool truncated = 4;
  // Number of rows returned (before truncation, if applicable —
  // matches len(rows) when truncated is false).
  int32 row_count = 5;
  // Milliseconds the query took on the server, wall-clock.
  int32 elapsed_ms = 6;
}

// The whitelisted set of TTL choices from FSD FR-AUTH-17. Mirrors
// the `access_ttl` enum type in the DB (`1d` / `3d` / `7d` / `30d`
// / `permanent`).
enum GrantTTL {
  // Not set (proto3 requires a zero value). Rejected in the
  // upsert request; validation forces the caller to pick one.
  GRANT_TTL_UNSPECIFIED = 0;
  // 24 hours.
  GRANT_TTL_1D = 1;
  // 72 hours.
  GRANT_TTL_3D = 2;
  // 7 days.
  GRANT_TTL_7D = 3;
  // 30 days.
  GRANT_TTL_30D = 4;
  // No expiry — access does not auto-lapse.
  GRANT_TTL_PERMANENT = 5;
}

// One row of the access_grants table.
message AccessGrant {
  // Numeric ID (bigserial); string over the wire so callers don't
  // hard-code JSON number precision.
  string id = 1;
  // Whitelisted email address (citext in the DB).
  string email = 2;
  // TTL granted on signup.
  GrantTTL default_ttl = 3;
  // Free-text admin notes (why this email was whitelisted, etc.).
  string notes = 4;
  // When the whitelist entry itself lapses; unset means never.
  google.protobuf.Timestamp entry_expires_at = 5;
  // Admin user_id that created the entry; empty for seeded rows.
  string created_by = 6;
  // When the entry was created.
  google.protobuf.Timestamp created_at = 7;
  // When the entry was last updated.
  google.protobuf.Timestamp updated_at = 8;
}

// List-grants request.
message ListAccessGrantsRequest {
  // Case-insensitive substring match against email or notes.
  string query = 1 [(buf.validate.field).string.max_len = 200];
}

// List-grants response.
message ListAccessGrantsResponse {
  // Whitelist entries, newest first.
  repeated AccessGrant grants = 1;
  // Count of entries currently active (entry_expires_at unset or
  // in the future).
  int32 active_count = 2;
  // Count of entries whose entry_expires_at has passed.
  int32 expired_count = 3;
}

// Upsert-grant request. If a row with this email already exists it
// is updated in place; otherwise a new row is created.
message UpsertAccessGrantRequest {
  // Email to whitelist. Lower-cased server-side.
  string email = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 254
    email: true
  }];
  // TTL that new registrations get on approval.
  GrantTTL default_ttl = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Free-text admin notes.
  string notes = 3 [(buf.validate.field).string.max_len = 1000];
  // When this whitelist entry itself should lapse; unset = never.
  google.protobuf.Timestamp entry_expires_at = 4;
}

// Upsert-grant response.
message UpsertAccessGrantResponse {
  // The stored entry (with fields filled in by the server).
  AccessGrant grant = 1;
  // True when the request created a new row; false when it
  // updated an existing one.
  bool created = 2;
}

// Delete-grant request.
message DeleteAccessGrantRequest {
  // ID from AccessGrant.id.
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
}

// Delete-grant response.
message DeleteAccessGrantResponse {}

// One saved SQL statement on the /admin/db page, scoped to a single
// admin. Names are unique per owner but not globally.
message SavedQuery {
  // Numeric id (bigserial); string over the wire to avoid JSON
  // number-precision drift.
  string id = 1;
  // The admin's chosen label, shown in the dropdown.
  string name = 2;
  // The SELECT text. Same 4000-char cap as RunDbQuery.sql.
  string sql = 3;
  // When the row was first saved.
  google.protobuf.Timestamp created_at = 4;
  // When the row was last overwritten via upsert.
  google.protobuf.Timestamp updated_at = 5;
}

// List-saved-queries request. No filters yet — the response is
// naturally scoped to the caller and expected to be small.
message ListSavedQueriesRequest {}

// List-saved-queries response.
message ListSavedQueriesResponse {
  // The caller's saved queries, ordered by name (case-insensitive).
  repeated SavedQuery queries = 1;
}

// Upsert-saved-query request. A row with (owner, name) is created
// if it doesn't exist and overwritten if it does.
message UpsertSavedQueryRequest {
  // Label to save under. Trimmed server-side; empty is rejected.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 80
  }];
  // The SQL text. Enforcement (SELECT-only, single statement) is
  // applied at execute time by RunDbQuery, not on save — so an
  // admin can save a draft and finish it later.
  string sql = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4000
  }];
}

// Upsert-saved-query response.
message UpsertSavedQueryResponse {
  // The stored row (fields populated by the server).
  SavedQuery query = 1;
  // True when the request created a new row; false when it
  // overwrote an existing (owner, name) tuple.
