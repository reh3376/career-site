// Audit filters.
message GetAuditRequest {
  // Restrict to one actor (member ID); empty for all.
  string actor_id = 1 [(buf.validate.field).string.max_len = 64];
  // Restrict to an action prefix, e.g. `auth.` or `admin.`.
