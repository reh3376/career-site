// Identity: registration, email verification, password sign-in, password
// reset and credential changes.
//
// **This header described four things that were not true**, and five
// more claims elsewhere in the file were wrong in the same way: Login's
// MFA gate, the `mfa_required` field, MfaEnroll, MfaVerify, ChangeEmail's
// "social-only accounts" and LoginResponse's unverified session. All
// corrected on 2026-10-11 at the end of the work in
// docs/sprint-auth-interceptor.md, because every one of them was the
// kind of claim a security review takes at face value. They are listed
// rather than quietly deleted, so anyone who read the old version can
// see what changed.
//
// Sessions are opaque server-side identifiers delivered in the
// `career_site_session` cookie (HttpOnly; Secure in production;
// SameSite=Lax; 30-day lifetime from SESSION_TTL_HOURS). Clients never
// see or send a token; the browser sends the cookie on every same-origin
// request.
//
//  1. The cookie was named here as `career_session`. It is
//     `career_site_session` (handlers.SessionCookieName).
//
//  2. A "7-day idle timeout" was claimed and is not enforced.
//     `sessions.last_active_at` is bumped on every lookup, but the
//     lookup's only expiry condition is `expires_at > now()`, and
//     nothing sweeps idle rows. The column feeds the activity figures on
//     the admin console and nothing else, so a session is valid for its
//     full 30 days however long it sits unused.
//
//  3. Cross-site request forgery was credited to a required
//     `Connect-Protocol-Version: 1` header, "being a non-simple header".
//     That header is not required: connect-go only enforces it under
//     `connect.WithRequireConnectProtocolHeader()`, which this server
//     does not set, and a `Login` POST carrying only
//     `Content-Type: application/json` is accepted and processed.
//     What does protect these endpoints is `SameSite=Lax` on the cookie,
//     which stops a cross-site POST from carrying it at all. The
//     protection is real; the mechanism named was not. Requiring the
//     header would add a second layer and is worth doing, and it is a
//     behaviour change rather than a comment fix: three deploy scripts
//     call these RPCs with plain curl and would start failing.
//
//  4. Two `GET /api/auth/oauth/{provider}/start` and `/callback` routes
//     were documented for linkedin, github and google, with PKCE, state
//     and account linking by verified email. **No such routes exist.**
//     There is no handler, no provider configuration and no OAuth
//     sign-in code anywhere in the service; the only OAuth here is
//     Google Calendar, for the owner's own calendar. Social sign-in has
//     never been built, so password sign-in is the only way in.
//
// MFA is also absent and intentionally so. `MfaEnroll` and `MfaVerify`
// are declared below and have no handler, the `mfa_fresh` option was
// removed from all 79 methods that carried it on 2026-10-09, and the
// owner decided then not to build a second factor. The first line of
// this comment used to say the service covered "admin MFA".
syntax = "proto3";

package career.v1;

import "buf/validate/validate.proto";
import "career/v1/common.proto";
import "career/v1/options.proto";

option go_package = "github.com/reh3376/career-site/services/api/gen/career/v1;careerv1";

// Registration, verification, sign-in, and credential management.
service AuthService {
  // Creates an unverified account and sends a verification email. The
  // response is identical whether or not the email address already exists,
  // to prevent account enumeration; an existing verified account receives a
  // "someone tried to register with your address" email instead.
  rpc Register(RegisterRequest) returns (RegisterResponse) {
    option (career.v1.auth) = AUTH_LEVEL_PUBLIC;
  }
  // Confirms control of the email address with the emailed link token or the
  // six-digit code, activates the account, and starts a session (cookie set
  // in the response).
  rpc Verify(VerifyRequest) returns (VerifyResponse) {
    option (career.v1.auth) = AUTH_LEVEL_PUBLIC;
  }
  // Re-sends the verification email for an unverified account. Identical
  // response whether or not the address is known.
  rpc ResendVerification(ResendVerificationRequest) returns (ResendVerificationResponse) {
    option (career.v1.auth) = AUTH_LEVEL_PUBLIC;
  }
  // Signs in with email and password and sets the session cookie.
  //
  // Refuses every non-active status: unverified and pending-approval get
  // `failed_precondition`, declined, expired and disabled get
  // `permission_denied`. So a session only exists for an account that
  // was active when it was minted.
  //
  // This comment used to add: "For an admin account the session is
  // created but flagged `mfa_required`; admin methods stay unavailable
  // until MfaVerify succeeds." **None of that happens.** There is no
  // second factor, `mfa_required` is hardcoded false, and admin methods
  // are available immediately on a successful admin sign-in.
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (career.v1.auth) = AUTH_LEVEL_PUBLIC;
  }
  // Ends the current session and clears the cookie.
  //
  // Public, not MEMBER. It declared MEMBER until 2026-10-09 and the
  // handler never enforced it, which S1 of
  // docs/sprint-auth-interceptor.md found. The declaration was the
  // wrong half: there is nothing here to protect, because the session
  // token the caller presents IS the thing being revoked, so nobody
  // can log out anyone but themselves. With no token it is a no-op that
  // returns success.
  //
  // Requiring a session would also break the case that needs this
  // most. Once a session has expired the cookie is still in the
  // browser, and that is exactly when someone wants it cleared;
  // enforcing MEMBER would answer `unauthenticated` and leave it there.
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (career.v1.auth) = AUTH_LEVEL_PUBLIC;
  }
  // Ends every session of the member ("sign out of all devices").
  rpc LogoutAll(LogoutAllRequest) returns (LogoutAllResponse) {
    option (career.v1.auth) = AUTH_LEVEL_MEMBER;
  }
  // Emails a single-use password-reset link (valid one hour). Identical
  // response whether or not the address is known.
  rpc ForgotPassword(ForgotPasswordRequest) returns (ForgotPasswordResponse) {
    option (career.v1.auth) = AUTH_LEVEL_PUBLIC;
  }
  // Sets a new password using a reset token and signs the member in on
  // success. All other sessions are revoked.
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse) {
    option (career.v1.auth) = AUTH_LEVEL_PUBLIC;
  }
  // Changes the password of the signed-in member; requires the current
  // password. Other sessions are revoked.
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse) {
    option (career.v1.auth) = AUTH_LEVEL_MEMBER;
  }
  // **Not implemented.** Declared with no handler, so the embedded
  // UnimplementedAuthServiceHandler answers `unimplemented`.
  //
  // Intended: a verification email goes to the new address and the
  // change applies when it is confirmed via Verify, requiring the
  // current password. The old comment added "or, for social-only
  // accounts, a fresh social sign-in within the last ten minutes";
  // there are no social accounts, because social sign-in does not
  // exist. See the note on OAuth at the top of this file.
  rpc ChangeEmail(ChangeEmailRequest) returns (ChangeEmailResponse) {
    option (career.v1.auth) = AUTH_LEVEL_MEMBER;
  }
  // **Not implemented, and not planned.** Declared with no handler, so
  // the embedded UnimplementedAuthServiceHandler answers `unimplemented`.
  // The owner decided on 2026-10-09 not to build a second factor; the
  // `mfa_fresh` option was removed from the 79 methods that declared it
  // on the same day.
  //
  // It was documented as enrolling TOTP and returning an otpauth URI
  // with one-time recovery codes. No such code exists: nothing issues,
  // stores or checks a secret, and the sessions table has no
  // verification timestamp.
  rpc MfaEnroll(MfaEnrollRequest) returns (MfaEnrollResponse) {
    option (career.v1.auth) = AUTH_LEVEL_MEMBER;
  }
  // **Not implemented, and not planned.** See MfaEnroll. Answers
  // `unimplemented`; there is no TOTP code or recovery code to verify.
  rpc MfaVerify(MfaVerifyRequest) returns (MfaVerifyResponse) {
    option (career.v1.auth) = AUTH_LEVEL_MEMBER;
  }
}

// Registration form.
message RegisterRequest {
  // Display name.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 120
  }];
  // Email address; becomes the sign-in identifier.
  string email = 2 [(buf.validate.field).string = {
    email: true
    max_len: 254
  }];
  // Password: at least 12 characters, no composition rules; rejected if it
  // appears in a breached-password list.
  string password = 3 [(buf.validate.field).string = {
    min_len: 12
    max_len: 256
  }];
  // Organization, optional.
  string organization = 4 [(buf.validate.field).string.max_len = 200];
  // Stated role or title, optional.
  string stated_role = 5 [(buf.validate.field).string.max_len = 120];
  // Version identifier of the consent text shown; must match the current
  // version served on the registration page.
  string consent_version = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
  // Explicit acknowledgement that activity and assistant conversations are
  // stored and visible to the owner. Must be true.
  bool consent_accepted = 7 [(buf.validate.field).bool.const = true];
  // Cloudflare Turnstile response token from the registration page.
  string turnstile_token = 8 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
  }];
}

// Always the same body; see Register.
message RegisterResponse {
  // Fixed text for display: "Check your email for a verification link."
  string message = 1;
}

// Verification by link token or by code.
message VerifyRequest {
  // Exactly one of the two credentials.
  oneof credential {
    // Single-use token from the emailed link.
    string token = 1 [(buf.validate.field).string = {
      min_len: 16
      max_len: 256
    }];
    // Six-digit code from the email; requires `email`.
    string code = 2 [(buf.validate.field).string.pattern = "^[0-9]{6}$"];
  }
  // Email address the code was sent to; required with `code`, ignored with
  // `token`.
  string email = 3 [(buf.validate.field).string.max_len = 254];
}

// Verification result; the session cookie is set on this response.
message VerifyResponse {
  // The now-active member.
  Me me = 1;
  // True when the first-visit questionnaire has not been completed; the
  // client should route to `/me/interests`.
  bool questionnaire_pending = 2;
}

// Resend request.
message ResendVerificationRequest {
  // Email address of the unverified account.
  string email = 1 [(buf.validate.field).string = {
    email: true
    max_len: 254
  }];
}

// Always the same body.
message ResendVerificationResponse {
  // Fixed text for display.
  string message = 1;
}

// Sign-in form.
message LoginRequest {
  // Email address.
  string email = 1 [(buf.validate.field).string = {
    email: true
    max_len: 254
  }];
  // Password.
  string password = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  // Turnstile token; required after repeated failures for the account or IP
  // (the server responds `failed_precondition` with reason
  // `turnstile_required` when it is missing but needed).
  string turnstile_token = 3 [(buf.validate.field).string.max_len = 2048];
}

// Sign-in result; the session cookie is set on this response.
message LoginResponse {
  // The signed-in member, always active.
  //
  // The old comment said `status` may be UNVERIFIED here and that "such
  // a session can only call verification methods". It cannot be: Login
  // refuses an unverified account with `failed_precondition` and never
  // reaches this response, so no session is ever minted in that state.
  Me me = 1;
  // Always false. It was meant to be true for an admin session awaiting
  // MfaVerify, and nothing ever set it: the handler assigns `false` with
  // a note deferring it to a task that was not done. The owner decided
  // on 2026-10-09 not to build a second factor, so it stays false.
  // Retained because career.v1 is additive-only and clients may read it.
  bool mfa_required = 2;
  // True when the first-visit questionnaire has not been completed.
  bool questionnaire_pending = 3;
}

// Empty.
message LogoutRequest {}

// Empty.
message LogoutResponse {}

// Empty.
message LogoutAllRequest {}

// Number of sessions revoked.
message LogoutAllResponse {
  // Sessions revoked, including the current one.
  int32 revoked = 1;
}

// Password-reset request.
message ForgotPasswordRequest {
  // Email address of the account.
  string email = 1 [(buf.validate.field).string = {
    email: true
    max_len: 254
  }];
}

// Always the same body.
message ForgotPasswordResponse {
  // Fixed text for display.
  string message = 1;
}

// Password-reset completion.
message ResetPasswordRequest {
  // Single-use token from the reset email.
  string token = 1 [(buf.validate.field).string = {
    min_len: 16
    max_len: 256
  }];
  // New password, same rules as registration.
  string new_password = 2 [(buf.validate.field).string = {
    min_len: 12
    max_len: 256
  }];
}

// Reset result; the session cookie is set on this response.
message ResetPasswordResponse {
  // The signed-in member.
  Me me = 1;
}

// Password change for a signed-in member.
message ChangePasswordRequest {
  // Current password.
  string current_password = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  // New password, same rules as registration.
  string new_password = 2 [(buf.validate.field).string = {
    min_len: 12
    max_len: 256
  }];
}

// Number of other sessions revoked.
message ChangePasswordResponse {
  // Other sessions revoked.
  int32 revoked = 1;
}

// Email change for a signed-in member.
message ChangeEmailRequest {
  // New email address; a verification email is sent there.
  string new_email = 1 [(buf.validate.field).string = {
    email: true
    max_len: 254
  }];
  // Current password; required unless the account is social-only.
  string current_password = 2 [(buf.validate.field).string.max_len = 256];
}

// Always the same body.
message ChangeEmailResponse {
  // Fixed text for display.
  string message = 1;
}

// Empty.
message MfaEnrollRequest {}

// TOTP enrolment material. Shown once; the secret is not retrievable later.
message MfaEnrollResponse {
  // otpauth:// URI for authenticator apps.
  string otpauth_uri = 1;
  // The same secret in Base32 for manual entry.
  string secret_base32 = 2;
  // One-time recovery codes.
  repeated string recovery_codes = 3;
}

// TOTP verification.
message MfaVerifyRequest {
  // Six-digit TOTP code or a recovery code.
  string code = 1 [(buf.validate.field).string = {
    min_len: 6
    max_len: 32
  }];
}

// Verification result.
message MfaVerifyResponse {
  // The admin member with `mfa_enrolled` true.
  Me me = 1;
  // Recovery codes remaining, when a recovery code was used.
  int32 recovery_codes_remaining = 2;
}
