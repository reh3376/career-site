// Contact options and the contact form.
syntax = "proto3";

package career.v1;

import "buf/validate/validate.proto";
import "career/v1/options.proto";

option go_package = "github.com/reh3376/career-site/services/api/gen/career/v1;careerv1";

// Reaching the owner outside the assistant.
service ContactService {
  // Returns the owner's availability statement and the contact channels he
  // has chosen to publish.
  rpc GetContactOptions(GetContactOptionsRequest) returns (GetContactOptionsResponse) {
    option (career.v1.auth) = AUTH_LEVEL_MEMBER;
  }
  // Sends a message to the owner. Accepts both signed-in members (identity
  // read from the session cookie) and anonymous visitors (name + email
  // supplied on the form, Turnstile required). The owner receives the
  // message with the sender's context and replies from their mailbox.
  rpc SubmitContact(SubmitContactRequest) returns (SubmitContactResponse) {
    option (career.v1.auth) = AUTH_LEVEL_PUBLIC;
    option (career.v1.rate_limit_per_minute) = 3;
  }
}

// Empty.
message GetContactOptionsRequest {}

// A published contact channel.
message ContactChannel {
  // Channel kind, e.g. `email`, `linkedin`, `scheduling`, `github`.
  string kind = 1;
  // Display label.
  string label = 2;
  // URL or `mailto:` link.
  string url = 3;
}

// Contact page data.
message GetContactOptionsResponse {
  // Availability statement in the owner's words.
  string availability = 1;
  // Location and remote preferences.
  string location_preferences = 2;
  // Channels in display order.
  repeated ContactChannel channels = 3;
}

// Contact form.
message SubmitContactRequest {
  // Subject line.
  string subject = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // Message body.
  string message = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 5000
  }];
  // Preferred reply channel.
  ReplyChannel reply_channel = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Attach a conversation transcript for context; optional.
  string conversation_id = 4 [(buf.validate.field).string.max_len = 64];
  // Categorises the message so the owner can filter the support inbox
  // (FR-CNT-22 / FR-ADM-14). Required.
  SupportCategory category = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Anonymous sender's display name. Required when the request has no
  // session cookie; ignored when it does (the member's name wins).
  string name = 6 [(buf.validate.field).string.max_len = 200];
  // Anonymous sender's email. Required + validated as an email address
  // when the request has no session cookie; ignored when it does.
  string email = 7 [(buf.validate.field).string.max_len = 320];
  // Cloudflare Turnstile response token. Required on anonymous
  // submissions; ignored for members.
  string turnstile_token = 8 [(buf.validate.field).string.max_len = 4096];

  // How the member wants a reply.
  enum ReplyChannel {
    // Not set.
    REPLY_CHANNEL_UNSPECIFIED = 0;
    // Email to the member's verified address, or (for anonymous
    // submitters) to the email supplied on the form.
    REPLY_CHANNEL_EMAIL = 1;
    // LinkedIn message (requires a linked LinkedIn profile).
    REPLY_CHANNEL_LINKEDIN = 2;
  }
}

// Category buckets for the support inbox (FR-CNT-22).
enum SupportCategory {
  // Not set.
  SUPPORT_CATEGORY_UNSPECIFIED = 0;
  // Open-ended question about the site or the owner.
  SUPPORT_CATEGORY_GENERAL_QUESTION = 1;
  // Bug report — something on the site isn't working.
  SUPPORT_CATEGORY_BUG_REPORT = 2;
  // Feature request or suggestion.
  SUPPORT_CATEGORY_FEATURE_REQUEST = 3;
  // Request to be added as a collaborator on one of the owner's public
  // GitHub repositories. Body should name the repo.
  SUPPORT_CATEGORY_CONTRIBUTOR_ACCESS = 4;
  // Press, interview, or podcast inquiry.
  SUPPORT_CATEGORY_PRESS_INQUIRY = 5;
  // Anything not covered above.
  SUPPORT_CATEGORY_OTHER = 6;
}

// Submission receipt.
message SubmitContactResponse {
  // Ticket identifier quoted in the owner's reply.
  string ticket_id = 1;
}
