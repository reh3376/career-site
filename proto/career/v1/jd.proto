// JD-upload → tailored-résumé pipeline. Signed-in members submit a job
// description; the reviewer extracts its requirements, judges each one
// against Roger's career corpus (one judge call per requirement),
// computes the score in code, classifies it into a fit category and,
// when the fit is strong or better, writes a tailored 2-page résumé
// rendered as a locked PDF. Below the gate the member still sees every
// verdict, not just a number.
//
// SubmitJd is fire-and-forget: it returns an id the caller polls via
// GetJdResult while the pipeline (15 to 30 minutes on the production
// box, one submission at a time) runs in the background.
syntax = "proto3";

package career.v1;

import "buf/validate/validate.proto";
import "career/v1/options.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/reh3376/career-site/services/api/gen/career/v1;careerv1";

// JD-upload flow, members only: a signed-in session is required to
// submit or poll, and the submitting member is recorded on the row.
service JdService {
  // Accepts a job description and stores it for scoring. Returns the
  // submission id the caller uses to poll GetJdResult. Never blocks
  // on the actual scoring / generation — those run out of band.
  rpc SubmitJd(SubmitJdRequest) returns (SubmitJdResponse) {
    option (career.v1.auth) = AUTH_LEVEL_MEMBER;
    option (career.v1.rate_limit_per_minute) = 3;
  }
  // Returns the current state of a submission (received / scoring /
  // below-threshold / generating / ready / failed) with progress, the
  // score and fit category once known, and, for the submitting member
  // or a caller holding the result token, the requirement verdicts plus
  // the résumé and its PDF link when status is `ready`.
  rpc GetJdResult(GetJdResultRequest) returns (GetJdResultResponse) {
    option (career.v1.auth) = AUTH_LEVEL_MEMBER;
    option (career.v1.rate_limit_per_minute) = 30;
  }
  // Lists the signed-in member's own submissions, newest first, so a
  // review can be reopened after the tab that submitted it is gone.
  rpc ListMySubmissions(ListMySubmissionsRequest) returns (ListMySubmissionsResponse) {
    option (career.v1.auth) = AUTH_LEVEL_MEMBER;
    option (career.v1.rate_limit_per_minute) = 30;
  }
  // Returns the fit bands in force (the gate is the "strong" edge), so
  // the JD pages quote the numbers the pipeline actually uses.
  rpc GetJdReviewConfig(GetJdReviewConfigRequest) returns (GetJdReviewConfigResponse) {
    option (career.v1.auth) = AUTH_LEVEL_MEMBER;
    option (career.v1.rate_limit_per_minute) = 60;
  }
}

// Where the JD text came from — mirrors jd_submissions.source_kind.
// New sources are added here as the frontend gains upload paths;
// nothing in the schema breaks when this list grows.
enum JdSource {
  // Not set (proto3 requires a zero value). Rejected in requests.
  JD_SOURCE_UNSPECIFIED = 0;
  // Pasted directly into the textarea on /jd-upload.
  JD_SOURCE_PASTE = 1;
  // Uploaded PDF; text extracted server-side. Reserved: the form only
  // sends PASTE today.
  JD_SOURCE_PDF = 2;
  // Uploaded plain-text file (.txt, .md). Reserved: the form only
  // sends PASTE today.
  JD_SOURCE_TEXT_UPLOAD = 3;
}

// Lifecycle of a submission — mirrors jd_submissions.status.
enum JdStatus {
  // Not set. Servers never return this; callers never send it.
  JD_STATUS_UNSPECIFIED = 0;
  // Stored, waiting to be scored.
  JD_STATUS_RECEIVED = 1;
  // Retrieval + scoring is running.
  JD_STATUS_SCORING = 2;
  // Score below the résumé gate (the "strong" fit band in force, see
  // JdFitBands); the caller still gets the verdict breakdown.
  JD_STATUS_BELOW_THRESHOLD = 3;
  // Score at or above the gate; résumé generation is running.
  JD_STATUS_GENERATING = 4;
  // Résumé is ready; generated_resume_url is populated.
  JD_STATUS_READY = 5;
  // Anything above raised an error; see error_message for detail.
  JD_STATUS_FAILED = 6;
  // The submitted text is not a job posting (a list of search terms, a
  // résumé, a fragment), so nothing was scored. error_message says what
  // it looked like and what to do. This is a refusal, not a failure: a
  // score computed from the wrong kind of input looks exactly like a
  // real one and means nothing.
  JD_STATUS_NOT_A_POSTING = 7;
}

// Submission request. Exactly one of jd_text (paste) OR
// jd_pdf_bytes (uploaded PDF) OR jd_text_upload_bytes (uploaded .txt)
// is expected — the handler surfaces InvalidArgument otherwise.
message SubmitJdRequest {
  // Full JD text pasted into the textarea. Capped at 50 000 chars
  // by the RPC. Mutually exclusive with the byte-body fields below.
  string jd_text = 1 [(buf.validate.field).string.max_len = 50000];
  // Where the text came from — the frontend sets this so the
  // backend knows what to record.
  JdSource source = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Optional role / title the member is considering Roger for.
  // Free-form; shown in admin triage and passed as a hint to the
  // requirement and résumé prompts.
  string role_hint = 3 [(buf.validate.field).string.max_len = 200];
  // Optional employer name (e.g. "Anthropic"). Same free-form
  // triage aid and prompt hint as role_hint.
  string employer_hint = 4 [(buf.validate.field).string.max_len = 200];
  // Optional extra address for the finished-review email; the member's
  // account email always receives it. Never surfaced publicly.
  string contact_email = 5 [(buf.validate.field).string.max_len = 254];
  // Optional link to apply for the position (http or https). Shown
  // to Roger in the admin triage view; never surfaced publicly.
  string apply_url = 6 [(buf.validate.field).string.max_len = 2048];
}

// Submission response. Deliberately minimal — the async scoring +
// generation happens in the background; the caller polls
// GetJdResult with this id.
message SubmitJdResponse {
  // Server-issued id (numeric, stringified over the wire).
  string submission_id = 1;
  // Current status — usually RECEIVED right at submit time.
  JdStatus status = 2;
  // Fixed human-readable acknowledgement text the /jd-upload page
  // renders back to the caller so the copy stays server-controlled.
  string message = 3;
  // Secret issued once per submission (hex). Present it on
  // GetJdResult to receive the verdicts and the generated résumé. The
  // submitting member's own session releases the same things without
  // it, so a review can be reopened from /jd-upload/<id> later.
  string result_token = 4;
}

// Poll request.
message GetJdResultRequest {
  // ID from SubmitJdResponse.
  string submission_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
  // Token from SubmitJdResponse; optional. Gates the verdicts and the
  // résumé body unless the caller is the submitting member.
  string result_token = 2 [(buf.validate.field).string.max_len = 64];
}

// Poll response.
message GetJdResultResponse {
  // Current status.
  JdStatus status = 1;
  // Match score in [0, 1] once known; unset before scoring runs
  // and after a failure.
  optional double match_score = 2;
  // Download path of the locked résumé PDF, with the result token
  // appended, when status is READY and the caller may see the résumé;
  // empty otherwise.
  string generated_resume_url = 3;
  // Human-readable error text when status is FAILED; empty otherwise.
  string error_message = 4;
  // When the submission was first accepted.
  google.protobuf.Timestamp created_at = 5;
  // When the terminal state (ready / below_threshold / failed) was
  // reached. Unset while the pipeline is still running.
  google.protobuf.Timestamp completed_at = 6;
  // Generated résumé in markdown, only when status is READY and the
  // caller is the submitting member or carried the result_token.
  string resume_markdown = 7;
  // Requirement-by-requirement verdicts behind the score, released to
  // the submitting member (or with the result_token) whatever the
  // outcome, so a below-threshold result shows what was and was not
  // evidenced instead of a bare number (the opposite of an ATS
  // musts-and-misses filter).
  repeated RequirementVerdict verdicts = 8;
  // Number of requirements judged met.
  int32 met_count = 9;
  // Number judged partially met.
  int32 partial_count = 10;
  // Number judged not evidenced.
  int32 unmet_count = 11;
  // The résumé gate in force: the "strong" fit band (owner-editable;
  // JD_MATCH_THRESHOLD only seeds it the first time).
  double match_threshold = 12;
  // Pipeline progress, 0 to 100, while the submission is live; 100
  // once it has finished.
  int32 progress_pct = 13;
  // Short human-readable stage ("judging requirement 4 of 12").
  string progress_stage = 14;
  // Fit category derived from the score once known: very_strong,
  // strong, possible, weak, very_weak; empty before scoring.
  string fit_category = 15;
}

// Lower edges of the fit categories; scores below weak are very weak.
// Owner-editable from /admin/jd (stored in app_settings, cached briefly
// by the api); the strong edge is the résumé gate.
message JdFitBands {
  // Very strong at or above this score.
  double very_strong = 1;
  // Strong at or above this score; also the résumé gate.
  double strong = 2;
  // Possible at or above this score.
  double possible = 3;
  // Weak at or above this score.
  double weak = 4;
}

// Config request; the member is the session.
message GetJdReviewConfigRequest {}

// The bands in force.
message GetJdReviewConfigResponse {
  // Current bands.
  JdFitBands bands = 1;
}

// List request; the member is the session.
message ListMySubmissionsRequest {}

// The member's submissions, newest first.
message ListMySubmissionsResponse {
  // Up to 100 rows.
  repeated MySubmission submissions = 1;
}

// One of the member's own submissions, enough to pick it from a list.
message MySubmission {
  // Submission id (numeric, stringified); opens /jd-upload/<id>.
  string id = 1;
  // Current status.
  JdStatus status = 2;
  // Match score once known.
  optional double match_score = 3;
  // Role the member typed on the form, if any.
  string role_hint = 4;
  // Employer the member typed on the form, if any.
  string employer_hint = 5;
  // When it was submitted.
  google.protobuf.Timestamp created_at = 6;
  // When it reached a terminal state; unset while running.
  google.protobuf.Timestamp completed_at = 7;
  // True when a tailored résumé exists for it.
  bool has_resume = 8;
  // Fit category once scored (see GetJdResultResponse.fit_category).
  string fit_category = 9;
  // Pipeline progress, 0 to 100.
  int32 progress_pct = 10;
}

// One requirement the reviewer extracted from the posting and the
// verdict it reached from the candidate's records.
message RequirementVerdict {
  // Requirement id within the submission (r1, r2, ...).
  string id = 1;
  // The requirement in the posting's own words.
  string text = 2;
  // "must" or "nice", as the posting stated it.
  string category = 3;
  // Weight 1 to 3 used in the score. Must items always count in the
  // denominator; nice items only when evidenced.
  int32 weight = 4;
  // "met", "partial" or "unmet" (scored 1, 0.5 and 0 in code).
  string verdict = 5;
  // One-sentence reason, grounded in the evidence the judge saw.
  string rationale = 6;
}
