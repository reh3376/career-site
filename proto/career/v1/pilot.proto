// The employer-side pilot, run on the site (FSD §5.16 FR-PLT-03..14;
// docs/framework-research/15-pilot-on-site.md).
//
// Ten recruiters and hiring managers, each holding a whitelisted
// account with the pilot flag, take the survey instrument, read a mocked
// match record and the company hiring workflow, and comment on both.
// The instrument is versioned data rendered by the site; every answer
// carries a per-item flag; comments never change the record.
//
// Every member RPC here refuses a caller without the pilot flag, unless
// the caller is an admin, who sees the pilot as a participant would.
// The admin RPCs read and export; nothing a participant wrote is ever
// shown on a public page.
syntax = "proto3";

package career.v1;

import "buf/validate/validate.proto";
import "career/v1/options.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/reh3376/career-site/services/api/gen/career/v1;careerv1";

// The pilot: one sitting per participant per instrument version.
service PilotService {
  // Says whether the caller may enter the pilot, and where they are in
  // it. Safe to call before starting; returns allowed=false for a
  // member without the flag rather than an error, so the page can
  // render a plain 404.
  rpc GetPilot(GetPilotRequest) returns (GetPilotResponse) {
    option (career.v1.auth) = AUTH_LEVEL_MEMBER;
  }
  // Records consent and the recording preference and opens the
  // session, or resumes the one the caller already has for the current
  // instrument version.
  rpc StartPilot(StartPilotRequest) returns (StartPilotResponse) {
    option (career.v1.auth) = AUTH_LEVEL_MEMBER;
  }
  // Returns one survey section with the caller's branch applied and any
  // answers already saved for it, and records that it was opened.
  rpc GetPilotSection(GetPilotSectionRequest) returns (GetPilotSectionResponse) {
    option (career.v1.auth) = AUTH_LEVEL_MEMBER;
  }
  // Saves a section's answers and flags, records the submit instant,
  // and says which section is next. Resubmitting a section replaces
  // its answers.
  rpc SubmitPilotSection(SubmitPilotSectionRequest) returns (SubmitPilotSectionResponse) {
    option (career.v1.auth) = AUTH_LEVEL_MEMBER;
  }
  // Returns the mocked match record and the caller's comments on it.
  rpc GetPilotRecord(GetPilotRecordRequest) returns (GetPilotRecordResponse) {
    option (career.v1.auth) = AUTH_LEVEL_MEMBER;
  }
  // Returns the company hiring workflow and the caller's comments on it.
  rpc GetPilotWorkflow(GetPilotWorkflowRequest) returns (GetPilotWorkflowResponse) {
    option (career.v1.auth) = AUTH_LEVEL_MEMBER;
  }
  // Saves or replaces one comment on a record row or a workflow node.
  // An empty body removes it.
  rpc UpsertPilotComment(UpsertPilotCommentRequest) returns (UpsertPilotCommentResponse) {
    option (career.v1.auth) = AUTH_LEVEL_MEMBER;
  }
  // Marks the record or the workflow part done, so the pilot home can
  // show progress. Comments can still be edited afterwards.
  rpc MarkPilotPart(MarkPilotPartRequest) returns (MarkPilotPartResponse) {
    option (career.v1.auth) = AUTH_LEVEL_MEMBER;
  }
  // Closes the session. Allowed once the survey is submitted; the two
  // reading parts may be finished or not, and the session says which.
  rpc FinishPilot(FinishPilotRequest) returns (FinishPilotResponse) {
    option (career.v1.auth) = AUTH_LEVEL_MEMBER;
  }
  // Lists every pilot session with its participant, branch, status and
  // timings, for /admin/pilot.
  rpc ListPilotSessions(ListPilotSessionsRequest) returns (ListPilotSessionsResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.audit) = AUDIT_LEVEL_NONE;
  }
  // One session in full: answers with flags, comments by target, and
  // the section open and submit instants.
  rpc GetPilotSession(GetPilotSessionRequest) returns (GetPilotSessionResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.audit) = AUDIT_LEVEL_NONE;
  }
  // Exports one table as CSV, keyed by the participant code the admin
  // assigns rather than by name or address, for the private folder.
  rpc ExportPilot(ExportPilotRequest) returns (ExportPilotResponse) {
    option (career.v1.auth) = AUTH_LEVEL_ADMIN;
    option (career.v1.audit) = AUDIT_LEVEL_RECORDED;
  }
}

// One pilot sitting.
message PilotSession {
  // Session id (UUID).
  string id = 1;
  // consented or finished.
  string status = 2;
  // recruiter, hm, both, or empty until A1 is answered.
  string role_branch = 3;
  // The instrument version this session answers.
  string instrument_version = 4;
  // When consent was recorded.
  google.protobuf.Timestamp consent_at = 5;
  // Whether the participant allowed the call to be recorded.
  bool recording_ok = 6;
  // When the last survey section was submitted; unset until then.
  google.protobuf.Timestamp survey_finished_at = 7;
  // When the record part was marked done; unset until then.
  google.protobuf.Timestamp record_finished_at = 8;
  // When the workflow part was marked done; unset until then.
  google.protobuf.Timestamp workflow_finished_at = 9;
  // When the session was closed; unset until then.
  google.protobuf.Timestamp finished_at = 10;
  // Section ids already submitted, in instrument order.
  repeated string sections_done = 11;
  // The next section to show, or empty when the survey is complete.
  string next_section = 12;
}

// Request for the caller's pilot status; takes nothing.
message GetPilotRequest {}

// Whether the caller may enter, and where they are.
message GetPilotResponse {
  // False for a member without the pilot flag who is not an admin.
  bool allowed = 1;
  // True when the caller is an admin, who passes the gate regardless.
  bool admin = 2;
  // The instrument version a new session would answer.
  string instrument_version = 3;
  // The caller's session, unset until StartPilot.
  PilotSession session = 4;
}

// Consent and the recording preference.
message StartPilotRequest {
  // Required: the participant ticked the consent box.
  bool consent = 1;
  // Optional: the call may be recorded.
  bool recording_ok = 2;
}

// The opened or resumed session.
message StartPilotResponse {
  // The session as it now stands.
  PilotSession session = 1;
}

// A labelled scale for a scale item.
message PilotScale {
  // Lowest value offered.
  int32 min = 1;
  // Highest value offered.
  int32 max = 2;
  // Label under the lowest value.
  string min_label = 3;
  // Label under the highest value.
  string max_label = 4;
}

// One rating dimension of a rating_per_selected item.
message PilotDimension {
  // Dimension id, the key used in the answer.
  string id = 1;
  // What the dimension asks.
  string label = 2;
  // The options offered.
  repeated string options = 3;
}

// One survey item as the participant sees it.
message PilotItem {
  // Item id (A1, C1, D7b).
  string id = 1;
  // single, multi, text, number, scale, single_from, rating_per_selected.
  string type = 2;
  // The question.
  string prompt = 3;
  // Help text under the question; empty when none.
  string help = 4;
  // Options for single and multi items. For single_from and
  // rating_per_selected, the rows resolved from the source item's
  // saved answer, in the order they were selected.
  repeated string options = 5;
  // Maximum selections for a multi item; 0 means no limit.
  int32 max_select = 6;
  // Whether an answer is required to submit the section.
  bool required = 7;
  // The scale for a scale item.
  PilotScale scale = 8;
  // The dimensions for a rating_per_selected item.
  repeated PilotDimension dimensions = 9;
  // True for the pilot-only closing items.
  bool pilot_only = 10;
  // For single_from and rating_per_selected, the id of the multi item
  // whose selection supplies the rows (C1 for C2 and C3), so a page
  // holding both can draw the rows from the live selection before
  // anything is saved. Empty for every other type.
  string source_item = 11;
}

// One answer, with the per-item flag.
message PilotAnswer {
  // Item id.
  string item_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 8
  }];
  // The answer as JSON, shaped by the item type: a string for single and
  // single_from, an array of strings for multi, a string for text, a
  // number for number and scale, and an object keyed by selected option
  // with one value per dimension for rating_per_selected. The server
  // validates the shape against the instrument.
  string value_json = 2 [(buf.validate.field).string.max_len = 20000];
  // "This was unclear or didn't fit me."
  bool flagged = 3;
}

// Request for one section.
message GetPilotSectionRequest {
  // Section id (A to F, P).
  string section_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2
  }];
}

// One section with the caller's saved answers.
message GetPilotSectionResponse {
  // Section id.
  string id = 1;
  // Section title.
  string title = 2;
  // Text shown above the items; the concept paragraph for section E.
  string intro = 3;
  // The items, filtered by the caller's branch, with resolved rows.
  repeated PilotItem items = 4;
  // Answers already saved for this section.
  repeated PilotAnswer answers = 5;
  // One-based position of this section among those the caller will see.
  int32 index = 6;
  // How many sections the caller will see.
  int32 total = 7;
  // The session, so the page can show progress without a second call.
  PilotSession session = 8;
}

// A section's answers.
message SubmitPilotSectionRequest {
  // Section id.
  string section_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2
  }];
  // Every answered item in the section. A required item left
  // unanswered is refused with the item id in the message.
  repeated PilotAnswer answers = 2 [(buf.validate.field).repeated.max_items = 60];
}

// What to show next.
message SubmitPilotSectionResponse {
  // The session as it now stands, with sections_done and next_section.
  PilotSession session = 1;
  // True when A1 routed the caller out of the survey ("none of these").
  bool ended = 2;
}

// Request for the match record; takes nothing.
message GetPilotRecordRequest {}

// The mocked match record and the caller's comments.
message GetPilotRecordResponse {
  // The record as JSON: header, legend, ten rows and footer, in the
  // shape documented in services/api/internal/pilot/data. Rendered by
  // the site; never edited by a participant.
  string record_json = 1;
  // The caller's comments on the record, by target.
  repeated PilotComment comments = 2;
  // The record version, for the export.
  string record_version = 3;
}

// Request for the workflow; takes nothing.
message GetPilotWorkflowRequest {}

// One node of the company hiring workflow.
message PilotWorkflowNode {
  // Node id (C-01 to C-26).
  string id = 1;
  // Phase id (A to E).
  string phase = 2;
  // Node name.
  string name = 3;
  // Who owns the node.
  string owner = 4;
  // One or two sentences on what happens there.
  string summary = 5;
  // True for a decision point.
  bool decision = 6;
  // True when the node's existence is open pending the pilot.
  bool open = 7;
}

// One phase of the workflow.
message PilotWorkflowPhase {
  // Phase id.
  string id = 1;
  // Phase title.
  string title = 2;
}

// The company workflow and the caller's comments.
message GetPilotWorkflowResponse {
  // Text shown above the chart.
  string intro = 1;
  // The six prompts, shown as guidance for what kind of comment helps.
  repeated string prompts = 2;
  // The five phases.
  repeated PilotWorkflowPhase phases = 3;
  // The nodes, in order.
  repeated PilotWorkflowNode nodes = 4;
  // The caller's comments, by target.
  repeated PilotComment comments = 5;
  // The workflow revision, for the export.
  string workflow_version = 6;
}

// One comment on a target.
message PilotComment {
  // record_row, record_general, workflow_node, workflow_missing, workflow_general.
  string target_kind = 1;
  // r1..r10, C-01..C-26, a sequence number for missing steps, or empty.
  string target_id = 2;
  // The comment.
  string body = 3;
  // When it was last saved.
  google.protobuf.Timestamp updated_at = 4;
}

// A comment to save or replace.
message UpsertPilotCommentRequest {
  // record_row, record_general, workflow_node, workflow_missing, workflow_general.
  string target_kind = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
  // The target within the kind; validated against the record or the
  // workflow. Empty for the general kinds.
  string target_id = 2 [(buf.validate.field).string.max_len = 16];
  // The comment. Empty removes an existing comment.
  string body = 3 [(buf.validate.field).string.max_len = 4000];
}

// The saved comment, or empty when it was removed.
message UpsertPilotCommentResponse {
  // The comment as stored; unset when removed.
  PilotComment comment = 1;
}

// Which reading part is done.
message MarkPilotPartRequest {
  // record or workflow.
  string part = 1 [(buf.validate.field).string = {
    in: ["record", "workflow"]
  }];
}

// The session after the mark.
message MarkPilotPartResponse {
  // The session as it now stands.
  PilotSession session = 1;
}

// Request to close the session; takes nothing.
message FinishPilotRequest {}

// The closed session.
message FinishPilotResponse {
  // The session as it now stands.
  PilotSession session = 1;
}

// Request for the session list; takes nothing.
message ListPilotSessionsRequest {}

// One row of the admin session list.
message PilotSessionSummary {
  // The session.
  PilotSession session = 1;
  // Participant's member id.
  string member_id = 2;
  // Participant's display name.
  string name = 3;
  // Participant's email.
  string email = 4;
  // Minutes between the first section opened and the last submitted,
  // measured server-side; 0 until the survey is complete.
  int32 measured_minutes = 5;
  // What the participant said it took; 0 until answered.
  int32 self_reported_minutes = 6;
  // How many comments the participant left.
  int32 comment_count = 7;
  // How many items the participant flagged.
  int32 flag_count = 8;
}

// Every pilot session, newest first.
message ListPilotSessionsResponse {
  // The sessions.
  repeated PilotSessionSummary sessions = 1;
  // The instrument version currently fielded.
  string instrument_version = 2;
}

// Request for one session.
message GetPilotSessionRequest {
  // Session id.
  string session_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

// One section open or submit instant.
message PilotSectionEvent {
  // Section id.
  string section = 1;
  // opened or submitted.
  string event = 2;
  // When.
  google.protobuf.Timestamp at = 3;
}

// One session in full.
message GetPilotSessionResponse {
  // The summary row.
  PilotSessionSummary summary = 1;
  // Every answer with its flag, in instrument order.
  repeated PilotAnswer answers = 2;
  // Every comment, by target.
  repeated PilotComment comments = 3;
  // Section open and submit instants, oldest first.
  repeated PilotSectionEvent events = 4;
}

// Which table to export.
message ExportPilotRequest {
  // sessions, answers or comments.
  string table = 1 [(buf.validate.field).string = {
    in: ["sessions", "answers", "comments"]
  }];
}

// A CSV export.
message ExportPilotResponse {
  // CSV with a header row. Participants appear as P-NN codes assigned
  // by session order, never by name or address.
  string csv = 1;
  // Rows in csv, excluding the header.
  int32 row_count = 2;
}
