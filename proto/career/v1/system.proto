// Build and runtime information.
//
// Health probes are plain HTTP GET for monitors and the reverse proxy:
//
//   GET /api/healthz   200 {"status":"ok"} when the process is up.
//   GET /api/readyz    200 {"status":"ok","checks":{...},"version":"..."} when
//                      the database, object storage, and sidecar are
//                      reachable; 503 with the failing checks otherwise.
syntax = "proto3";

package career.v1;

import "career/v1/options.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/reh3376/career-site/services/api/gen/career/v1;careerv1";

// Version and governance status.
service SystemService {
  // Returns the deployed version and build metadata.
  rpc GetVersion(GetVersionRequest) returns (GetVersionResponse) {
    option (career.v1.auth) = AUTH_LEVEL_PUBLIC;
    option (career.v1.rate_limit_per_minute) = 60;
  }
  // Returns the governance status shown on the public "How this site was
  // built" page: UxTS frameworks, spec counts, last verification, pass rate,
  // and hash-integrity summary, read from the reports CI publishes.
  rpc GetGovernanceStatus(GetGovernanceStatusRequest) returns (GetGovernanceStatusResponse) {
    option (career.v1.auth) = AUTH_LEVEL_PUBLIC;
    option (career.v1.rate_limit_per_minute) = 60;
  }
  // Returns how the JD reviewer is currently measuring, for the public
  // "How Ask Roger works" page: agreement with the owner's own grading,
  // and the last evaluation of the fixed posting set. Read from the
  // same views the admin gate reads, so the public page cannot quote a
  // number the owner is not also looking at.
  rpc GetReviewerStatus(GetReviewerStatusRequest) returns (GetReviewerStatusResponse) {
    option (career.v1.auth) = AUTH_LEVEL_PUBLIC;
    option (career.v1.rate_limit_per_minute) = 60;
  }
}

// Empty.
message GetVersionRequest {}

// Build metadata.
message GetVersionResponse {
  // Semantic version, e.g. `0.4.0`.
  string version = 1;
  // Git commit SHA.
  string commit = 2;
  // Build time.
  google.protobuf.Timestamp built_at = 3;
  // Go toolchain version.
  string go_version = 4;
  // Active persona version.
  string persona_version = 5;
}

// Empty.
message GetGovernanceStatusRequest {}

// One UxTS framework's status.
message FrameworkStatus {
  // Acronym, e.g. `UATS`.
  string acronym = 1;
  // Full name.
  string name = 2;
  // Maturity: `spec-only`, `pilot`, `active`, `deprecated`.
  string status = 3;
  // CI gate mode: `observe`, `soft`, `block`.
  string gate_mode = 4;
  // Canonical specs on disk.
  int32 spec_count = 5;
  // Last run: specs passed.
  int32 passed = 6;
  // Last run: specs failed.
  int32 failed = 7;
  // Last run: hashes verified.
  int32 hashes_verified = 8;
  // Last run: hash mismatches.
  int32 hashes_mismatched = 9;
  // When the last run finished.
  google.protobuf.Timestamp last_run_at = 10;
}

// Governance summary.
message GetGovernanceStatusResponse {
  // Frameworks in matrix order.
  repeated FrameworkStatus frameworks = 1;
  // Commit the reports were produced from.
  string commit = 2;
  // When the summary was published.
  google.protobuf.Timestamp published_at = 3;
}

// Empty.
message GetReviewerStatusRequest {}

// How the reviewer is measuring, in the two ways that can be stated
// without describing anyone's private material.
//
// Everything here is already visible to the owner on /admin/gate. The
// point of publishing it is that a claim about a reviewer being honest
// is worth less than the numbers it is failing on.
message GetReviewerStatusResponse {
  // Verdicts the owner has graded and that could be graded (he can also
  // answer "not enough evidence to judge", which is excluded here).
  int32 graded = 1;
  // Of those, how many he agreed with.
  int32 agreed = 2;
  // Agreement as a percentage, to one decimal place.
  double agreement_pct = 3;
  // Disagreements where the model said met and he said unmet, or the
  // reverse. Counted apart from the softer kind because they mean the
  // model was wrong rather than unsure.
  int32 hard_disagreements = 4;
  // Of the hard disagreements, how many were the model refusing to
  // credit something he can evidence. The opposite direction, crediting
  // what he cannot evidence, is the one that would matter to an
  // employer.
  int32 too_harsh = 5;
  // Of the hard disagreements, how many were the model crediting
  // something he says is not evidenced.
  int32 too_generous = 6;
  // Postings in the fixed evaluation set.
  int32 postings = 7;
  // How many of those were drawn at random from job boards rather than
  // chosen by the owner.
  int32 postings_random = 8;
  // Postings scored in the last completed evaluation.
  int32 scored = 9;
  // How many landed on the side the owner said they should.
  int32 gate_correct = 10;
  // Pairs where a posting he said he could not do outscored one he said
  // he could. Moving the threshold cannot fix one of these.
  int32 inversions = 11;
  // The gap between the two groups. Absent when one side is empty.
  optional double margin = 12;
  // When that evaluation ran.
  google.protobuf.Timestamp evaluated_at = 13;
  // The model that produced it.
  string model = 14;
  // The fit bands in force, so a page can quote the real thresholds
  // without a session. Without these an anonymous reader is shown
  // numbers derived from an environment default, which are right only
  // until the owner edits the bands.
  JdFitBandsPublic bands = 15;
}

// The four thresholds that classify a score.
message JdFitBandsPublic {
  // At or above this is very strong.
  double very_strong = 1;
  // At or above this is strong, and this is the résumé gate.
  double strong = 2;
  // At or above this is possible.
  double possible = 3;
  // At or above this is weak; below it is very weak.
  double weak = 4;
}
