// The tailored home page, assembled server-side in one call.
syntax = "proto3";

package career.v1;

import "career/v1/common.proto";
import "career/v1/content.proto";
import "career/v1/options.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/reh3376/career-site/services/api/gen/career/v1;careerv1";

// One-call assembly of everything the home page renders.
service HomeService {
  // Returns the welcome-back panel, "Start here" path, highlight sections,
  // recommended résumé, hero image, and suggested assistant questions for
  // the calling member.
  rpc GetHome(GetHomeRequest) returns (GetHomeResponse) {
    option (career.v1.auth) = AUTH_LEVEL_MEMBER;
  }
}

// Empty.
message GetHomeRequest {}

// Welcome-back panel data; absent on the first visit.
message WelcomeBack {
  // Start of the previous visit.
  google.protobuf.Timestamp last_visit_at = 1;
  // Number of previous visits.
  int32 previous_visits = 2;
  // Up to three items viewed last time.
  repeated ContentSummary recently_viewed = 3;
  // Topics asked about last time, as short phrases.
  repeated string recent_topics = 4;
  // Items added or updated since the previous visit.
  repeated ContentSummary new_since_last_visit = 5;
  // Conversation to offer resuming, when the last one was recent.
  string resume_conversation_id = 6;
}

// One step of a "Start here" reading path.
message PathItem {
  // Position in the path (1-based).
  int32 position = 1;
  // The item.
  ContentSummary item = 2;
  // True when the member has viewed it.
  bool completed = 3;
}

// A block of highlighted items with the reason it is shown.
message HighlightSection {
  // Section title, e.g. "Roles that match process-control leadership".
  string title = 1;
  // One-line reason, e.g. "Shown first because you selected Industrial automation".
  string reason = 2;
  // Track that drove the section, when any.
  string track_id = 3;
  // Items in order.
  repeated ContentSummary items = 4;
}

// The résumé variant recommended for the member.
message RecommendedResume {
  // Variant identifier (DownloadItem.variant).
  string variant = 1;
  // Display title.
  string title = 2;
  // Version label.
  string version = 3;
  // Download path: `GET /api/downloads/{variant}`.
  string download_path = 4;
  // Why this variant, e.g. "Matches your interest in AI and agentic systems".
  string reason = 5;
}

// Hero image selected for the member's primary track.
message Hero {
  // Renditions from small to large.
  repeated ImageVariant variants = 1;
  // Alt text.
  string alt = 2;
  // Caption.
  string caption = 3;
}

// Home page payload.
message GetHomeResponse {
  // The member.
  Me me = 1;
  // Welcome-back panel; unset on the first visit.
  WelcomeBack welcome_back = 2;
  // "Start here" path for the member's primary track (5–8 items); empty when
  // the member has no interests.
  repeated PathItem start_here = 3;
  // Track the path belongs to.
  string start_here_track_id = 4;
  // Highlight sections in display order.
  repeated HighlightSection highlights = 5;
  // Recommended résumé variant.
  RecommendedResume resume = 6;
  // Hero image.
  Hero hero = 7;
  // Suggested assistant questions for the member's tracks.
  repeated string suggested_questions = 8;
  // True when the first-visit questionnaire is still pending.
  bool questionnaire_pending = 9;
  // True when the page was tailored (tailoring on and interests present).
  bool tailored = 10;
}
