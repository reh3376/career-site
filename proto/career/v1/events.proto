// Product event stream. Browser events (page views, clicks, dwell)
// arrive here from a first-party beacon; server-side events (logins,
// submissions, decisions) are written directly by the api. One table,
// one registry (docs/events/README.md), anonymous and member alike.
syntax = "proto3";

package career.v1;

import "buf/validate/validate.proto";
import "career/v1/options.proto";

option go_package = "github.com/reh3376/career-site/services/api/gen/career/v1;careerv1";

// Accepts browser-minted events. Public so the landing funnel is
// visible before sign-in; the api attaches identity (session member,
// anonymous id cookie), the client address hash and the device class
// itself and never trusts those from the client.
service EventService {
  // Records up to 50 events. Unknown names and oversized props are
  // dropped, never errors; the response says how many were stored.
  rpc Record(RecordRequest) returns (RecordResponse) {
    option (career.v1.auth) = AUTH_LEVEL_PUBLIC;
    option (career.v1.rate_limit_per_minute) = 120;
  }
}

// One browser event.
message BrowserEvent {
  // Client-minted UUID; a retried batch de-duplicates on it.
  string event_id = 1 [(buf.validate.field).string = {
    min_len: 8
    max_len: 64
  }];
  // Registry name (page.view, page.leave, landing.cta_click, ...).
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // Client clock in milliseconds since the epoch; kept for skew
  // analysis, never used for ordering.
  int64 client_ts_ms = 3;
  // Page path (no query string).
  string path = 4 [(buf.validate.field).string.max_len = 512];
  // document.referrer, reduced to its host by the api.
  string referrer = 5 [(buf.validate.field).string.max_len = 1024];
  // UI mode the page rendered in: it | ot.
  string ui_mode = 6 [(buf.validate.field).string.max_len = 8];
  // Event properties as a JSON object; keys are checked against the
  // registry and the whole thing is capped at 2 KB.
  string props_json = 7 [(buf.validate.field).string.max_len = 2048];
}

// A batch of browser events.
message RecordRequest {
  // Up to 50 events.
  repeated BrowserEvent events = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 50
  }];
}

// How the batch was handled.
message RecordResponse {
  // Events stored (duplicates and rejected events are not counted).
  int32 accepted = 1;
}
