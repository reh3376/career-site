// Method-level options that make the API's access policy machine-readable.
//
// **What is enforced today, stated plainly, because this comment has
// been wrong in both directions.** It once claimed interceptor
// enforcement that did not exist. It was corrected to say `auth` was
// enforced per handler, and then the auth sprint landed and left that
// correction stale in turn. The current state:
//
//   auth                  declared on every method; enforced by the
//                         interceptor since 2026-10-11, and the server
//                         refuses to start on an unspecified level
//   allow_unverified      declared on 2; enforced by the interceptor
//   audit                 required on every ADMIN method; enforced by
//                         the audit interceptor, which writes audit_log
//   rate_limit_per_minute deprecated, declared on none. Rate limiting
//                         is real but hand-wired in internal/ratelimit
//   mfa_fresh             deprecated, declared on none, unenforceable
//
// The lesson this header keeps re-learning is ADR 0031's: a comment
// describing enforcement is not enforcement. Each line above is now
// backed by a boot check or a test that fails when it stops being true,
// which is the only reason it is safe to write it down.
//
// The API reference generator (scripts/gen_api_docs.py) reads the same
// options, so documentation stays derived from one declaration.
syntax = "proto3";

package career.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/reh3376/career-site/services/api/gen/career/v1;careerv1";

// Who may call a method.
//
// Enforced by hand inside each handler, not before it. This comment used
// to say "Enforced before the handler runs", which described the
// interceptor in docs/sprint-auth-interceptor.md rather than the code.
// The level here is the contract those handlers are checked against:
// internal/handlers/authpolicy_test.go compares every declaration with
// what its handler actually calls and fails on any disagreement.
//
// A caller below the required level receives the Connect code
// `unauthenticated` (no session) or `permission_denied` (session without
// the role). That part is accurate, because it is what the handlers
// return, and it is what the interceptor will return when S4 moves the
// decision out of them.
enum AuthLevel {
  // Not set, and the server will not start that way: internal/authpolicy
  // builds the policy from these declarations at boot and exits naming
  // any method that left the level unspecified. This comment previously
  // claimed "Lint fails any method that leaves the level unspecified";
  // no such lint rule existed, which is why it is a boot failure now.
  AUTH_LEVEL_UNSPECIFIED = 0;
  // No session required.
  AUTH_LEVEL_PUBLIC = 1;
  // A verified member session is required (status ACTIVE). Methods that an
  // unverified member may call additionally set `allow_unverified`.
  AUTH_LEVEL_MEMBER = 2;
  // An admin session with a recent TOTP verification is required.
  AUTH_LEVEL_ADMIN = 3;
}

// Whether a call is recorded in `audit_log`.
//
// Read at boot by internal/auditpolicy, which builds the map of
// procedures to levels from these declarations and refuses to start if
// an admin method declares nothing. Enforced by an interceptor, so a
// handler cannot forget to record itself and a new admin RPC cannot be
// added without a decision being made about it.
enum AuditLevel {
  // Not set. Legal on a PUBLIC or MEMBER method, where it means the same
  // as AUDIT_LEVEL_NONE. On an ADMIN method the server will not start:
  // "every admin action is recorded" cannot be true if a method can
  // decline to say.
  AUDIT_LEVEL_UNSPECIFIED = 0;
  // Not recorded. Correct for reads, which are the majority of the admin
  // surface, and this is a positive declaration rather than an absence:
  // somebody decided this call does not change anything.
  AUDIT_LEVEL_NONE = 1;
  // Recorded. One row per call, written after the handler returns so the
  // row carries the outcome: an attempt that failed is as much a part of
  // an audit trail as one that succeeded, and a row written beforehand
  // would claim a change that may not have happened.
  //
  // Named for what happens rather than for why, because the set is not
  // exactly "the mutations". Every mutation is here, and so are four
  // reads: RunDbQuery, which runs arbitrary SELECTs across member data,
  // and the three Export methods, which take participant and decision
  // data off the system in bulk. Those change nothing and are among the
  // most audit-worthy things an admin can do. Reads that return a fixed
  // count, or a setting, or a list the console already shows, are NONE.
  AUDIT_LEVEL_RECORDED = 2;
}

extend google.protobuf.MethodOptions {
  // Required access level for the method.
  AuthLevel auth = 50000;
  // When true with `auth = AUTH_LEVEL_MEMBER`, the caller needs a session
  // but not an active account, so a member who is unverified, awaiting
  // approval or expired may still call the method.
  //
  // Enforced by the auth interceptor since 2026-10-11. It is only
  // meaningful alongside AUTH_LEVEL_MEMBER, and the server refuses to
  // start if it is declared on a method at any other level, because
  // PUBLIC resolves no session and ADMIN implies an active account.
  //
  // This matters because a non-active session is reachable: ResetPassword
  // mints one and refuses only DISABLED and DECLINED, so a member who
  // verified into PENDING_APPROVAL and then reset their password holds a
  // session on a non-active account. GetMe has to answer them or the
  // "awaiting approval" state cannot be shown.
  bool allow_unverified = 50001;
  // Deprecated and unused. Set on no method.
  //
  // This declared a per-account or per-IP request budget on 35 methods.
  // Nothing ever read it. Rate limiting is real on this service, but it
  // is hand-wired in `internal/ratelimit` at the handlers that need it
  // (login, password reset, registration, JD submission, events), with
  // its own constants.
  //
  // So these numbers were not merely inert, they were wrong, and in
  // both directions. The contract said Login allowed 10 a minute; the
  // code allows 5 attempts refilling over 15 minutes, roughly thirty
  // times stricter. Anyone reading the contract to understand the
  // throttle got a materially wrong answer.
  //
  // Removed on 2026-10-09 for that reason. The field stays because
  // career.v1 is additive-only and buf breaking refuses to delete a
  // published extension. If budgets are ever driven from the contract,
  // take a new number and make the interceptor the only thing that
  // applies them.
  uint32 rate_limit_per_minute = 50002 [deprecated = true];
  // Deprecated and unused. Set on no method.
  //
  // This described a freshness requirement on an admin session's last
  // TOTP verification, and was declared on 79 admin methods. There has
  // never been a TOTP implementation: no enrolment, no verification
  // timestamp on the session, nothing issuing or checking a code. So it
  // was not an unenforced control, it was an unenforceable one, and on
  // 79 methods it read in a security review as protection that existed.
  //
  // The owner decided on 2026-10-09 not to build a second factor, so
  // every usage was removed rather than left describing something that
  // will never happen. The field itself stays because career.v1 is
  // additive-only and buf breaking refuses to delete a published
  // extension; it is reserved in effect by being deprecated here.
  //
  // If a second factor is ever built, prefer a new field over reviving
  // this one: its number carries the history of having meant something
  // that was never true.
  bool mfa_fresh = 50003 [deprecated = true];
  // Whether a call to this method is written to `audit_log`.
  //
  // Required on every method declaring `auth = AUTH_LEVEL_ADMIN`, and
  // the server refuses to start if one of them leaves it unspecified.
  // That rule is deliberate, and so is its shape: it derives the set of
  // methods that need a decision from another declaration rather than
  // from a guess about the method's name, so adding an admin RPC called
  // `PurgeEverything` cannot slip past a heuristic that was looking for
  // a `Set` or `Delete` prefix.
  //
  // FR-ADM-09 says "all admin actions shall be recorded in the audit
  // log". It was marked partially shipped for a year while `audit_log`
  // held zero rows and no code path inserted into one. Declaring the
  // level here, and failing the boot when it is missing, is what makes
  // the requirement a property of the contract instead of a promise
  // somebody has to remember at every new RPC.
  AuditLevel audit = 50004;
}
