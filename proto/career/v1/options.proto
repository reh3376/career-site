// Method-level options that make the API's access policy machine-readable.
//
// **What is enforced today, stated plainly, because this comment used to
// overstate it.** It read: "The Go server reads these options from the
// method descriptor in a Connect interceptor and enforces them uniformly,
// so no handler carries its own auth check." Every clause of that was
// false. There are no Connect interceptors in the service; `auth` is
// enforced by hand, once per handler, and the other options are not
// enforced at all.
//
//   auth                  declared on every method; enforced per handler
//   allow_unverified      declared on 3; not enforced
//   rate_limit_per_minute deprecated, declared on none. Rate limiting
//                         is real but hand-wired in internal/ratelimit
//   mfa_fresh             deprecated, declared on none, unenforceable
//
// Making `auth` interceptor-enforced is planned in
// docs/sprint-auth-interceptor.md. Until that lands, treat this file as
// a contract the code is checked against (see the auth-gate tests) and
// not as a description of a mechanism.
//
// The API reference generator (scripts/gen_api_docs.py) reads the same
// options, so documentation stays derived from one declaration.
syntax = "proto3";

package career.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/reh3376/career-site/services/api/gen/career/v1;careerv1";

// Who may call a method.
//
// Enforced by hand inside each handler, not before it. This comment used
// to say "Enforced before the handler runs", which described the
// interceptor in docs/sprint-auth-interceptor.md rather than the code.
// The level here is the contract those handlers are checked against:
// internal/handlers/authpolicy_test.go compares every declaration with
// what its handler actually calls and fails on any disagreement.
//
// A caller below the required level receives the Connect code
// `unauthenticated` (no session) or `permission_denied` (session without
// the role). That part is accurate, because it is what the handlers
// return, and it is what the interceptor will return when S4 moves the
// decision out of them.
enum AuthLevel {
  // Not set, and the server will not start that way: internal/authpolicy
  // builds the policy from these declarations at boot and exits naming
  // any method that left the level unspecified. This comment previously
  // claimed "Lint fails any method that leaves the level unspecified";
  // no such lint rule existed, which is why it is a boot failure now.
  AUTH_LEVEL_UNSPECIFIED = 0;
  // No session required.
  AUTH_LEVEL_PUBLIC = 1;
  // A verified member session is required (status ACTIVE). Methods that an
  // unverified member may call additionally set `allow_unverified`.
  AUTH_LEVEL_MEMBER = 2;
  // An admin session with a recent TOTP verification is required.
  AUTH_LEVEL_ADMIN = 3;
}

extend google.protobuf.MethodOptions {
  // Required access level for the method.
  AuthLevel auth = 50000;
  // When true with `auth = AUTH_LEVEL_MEMBER`, a session whose member is
  // still UNVERIFIED may call the method (verification, resend, logout).
  bool allow_unverified = 50001;
  // Deprecated and unused. Set on no method.
  //
  // This declared a per-account or per-IP request budget on 35 methods.
  // Nothing ever read it. Rate limiting is real on this service, but it
  // is hand-wired in `internal/ratelimit` at the handlers that need it
  // (login, password reset, registration, JD submission, events), with
  // its own constants.
  //
  // So these numbers were not merely inert, they were wrong, and in
  // both directions. The contract said Login allowed 10 a minute; the
  // code allows 5 attempts refilling over 15 minutes, roughly thirty
  // times stricter. Anyone reading the contract to understand the
  // throttle got a materially wrong answer.
  //
  // Removed on 2026-10-09 for that reason. The field stays because
  // career.v1 is additive-only and buf breaking refuses to delete a
  // published extension. If budgets are ever driven from the contract,
  // take a new number and make the interceptor the only thing that
  // applies them.
  uint32 rate_limit_per_minute = 50002 [deprecated = true];
  // Deprecated and unused. Set on no method.
  //
  // This described a freshness requirement on an admin session's last
  // TOTP verification, and was declared on 79 admin methods. There has
  // never been a TOTP implementation: no enrolment, no verification
  // timestamp on the session, nothing issuing or checking a code. So it
  // was not an unenforced control, it was an unenforceable one, and on
  // 79 methods it read in a security review as protection that existed.
  //
  // The owner decided on 2026-10-09 not to build a second factor, so
  // every usage was removed rather than left describing something that
  // will never happen. The field itself stays because career.v1 is
  // additive-only and buf breaking refuses to delete a published
  // extension; it is reserved in effect by being deprecated here.
  //
  // If a second factor is ever built, prefer a new field over reviving
  // this one: its number carries the history of having meant something
  // that was never true.
  bool mfa_fresh = 50003 [deprecated = true];
}
