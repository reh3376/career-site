# Code generation for the browser-facing API (package career.v1).
# Run from the repository root with `make gen`, which also applies
# buf.gen.sidecar.yaml. Outputs are committed and drift-checked in CI; the
# .proto files are the single source of truth.
version: v2
inputs:
  - directory: proto
    paths:
      - proto/career/v1
managed:
  enabled: true
  disable:
    - file_option: go_package   # set explicitly in each .proto
plugins:
  # Go: message types + Connect handlers/clients (services/api).
  - remote: buf.build/protocolbuffers/go
    out: services/api/gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go
    out: services/api/gen
    opt: paths=source_relative
  # TypeScript: message types + service descriptors for connect-es (apps/web).
  # include_imports also emits apps/web/src/gen/buf/validate/validate_pb.ts so
  # the generated career/v1 files can resolve their `buf.validate` imports.
  #
  # Pinned, unlike the plugins above and below, because an unpinned
  # remote plugin makes `make gen` non-reproducible and this one proved
  # it: on 2026-09-30 upstream published v2.16.0 between a local
  # regeneration and CI's, so CI regenerated every _pb.ts with a new
  # version stamp, found drift against the committed v2.15.0 output and
  # failed check-gen on main. No code had changed. The images job is
  # gated on that job, so nothing was published and the deploy stopped.
  #
  # Bump this deliberately and commit the regenerated output with it.
  # The other four plugins here carry the same latent hazard and are
  # tracked in docs/backlog.md; they are left alone rather than pinned
  # to a guessed version, because a wrong pin breaks generation outright.
  - remote: buf.build/bufbuild/es:v2.16.0
    out: apps/web/src/gen
    opt:
      - target=ts
      - import_extension=none
    include_imports: true
  # Python: message types (+ stubs) for evaluation tooling in the sidecar.
  # include_imports also emits buf/validate/validate_pb2.py so the sidecar
  # and scripts/gen_api_docs.py can read validation rules from descriptors.
  - remote: buf.build/protocolbuffers/python
    out: services/sidecar/src
    include_imports: true
  - remote: buf.build/protocolbuffers/pyi
    out: services/sidecar/src
    include_imports: true
