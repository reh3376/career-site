# Dependabot config — weekly cadence with two groups per ecosystem:
#   * `<eco>-minor-patch` — safe bumps, batched into one PR per week
#   * `<eco>-major`       — each major bump in its own PR, always
#
# Grouping majors caused an unreviewable "5 packages, 5 major versions
# each" PR (see the closed PR #4). Splitting them lets each major land
# with its own review + codemod pass.
#
# Security updates always ship immediately regardless of these intervals
# or groups.

version: 2

updates:
  # Go modules (API)
  - package-ecosystem: gomod
    directory: /services/api
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/New_York }
    groups:
      go-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(api)" }

  # Python (sidecar)
  - package-ecosystem: pip
    directory: /services/sidecar
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/New_York }
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(sidecar)" }

  # npm (web)
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/New_York }
    groups:
      web-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(web)" }

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/New_York }
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 3
    commit-message: { prefix: "deps(ci)" }

  # Docker base images. Two runtimes are held deliberately rather than
  # taken automatically, for the same reason: a language runtime is not
  # a dependency you drift onto, it is one you choose a date for.
  #
  # Node stays at 22, the current LTS; ignore any major bump until we
  # deliberately move to the next one.
  #
  # Python stays at 3.14. CPython ships a feature release every October
  # and dependabot offered `python:3.15-slim-bookworm` on 2026-11-02,
  # five days after that tag first appeared. 3.15 was then at 3.15.0a6:
  # the proposal was to run the sidecar on an alpha interpreter in
  # production. Minor bumps are ignored here so the next one is a
  # decision with a date on it rather than a Monday pull request.
  - package-ecosystem: docker
    directory: /services/api
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "deps(api)" }
  - package-ecosystem: docker
    directory: /services/sidecar
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "deps(sidecar)" }
    ignore:
      - dependency-name: "python"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: docker
    directory: /apps/web
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "deps(web)" }
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
