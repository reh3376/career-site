# CodeQL configuration for the career-site repository.
#
# `paths-ignore` scopes an audited false-positive to one specific
# source file so the CodeQL rules that fire on it stay active for
# every other file in the codebase. Prefer per-file exclusion over
# global rule disable: a rule that's genuinely worth having in the
# repo shouldn't be silenced repo-wide because of one legitimate
# outlier.
#
# When adding a new entry, ALWAYS include a rationale block above
# it that names (a) the file, (b) which specific rule prompted the
# exclusion, (c) why the exclusion is safe. Reviewers should refuse
# an entry that lacks this rationale.

name: career-site-codeql-config

paths-ignore:
  # File: services/api/internal/auth/pwned.go
  # Rule: go/weak-sensitive-data-hashing (CWE-327 / 328 / 916)
  # Why:  This file is the HaveIBeenPwned k-anonymity checker.
  #       HIBP's public range endpoint only accepts SHA-1 or SHA-256
  #       prefixes — passing a slow KDF (PBKDF2/bcrypt/scrypt/argon2)
  #       digest would break the wire protocol. No password is ever
  #       stored, compared to a stored hash, or persisted anywhere in
  #       this path; only the first 5 hex chars of the SHA-256 digest
  #       leave the process. Password STORAGE in this codebase uses
  #       argon2id (see package `hash`, FR-AUTH-01). See the block
  #       comment on HIBPChecker in pwned.go for the full rationale.
  #
  #       Excluding the whole file is blunter than a per-rule exclude,
  #       but CodeQL config doesn't support scoped `query-filters` by
  #       path. Any new security issue introduced in pwned.go itself
  #       would go uncaught by CodeQL — so keep this file small,
  #       tightly reviewed, and covered by its own unit tests. Every
  #       other Go file in the repo still gets the full ruleset.
  - services/api/internal/auth/pwned.go
