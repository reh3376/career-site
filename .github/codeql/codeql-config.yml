# CodeQL configuration for the career-site repository.
#
# Two suppression mechanisms are in play:
#
#   * `paths-ignore` (below) — file-level exclusion. Only takes effect
#     for interpreted languages (JS / TS / Python / Ruby). Silently
#     ignored for compiled languages (Go, Java, C++) whose extraction
#     comes from build output.
#
#   * `query-filters` (below) — rule-level exclusion. Works for every
#     language. Applies globally to the analyzed codebase, so it
#     should only be used when the rule is broadly not-applicable to
#     THIS codebase — not as a workaround for one file's false
#     positive when the rule is genuinely valuable elsewhere.
#
# When adding a new entry to either section, ALWAYS include a
# rationale block above it. Reviewers should refuse an entry that
# lacks this rationale.

name: career-site-codeql-config

# ---------------------------------------------------------------------
# Global rule exclusions
# ---------------------------------------------------------------------
query-filters:
  # Rule: go/weak-sensitive-data-hashing (CWE-327 / 328 / 916)
  # Why:  The only Go file that hashes password data is
  #       services/api/internal/auth/pwned.go — the HaveIBeenPwned
  #       k-anonymity checker. HIBP's public range endpoint accepts
  #       only SHA-1 or SHA-256 prefixes, so a slow KDF (PBKDF2,
  #       bcrypt, scrypt, argon2) would break the wire protocol.
  #       No password is ever stored, compared to a stored hash, or
  #       persisted anywhere in that path; only the first 5 hex chars
  #       of the SHA-256 digest leave the process.
  #
  #       Password STORAGE in this codebase uses argon2id in package
  #       `hash` (FR-AUTH-01) — a different call path this rule
  #       (correctly) never fires on. So disabling the rule globally
  #       here does not open a real hole today.
  #
  #       CodeQL config does not support per-file rule suppression
  #       for Go (paths-ignore is silently ignored for compiled
  #       languages), so the choice is: dismiss the alert per PR head
  #       (fragile — a code move re-creates it), or disable the rule
  #       globally with this rationale. The latter is durable and
  #       reviewable.
  #
  # If a future PR adds a Go file that hashes password-like data,
  # reviewers must audit whether that call site needs the same
  # justification, or whether the code should switch to argon2id.
  - exclude:
      id: go/weak-sensitive-data-hashing

# ---------------------------------------------------------------------
# Per-file exclusions (interpreted languages only)
# ---------------------------------------------------------------------
# paths-ignore:
#   (none today)
