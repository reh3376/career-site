# CodeQL configuration for the career-site repository.
#
# Two suppression mechanisms are in play:
#
#   * `paths-ignore` (below) — file-level exclusion. Only takes effect
#     for interpreted languages (JS / TS / Python / Ruby). Silently
#     ignored for compiled languages (Go, Java, C++) whose extraction
#     comes from build output.
#
#   * `query-filters` (below) — rule-level exclusion. Works for every
#     language. Applies globally to the analyzed codebase, so it
#     should only be used when the rule is broadly not-applicable to
#     THIS codebase — not as a workaround for one file's false
#     positive when the rule is genuinely valuable elsewhere.
#
# When adding a new entry to either section, ALWAYS include a
# rationale block above it. Reviewers should refuse an entry that
# lacks this rationale.

name: career-site-codeql-config

# Broaden from the default CodeQL query pack to `security-extended`
# and the `security-and-quality` suite. The extended set catches
# real-world classes of issues the default misses (SSRF via URL
# construction, path traversal via string joins, unsafe deserialization,
# more); quality catches coding-style bugs that often correlate with
# real security issues. Both are maintained by the CodeQL team.
queries:
  - uses: security-extended
  - uses: security-and-quality

# ---------------------------------------------------------------------
# Global rule exclusions
# ---------------------------------------------------------------------
query-filters:
  # Rule: go/weak-sensitive-data-hashing (CWE-327 / 328 / 916)
  # Why:  The only Go file that hashes password data is
  #       services/api/internal/auth/pwned.go — the HaveIBeenPwned
  #       k-anonymity checker. HIBP's public range endpoint accepts
  #       only SHA-1 or SHA-256 prefixes, so a slow KDF (PBKDF2,
  #       bcrypt, scrypt, argon2) would break the wire protocol.
  #       No password is ever stored, compared to a stored hash, or
  #       persisted anywhere in that path; only the first 5 hex chars
  #       of the SHA-256 digest leave the process.
  #
  #       Password STORAGE in this codebase uses argon2id in package
  #       `hash` (FR-AUTH-01) — a different call path this rule
  #       (correctly) never fires on. So disabling the rule globally
  #       here does not open a real hole today.
  #
  #       CodeQL config does not support per-file rule suppression
  #       for Go (paths-ignore is silently ignored for compiled
  #       languages), so the choice is: dismiss the alert per PR head
  #       (fragile — a code move re-creates it), or disable the rule
  #       globally with this rationale. The latter is durable and
  #       reviewable.
  #
  # If a future PR adds a Go file that hashes password-like data,
  # reviewers must audit whether that call site needs the same
  # justification, or whether the code should switch to argon2id.
  - exclude:
      id: go/weak-sensitive-data-hashing

# ---------------------------------------------------------------------
# Per-file exclusions (interpreted languages only)
# ---------------------------------------------------------------------
# Rationale (required for every entry, see the header):
#
#   * The buf-generated protobuf / gRPC stubs are never hand-edited and
#     are regenerated by `make gen` from proto/ (templates
#     proto/buf.gen.yaml and proto/buf.gen.sidecar.yaml). protoc emits
#     `import x_pb2 as x__pb2` for descriptor-pool side effects and a
#     `_sym_db` global that newer runtimes no longer read, which is
#     what py/unused-import and py/unused-global-variable flag: 64 of
#     the 65 open alerts on 2026-09-21. ruff and pyright already exclude
#     the same directories (services/sidecar/pyproject.toml); this makes
#     CodeQL agree. The hand-written sidecar package is
#     services/sidecar/src/career_sidecar/ and is deliberately NOT
#     listed; the near-identical `career/` path is the generated one.
#   * node_modules and the Next build output are third-party or derived.
#   * The résumé archive tooling (scripts/audit_resume_dates.py,
#     apply_resume_corrections.py, resume_to_md.py, extract_docs.py)
#     trips py/clear-text-logging-sensitive-data. The rule is about
#     secrets and personal data reaching application logs that other
#     people can read. These are local developer CLIs: they read
#     Roger's own gitignored material under docs/personal, print a
#     report to the terminal of the person who ran them, and are never
#     invoked by the deployed application, by a request path, or by CI
#     (docs/personal/chronology.json does not exist on a CI checkout,
#     so they exit before reading anything). Printing the finding IS
#     the function; a report that cannot name the employer and the two
#     dates that disagree tells the reader nothing, which is what the
#     automated fix proposed on PR #141 and why it was not taken.
#
#     The genuine exposure in that output was reduced first rather than
#     suppressed: the verbatim source line each finding came from is
#     now behind --context, so the default report describes the
#     documents instead of reproducing them. What remains is an
#     employer name and two years, which is the finding itself.
#
#     Narrow by design. If any of these scripts ever gains a network
#     call, a log file, or a CI invocation, this entry stops being
#     true and must be removed.
paths-ignore:
  - services/sidecar/src/career/**
  - services/sidecar/src/buf/**
  - apps/web/src/gen/**
  - "**/node_modules/**"
  - apps/web/.next/**
  - scripts/audit_resume_dates.py
  - scripts/apply_resume_corrections.py
  - scripts/resume_to_md.py
  - scripts/extract_docs.py
