# Security scans: vulnerability checks per toolchain + secret scanning.
# Runs on push, PR, and daily to catch newly-disclosed CVEs against
# unchanged deps.

name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  PNPM_VERSION: "12.4.2"
  UV_VERSION: "0.9.26"

jobs:
  govulncheck:
    name: govulncheck (api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/api/go.sum
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: scan
        working-directory: services/api
        run: govulncheck ./...

  pip-audit:
    name: pip-audit (sidecar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: export requirements
        working-directory: services/sidecar
        run: uv export --frozen --no-dev --no-emit-project --format requirements.txt > /tmp/reqs.txt
      - name: scan
        run: |
          uv tool install pip-audit
          uv tool run pip-audit --requirement /tmp/reqs.txt --strict

  pnpm-audit:
    name: pnpm audit (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: enable pnpm
        run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
      - name: audit
        working-directory: apps/web
        # `pnpm audit --prod` limits to runtime deps so dev-only CVEs do not
        # fail CI. The npm advisories endpoint has intermittent 5xx outages
        # that are not our bug (see status.npmjs.org). Retry 3× with backoff;
        # if it still refuses to respond, warn but do not fail the run — a
        # transient upstream outage should not block deploys.
        run: |
          set +e
          for attempt in 1 2 3; do
            out=$(pnpm audit --prod --audit-level=high 2>&1)
            rc=$?
            echo "$out"
            if [ $rc -eq 0 ]; then
              exit 0
            fi
            if echo "$out" | grep -q 'ERR_PNPM_AUDIT_BAD_RESPONSE\|responded with 5'; then
              echo "::warning::npm advisories endpoint transiently unavailable (attempt $attempt/3)"
              sleep $((attempt * 15))
              continue
            fi
            # Non-transient failure (a real vulnerability): surface it.
            exit $rc
          done
          echo "::warning::pnpm audit could not reach the npm advisories endpoint after 3 retries; continuing"
          exit 0

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Use the CLI directly. The gitleaks-action wrapper tries to diff
      # <first-commit>^..HEAD which explodes on the very first push
      # (the initial commit has no parent). Full-tree `gitleaks detect`
      # is what we want anyway — cheap on a repo this size.
      - name: install gitleaks
        run: |
          v=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: scan
        run: gitleaks detect --source . --no-git --redact --exit-code=1
