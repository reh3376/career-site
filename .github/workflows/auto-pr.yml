# Auto-open a draft PR against main whenever a feature branch is
# pushed, and on every later push rebuild its description from the
# branch's commit messages (scripts/pr_body.sh), so the description
# always says what the PR contains. You flip the draft to
# ready-for-review when the work is done.
#
# Until 2026-11-08 this step did nothing once a PR existed, so the
# description froze at the first push as one line per commit and a
# reviewer could read about commit one and merge commit three. The
# owner's rule is that all work pushed as part of a PR is documented in
# its description; the generated section sits between markers so what a
# person types outside it survives.
#
# Ignores pushes to main itself. Uses GITHUB_TOKEN so no PAT needed;
# the pull-requests: write permission scoped to this workflow only.

name: auto-pr

# This used to keep an allowlist on purpose, and no longer does: the
# trigger below is a denylist, for the reason stated there. The
# paragraph that used to sit here argued the opposite case and outlived
# the decision it described, which is why it is gone rather than edited.
on:
  push:
    # A denylist, not an allowlist, for the same reason ci.yml became
    # one: the allowlist was three prefixes and a branch outside them
    # got no PR at all, silently. On 2026-09-29 a branch named docs/
    # fell outside it, the PR was opened by hand instead, and that
    # quietly broke review: a PR created with `gh pr create` is authored
    # by whoever's token ran it, and GitHub does not let anyone approve
    # their own pull request. The workaround was worse than the gap.
    #
    # Inverting it means a new prefix works the day someone invents it.
    branches-ignore:
      - main
      - "backup/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  open-or-update-pr:
    name: open or update draft PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: open or update draft PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Nothing to open a PR about. A long-lived working branch is
          # reset to main after each merge and pushed, which is a normal
          # part of the single-branch workflow and not a problem:
          # `gh pr create` would fail with "No commits between main and
          # <branch>" and leave a red X on a push that was correct.
          #
          # Checked before the existing-PR lookup because it is cheaper
          # and because it is the common case for a freshly reset
          # branch.
          git fetch -q origin main
          ahead=$(git rev-list --count origin/main.."$GITHUB_SHA")
          if [ "$ahead" -eq 0 ]; then
            echo "$BRANCH has no commits beyond main — nothing to open."
            exit 0
          fi

          # Does a PR already exist for this branch? If so, rebuild the
          # generated section of its description from every commit now on
          # the branch and leave the rest of the body as the author wrote
          # it. The title is not touched on an update.
          existing=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number' || echo "")
          if [ -n "$existing" ]; then
            gh pr view "$existing" --json body --jq .body > /tmp/existing-body.md
            scripts/pr_body.sh merge origin/main "$GITHUB_SHA" /tmp/existing-body.md > /tmp/pr-body.md
            gh pr edit "$existing" --body-file /tmp/pr-body.md
            echo "PR #$existing description rebuilt from $ahead commit(s)."
            exit 0
          fi

          # New PR: the generated summary plus the PR template's checklist
          # and sections for the author to fill.
          scripts/pr_body.sh full origin/main "$GITHUB_SHA" > /tmp/pr-body.md

          # First-line-of-newest-commit as the title.
          title=$(git log -1 --pretty=format:'%s')

          # Auto-pr is the only path that opens PRs for these branches.
          # If this create fails — including the "GitHub Actions is not
          # permitted to create or approve pull requests" permission
          # error — we let it fail loudly. That's a real config problem
          # (owner toggle in Settings → Actions → General) that we want
          # to see, not paper over. Do NOT race this step with manual
          # `gh pr create` calls from a dev shell; that produces spurious
          # concurrent-create failures.
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$title" \
            --body-file /tmp/pr-body.md \
            --draft
