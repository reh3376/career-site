# Auto-open (or keep updated) a draft PR against main whenever a
# feature branch is pushed. Keeps the review surface visible; you flip
# the draft to ready-for-review when the work is done.
#
# Ignores pushes to main itself. Uses GITHUB_TOKEN so no PAT needed;
# the pull-requests: write permission scoped to this workflow only.

name: auto-pr

# This one keeps an allowlist on purpose, unlike ci.yml, security.yml
# and codeql.yml, which were inverted to branches-ignore on 2026-09-29.
# Those three should run on anything, because a branch with no CI is a
# branch that can be merged untested. Opening a pull request is the
# opposite: a scratch or backup branch should not acquire one just by
# being pushed. So a branch outside these prefixes is tested and simply
# does not get a PR opened for it, which is visible rather than silent.
on:
  push:
    # A denylist, not an allowlist, for the same reason ci.yml became
    # one: the allowlist was three prefixes and a branch outside them
    # got no PR at all, silently. On 2026-09-29 a branch named docs/
    # fell outside it, the PR was opened by hand instead, and that
    # quietly broke review: a PR created with `gh pr create` is authored
    # by whoever's token ran it, and GitHub does not let anyone approve
    # their own pull request. The workaround was worse than the gap.
    #
    # Inverting it means a new prefix works the day someone invents it.
    branches-ignore:
      - main
      - "backup/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  open-or-update-pr:
    name: open or update draft PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: open or update draft PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Does a PR already exist for this branch?
          existing=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number' || echo "")
          if [ -n "$existing" ]; then
            echo "PR #$existing already open for $BRANCH — nothing to do."
            exit 0
          fi

          # Build a body from the commit list since main.
          {
            echo "Auto-opened from a push to \`$BRANCH\`. Flip to Ready-for-review when this is done."
            echo
            echo "## Commits since main"
            echo
            git log --pretty=format:'- %h %s' origin/main..HEAD
          } > /tmp/pr-body.md

          # First-line-of-newest-commit as the title.
          title=$(git log -1 --pretty=format:'%s')

          # Auto-pr is the only path that opens PRs for these branches.
          # If this create fails — including the "GitHub Actions is not
          # permitted to create or approve pull requests" permission
          # error — we let it fail loudly. That's a real config problem
          # (owner toggle in Settings → Actions → General) that we want
          # to see, not paper over. Do NOT race this step with manual
          # `gh pr create` calls from a dev shell; that produces spurious
          # concurrent-create failures.
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$title" \
            --body-file /tmp/pr-body.md \
            --draft
