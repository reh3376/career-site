# CodeQL, GitHub's SAST for Go, TypeScript, and Python.
# Runs weekly, on every feature branch push, and on push to main.
#
# Push rather than pull_request, for the reason given in ci.yml: the
# pull request is opened by github-actions[bot] and GitHub holds
# workflow runs on bot-authored pull requests at action_required until
# a human approves each one, so a pull_request trigger reports nothing.
#
# Findings surface at Repository -> Security -> Code scanning alerts.

name: codeql

# dependabot/** matches for the same reason it does in ci.yml: without
# it these scans never run on a dependency branch, and the checks they
# feed stay pending for ever, so the PR cannot merge. Adding it to
# ci.yml alone on 2026-09-29 left seven dependency PRs blocked on this
# workflow instead of on that one.
on:
  push:
    branches:
      - main
      - "claude_dev*"
      - "feat/*"
      - "fix/*"
      - "dependabot/**"
  schedule:
    - cron: "23 6 * * 1" # 06:23 UTC every Monday

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: services/api/go.sum

      - name: init codeql
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Query filters live in the config so scoped false-positive
          # suppressions carry a rationale in-repo (not on GitHub's
          # dismissal UI). See the file for the rules.
          config-file: ./.github/codeql/codeql-config.yml

      - if: matrix.language == 'go'
        name: build go
        working-directory: services/api
        run: go build ./...

      - name: analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
