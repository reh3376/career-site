# Main CI pipeline. Runs on every push and PR against main. Each job is
# scoped to one toolchain so a Python-only change does not spin up Go/Node
# runners, and the whole matrix cancels when a PR pushes a fixup commit.
#
# The `proto` job is the hard gate: `make check-gen` regenerates the Go, TS,
# and Python stubs and fails if any tracked file drifts from the .proto
# sources (FSD 0.3.3 §8.5, proto/README.md).

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  BUF_VERSION: "1.66.1"
  PNPM_VERSION: "12.4.2"
  UV_VERSION: "0.9.26"

jobs:
  proto:
    name: proto (lint, breaking, drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: buf lint
        run: BUF=$(which buf) make lint-proto

      - name: buf breaking (against main)
        if: github.event_name == 'pull_request'
        run: BUF=$(which buf) make breaking

      - name: check-gen (regenerate and diff)
        run: BUF=$(which buf) make check-gen

  api:
    name: api (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/api/go.sum

      - name: gofmt
        working-directory: services/api
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt drift:"; echo "$out"; exit 1; fi

      - name: go vet
        working-directory: services/api
        run: go vet ./...

      - name: go test
        working-directory: services/api
        run: go test -race -count=1 ./...

      - name: go build
        working-directory: services/api
        run: go build ./...

  sidecar:
    name: sidecar (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: sync deps
        working-directory: services/sidecar
        run: uv sync --frozen --extra dev

      - name: ruff
        working-directory: services/sidecar
        run: uv run ruff check .

      - name: pyright
        working-directory: services/sidecar
        run: uv run pyright

      - name: pytest
        working-directory: services/sidecar
        run: uv run pytest

  web:
    name: web (typescript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: enable pnpm
        run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('apps/web/pnpm-lock.yaml') }}

      - name: install
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: typecheck
        working-directory: apps/web
        run: pnpm typecheck

      - name: lint
        working-directory: apps/web
        run: pnpm lint

      - name: build
        working-directory: apps/web
        run: pnpm build

  images:
    name: images (docker build)
    runs-on: ubuntu-latest
    needs: [proto, api, sidecar, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: build api image
        uses: docker/build-push-action@v6
        with:
          context: services/api
          push: false
          load: false
          tags: career-site/api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: build sidecar image
        uses: docker/build-push-action@v6
        with:
          context: services/sidecar
          push: false
          load: false
          tags: career-site/sidecar:ci
          cache-from: type=gha,scope=sidecar
          cache-to: type=gha,mode=max,scope=sidecar

      - name: build web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: false
          load: false
          tags: career-site/web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
