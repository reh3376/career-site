# Main CI pipeline. Runs on every push and PR against main. Each job is
# scoped to one toolchain so a Python-only change does not spin up Go/Node
# runners, and the whole matrix cancels when a PR pushes a fixup commit.
#
# The `proto` job is the hard gate: `make check-gen` regenerates the Go, TS,
# and Python stubs and fails if any tracked file drifts from the .proto
# sources (FSD 0.3.3 §8.5, proto/README.md).

name: ci

on:
  push:
    # main runs CI + publishes GHCR images.
    # feature branches (claude_dev*, feat/*, fix/*) run CI but publish
    # nothing — the images job checks the branch itself.
    branches:
      - main
      - "claude_dev*"
      - "feat/*"
      - "fix/*"
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # for GHCR image publish on push to main

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  BUF_VERSION: "1.66.1"
  PNPM_VERSION: "12.4.2"
  UV_VERSION: "0.9.26"

jobs:
  proto:
    name: proto (lint, breaking, drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: buf lint
        run: BUF=$(which buf) make lint-proto

      # buf breaking compares against main. On PRs the default checkout only
      # has the merge ref, and on feature-branch pushes main isn't in the
      # working repo either — so we fetch it explicitly. Skip only when the
      # push is to main itself (nothing to compare against).
      - name: fetch main for buf breaking
        if: github.ref != 'refs/heads/main'
        run: git fetch --no-tags --depth=1 origin main:main

      - name: buf breaking (against main)
        if: github.ref != 'refs/heads/main'
        run: BUF=$(which buf) make breaking

      - name: check-gen (regenerate and diff)
        run: BUF=$(which buf) make check-gen

  api:
    name: api (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/api/go.sum

      - name: gofmt
        working-directory: services/api
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt drift:"; echo "$out"; exit 1; fi

      - name: go vet
        working-directory: services/api
        run: go vet ./...

      - name: go test
        working-directory: services/api
        run: go test -race -count=1 ./...

      - name: go build
        working-directory: services/api
        run: go build ./...

  sidecar:
    name: sidecar (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: sync deps
        working-directory: services/sidecar
        run: uv sync --frozen --extra dev

      - name: ruff
        working-directory: services/sidecar
        run: uv run ruff check .

      - name: pyright
        working-directory: services/sidecar
        run: uv run pyright

      - name: pytest
        working-directory: services/sidecar
        run: uv run pytest

  web:
    name: web (typescript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: enable pnpm
        run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('apps/web/pnpm-lock.yaml') }}

      - name: install
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: typecheck
        working-directory: apps/web
        run: pnpm typecheck

      - name: lint
        working-directory: apps/web
        run: pnpm lint

      - name: build
        working-directory: apps/web
        run: pnpm build

  changes:
    name: detect changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need diff history so we can compare against the base ref
          # for a PR or the previous commit for a push.
          fetch-depth: 0
      # Emit `code=true` when the diff touches ANY file outside the
      # docs/markdown allow-list. Doc-only PRs get `code=false`, which
      # skips the (slow) images build. Deliberately permissive on the
      # regex — a false "code=true" costs a normal build; a false
      # "code=false" would ship an unbuilt image which would fail loud
      # at deploy time (image tag missing on GHCR) so no silent bad
      # state.
      - id: filter
        name: any code changed?
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            base=$(git rev-parse HEAD~1)
          else
            base=""
          fi
          if [ -z "$base" ]; then
            # First commit on a branch we can't diff against — build.
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base"..HEAD)
          echo "changed files:"
          echo "$changed"
          # Everything matching this pattern is doc-only.
          doc_re='^(docs/|[^/]*\.md$|deploy/README\.md$|services/[^/]*/README\.md$|LICENSE(-CONTENT)?$|\.github/PULL_REQUEST_TEMPLATE\.md)$'
          if [ -z "$changed" ] || ! echo "$changed" | grep -vE "$doc_re" | grep -q .; then
            echo "→ doc-only change; skipping images build"
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "→ code change detected; building images"
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  images:
    name: images (docker build + push)
    runs-on: ubuntu-latest
    needs: [proto, api, sidecar, web, changes]
    # Skip when the change is doc-only — the build is expensive and
    # a README edit never invalidates an image.
    if: needs.changes.outputs.code == 'true'
    env:
      # Push on push-to-main; PRs and other events build-only so a forked
      # PR cannot poison the registry.
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: log in to ghcr
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: image tags
        id: tags
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          sha=${GITHUB_SHA::12}
          echo "api=ghcr.io/${owner}/career-site-api:${sha},ghcr.io/${owner}/career-site-api:latest" >> "$GITHUB_OUTPUT"
          echo "sidecar=ghcr.io/${owner}/career-site-sidecar:${sha},ghcr.io/${owner}/career-site-sidecar:latest" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${owner}/career-site-web:${sha},ghcr.io/${owner}/career-site-web:latest" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: build api image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/api
          push: ${{ env.PUSH == 'true' }}
          load: false
          tags: ${{ steps.tags.outputs.api }}
          # Without these the binary reports version 0.0.0-dev and commit
          # "unknown", and every product event row carries app_commit
          # "unknown", so a metric shift cannot be lined up with a deploy.
          # COMMIT is the 12-char sha, the same string as the image tag
          # and IMAGE_TAG in .env.prod, so the three always match.
          build-args: |
            VERSION=${{ steps.tags.outputs.sha }}
            COMMIT=${{ steps.tags.outputs.sha }}
            BUILT_AT=${{ steps.tags.outputs.built_at }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: build sidecar image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/sidecar
          push: ${{ env.PUSH == 'true' }}
          load: false
          tags: ${{ steps.tags.outputs.sidecar }}
          cache-from: type=gha,scope=sidecar
          cache-to: type=gha,mode=max,scope=sidecar

      - name: build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/web
          push: ${{ env.PUSH == 'true' }}
          load: false
          tags: ${{ steps.tags.outputs.web }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: summary
        run: |
          echo "### Images built" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA: \`${{ steps.tags.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- api:     ${{ steps.tags.outputs.api }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- sidecar: ${{ steps.tags.outputs.sidecar }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- web:     ${{ steps.tags.outputs.web }}" >> "$GITHUB_STEP_SUMMARY"
