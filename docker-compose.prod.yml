# Production overrides applied on top of docker-compose.yml.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from dev:
#   - Caddy exposes 80 + 443 with the production Caddyfile (TLS,
#     security headers per FSD §8.9).
#   - No host ports for mailpit, minio, postgres — they are only reachable
#     on the internal `app` network. Dev tooling stays out of the public
#     internet.
#   - The API uses Resend for email (real deliverability), COOKIE_SECURE=1,
#     PWNED_CHECK_ENABLED=1, and a stable DECISION_TOKEN_SECRET.
#   - Every image tag is a specific version (set via .env.prod) rather
#     than :latest, so `docker compose pull` is deterministic.
#   - Backups + monitoring are follow-ups; the compose file is deliberately
#     minimal so the first deploy is auditable.

name: career-site

services:
  caddy:
    ports: !override
      - "80:80"
      - "443:443"
    volumes: !override
      - ./deploy/caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}

  web:
    image: ghcr.io/${GHCR_OWNER:-reh3376}/career-site-web:${IMAGE_TAG:-latest}
    # Kill the base compose's `build:` fallback in prod. Without this,
    # a missing tag on GHCR (e.g. IMAGE_TAG bumped ahead of the CI
    # publish) makes compose fall through to `docker build` locally on
    # the CX22, which OOM-kills `pnpm build` and takes prod down. With
    # `build: !reset` compose refuses to build and fails the up loud.
    build: !reset null
    pull_policy: always
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
      API_URL: http://api:8080
      NEXT_PUBLIC_API_URL: https://${SITE_DOMAIN}
      # Outbound social links surfaced in the footer + IT landing.
      # Outbound links, read at request time by the server components.
      # Empty values hide the corresponding link on the site.
      LINKEDIN_URL: ${LINKEDIN_URL:-}
      GITHUB_URL: ${GITHUB_URL:-https://github.com/reh3376}
      # Quoted on the JD pages; must match the api (same variable).
      JD_MATCH_THRESHOLD: ${JD_MATCH_THRESHOLD:-0.55}

  api:
    image: ghcr.io/${GHCR_OWNER:-reh3376}/career-site-api:${IMAGE_TAG:-latest}
    build: !reset null
    pull_policy: always
    environment:
      API_ADDR: :8080
      API_ENV: production
      SIDECAR_ADDR: sidecar:50051
      DATABASE_URL: postgres://career:${POSTGRES_PASSWORD}@postgres:5432/career?sslmode=disable
      # /admin/db surface runs through the dedicated read-only role
      # created by migration 00005. The API applies DB_READONLY_PASSWORD
      # to the role at boot via ALTER ROLE; DATABASE_URL_READONLY tells
      # it which DSN to open the second pool with. Both empty in dev.
      DB_READONLY_PASSWORD: ${DB_READONLY_PASSWORD}
      DATABASE_URL_READONLY: postgres://career_admin_readonly:${DB_READONLY_PASSWORD}@postgres:5432/career?sslmode=disable
      WEB_BASE_URL: https://${SITE_DOMAIN}
      OWNER_CONTACT_EMAIL: ${OWNER_CONTACT_EMAIL}
      MAIL_FROM: ${MAIL_FROM}
      EMAIL_PROVIDER: resend
      RESEND_API_KEY: ${RESEND_API_KEY}
      DECISION_TOKEN_SECRET: ${DECISION_TOKEN_SECRET}
      EVENT_IP_SALT: ${EVENT_IP_SALT:-}
      EVENT_IDENTITY_RETENTION_DAYS: ${EVENT_IDENTITY_RETENTION_DAYS:-400}
      COOKIE_SECURE: "1"
      PWNED_CHECK_ENABLED: "1"
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      CAREER_SITE_ADMIN_PW: ${CAREER_SITE_ADMIN_PW}
      # Corpus reindex reads markdown from here. The bind-mount below
      # exposes the deployed apps/web/content directory (checked-out
      # by the deploy user under /opt/career-site) into the api
      # container as read-only, so /admin/corpus "Reindex articles"
      # walks the same files that shipped with this deploy.
      CORPUS_ROOT: /corpus
      # Curated private corpus, synced from the owner's docs/personal by
      # `make sync-corpus` (never part of the repo checkout). Every
      # document ingested from here is visibility=corpus_only.
      CORPUS_PRIVATE_ROOT: /corpus-private
      JD_PIPELINE_TIMEOUT_SECONDS: ${JD_PIPELINE_TIMEOUT_SECONDS:-1200}
      # Match gate; model-dependent, calibrated per OLLAMA_LLM_MODEL in
      # docs/llm-tuning-log.md (qwen3:4b-q8_0 with the career facts sheet: 0.70).
      JD_MATCH_THRESHOLD: ${JD_MATCH_THRESHOLD:-0.55}
      LLM_MONTHLY_CALL_CAP: ${LLM_MONTHLY_CALL_CAP:-2000}
      # Must match SIDECAR_LLM_NUM_CTX; the api budgets prompts to it.
      LLM_NUM_CTX: ${SIDECAR_LLM_NUM_CTX:-16384}
      RESUME_PDF_OWNER_PASSWORD: ${RESUME_PDF_OWNER_PASSWORD}
    volumes: !override
      - ./apps/web/content:/corpus:ro
      - ${CORPUS_PRIVATE_HOST_DIR:-/opt/career-site-private/corpus}:/corpus-private:ro

  sidecar:
    image: ghcr.io/${GHCR_OWNER:-reh3376}/career-site-sidecar:${IMAGE_TAG:-latest}
    build: !reset null
    pull_policy: always
    environment:
      # Ask Roger Phase 4 groundwork. `stub` gives a deterministic
      # pseudo-embedder that works with no external deps (safe default
      # for a fresh deploy). Flip to `ollama` and set OLLAMA_URL /
      # OLLAMA_EMBED_MODEL once an Ollama service is running.
      SIDECAR_EMBED_PROVIDER: ${SIDECAR_EMBED_PROVIDER:-stub}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      # LLM gateway stays on stub in prod until the model is proven
      # locally and the box is resized; see docs/cutover-local-to-prod.md.
      SIDECAR_LLM_PROVIDER: ${SIDECAR_LLM_PROVIDER:-stub}
      # LLM host; defaults to the box's ollama. Point it at a tailnet
      # address to run the model on the owner's workstation instead.
      OLLAMA_LLM_URL: ${OLLAMA_LLM_URL:-http://ollama:11434}
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-qwen3:4b-q8_0}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      SIDECAR_LLM_TIMEOUT_SECONDS: ${SIDECAR_LLM_TIMEOUT_SECONDS:-900}
      SIDECAR_LLM_NUM_CTX: ${SIDECAR_LLM_NUM_CTX:-16384}
    depends_on:
      ollama:
        condition: service_healthy

  # Embedding host. Always part of the prod stack so the provider flip is
  # a one-variable change (SIDECAR_EMBED_PROVIDER=ollama) plus an embed
  # sweep from /admin/corpus. Model pulled on first boot into a volume.
  # Sizing: nomic-embed-text is ~275 MB on disk and ~500-600 MB resident
  # while loaded; OLLAMA_KEEP_ALIVE unloads it when idle. Fits the CPX11
  # (2 GB) with the 900m cap; see deploy/README.md.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: !reset []
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        pid=$$!
        sleep 5
        ollama pull "$${OLLAMA_EMBED_MODEL}" || echo "model pull failed; serving without it"
        wait $$pid
    environment:
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_NUM_PARALLEL: "1"
      # Memory levers for the CPX31 (7 GB cap, qwen3:8b at 8k context).
      # The first prod run OOM-killed llama-server at 7.07 GB with both
      # models resident and a full-precision KV cache. One loaded model
      # at a time (the embedder reloads in seconds when needed), flash
      # attention, and a q8_0 KV cache take ~1 GB off the peak.
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
    mem_limit: ${OLLAMA_MEM_LIMIT:-900m}
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [app]

  postgres:
    ports: !override [] # no host port in prod
    environment:
      POSTGRES_USER: career
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: career

  mailpit:
    profiles: ["disabled"] # not in the prod stack

  minio:
    ports: !override [] # no host ports in prod — bucket is internal-only
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
