# career-site local development stack. `docker compose up` boots caddy on
# :80 in front of the Next.js web on :3000 and the Go API on :8080, with the
# Python sidecar on :50051 and the data-tier services (postgres, mailpit,
# minio) already running so later phases can wire into them without stack
# changes. Same shape ships to production; only image tags and volumes
# differ.
#
# The one runtime dependency this stack proves today is the API -> sidecar
# gRPC call: `curl http://localhost/api/readyz` returns
# {"checks":{"sidecar":true}, ...} when the sidecar is healthy.

name: career-site

x-common-env: &common-env
  TZ: UTC

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
    networks: [app]

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      API_URL: http://api:8080
      NEXT_TELEMETRY_DISABLED: "1"
      # Outbound links, read at request time (empty hides the link).
      LINKEDIN_URL: ${LINKEDIN_URL:-}
      JD_MATCH_THRESHOLD: ${JD_MATCH_THRESHOLD:-0.55}
      GITHUB_URL: ${GITHUB_URL:-https://github.com/reh3376}
    networks: [app]

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      API_ADDR: :8080
      API_ENV: docker
      SIDECAR_ADDR: sidecar:50051
      DATABASE_URL: postgres://career:career_dev_only@postgres:5432/career?sslmode=disable
      WEB_BASE_URL: http://localhost
      OWNER_CONTACT_EMAIL: rogerhenley345@gmail.com
      MAIL_FROM: "career-site <noreply@career-site.local>"
      EMAIL_PROVIDER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      PWNED_CHECK_ENABLED: "0"
      # Optional local admin bootstrap; set both in the repo-root .env
      # (gitignored) to sign into /admin without the email approval flow.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      CAREER_SITE_ADMIN_PW: ${CAREER_SITE_ADMIN_PW:-}
      # JD pipeline: per-submission wall-clock budget and the LLM call
      # cap per month (0 = unlimited). LLM_ALLOW_STUB=1 runs the
      # requirement assessor against the stub provider (CI / e2e).
      JD_PIPELINE_TIMEOUT_SECONDS: ${JD_PIPELINE_TIMEOUT_SECONDS:-900}
      JD_MATCH_THRESHOLD: ${JD_MATCH_THRESHOLD:-0.55}
      LLM_MONTHLY_CALL_CAP: ${LLM_MONTHLY_CALL_CAP:-0}
      LLM_ALLOW_STUB: ${LLM_ALLOW_STUB:-0}
      # Must match SIDECAR_LLM_NUM_CTX; the api budgets prompts to it.
      LLM_NUM_CTX: ${SIDECAR_LLM_NUM_CTX:-16384}
      # Owner password that locks editing on generated résumé PDFs. Set
      # in the repo-root .env (gitignored); empty skips PDF rendering.
      RESUME_PDF_OWNER_PASSWORD: ${RESUME_PDF_OWNER_PASSWORD:-}
      # Corpus reindex reads markdown from here. Bind-mounted below
      # so `/admin/corpus` → "Reindex articles" walks the same files
      # that ship with the web bundle.
      CORPUS_ROOT: /corpus
      # Curated private corpus (visibility=corpus_only). In dev, point
      # CORPUS_PRIVATE_HOST_DIR at a local staging folder; default is
      # the gitignored ./.corpus-private.
      CORPUS_PRIVATE_ROOT: /corpus-private
    volumes:
      - ./apps/web/content:/corpus:ro
      - ${CORPUS_PRIVATE_HOST_DIR:-./.corpus-private}:/corpus-private:ro
    depends_on:
      sidecar:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks: [app]

  sidecar:
    build:
      context: ./services/sidecar
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      SIDECAR_ADDR: "[::]:50051"
      # Local development against an Ollama running on the host machine:
      #   SIDECAR_EMBED_PROVIDER=ollama docker compose up -d
      # host.docker.internal resolves to the host on Docker Desktop; the
      # extra_hosts entry gives Linux engines the same name.
      SIDECAR_EMBED_PROVIDER: ${SIDECAR_EMBED_PROVIDER:-stub}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      # LLM gateway. `ollama` uses OLLAMA_LLM_MODEL on the same server;
      # `stub` returns schema-valid canned JSON.
      SIDECAR_LLM_PROVIDER: ${SIDECAR_LLM_PROVIDER:-stub}
      OLLAMA_LLM_URL: ${OLLAMA_LLM_URL:-http://host.docker.internal:11434}
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-qwen3:14b}
      SIDECAR_LLM_TIMEOUT_SECONDS: ${SIDECAR_LLM_TIMEOUT_SECONDS:-600}
      SIDECAR_LLM_NUM_CTX: ${SIDECAR_LLM_NUM_CTX:-16384}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Uses the grpc client shipped with the sidecar; asserts Health() reports ready.
      test:
        - CMD
        - python
        - -c
        - |
          import grpc, sys
          from career.sidecar.v1 import sidecar_pb2, sidecar_pb2_grpc
          ch = grpc.insecure_channel('localhost:50051')
          try:
              stub = sidecar_pb2_grpc.SidecarServiceStub(ch)
              r = stub.Health(sidecar_pb2.HealthRequest(), timeout=2.0)
              sys.exit(0 if r.ready else 1)
          finally:
              ch.close()
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [app]

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      <<: *common-env
      POSTGRES_USER: career
      POSTGRES_PASSWORD: career_dev_only
      POSTGRES_DB: career
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career -d career"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [app]

  mailpit:
    image: axllent/mailpit:v1
    restart: unless-stopped
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP
    networks: [app]

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      <<: *common-env
      MINIO_ROOT_USER: minio_dev
      MINIO_ROOT_PASSWORD: minio_dev_only
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web UI
    networks: [app]

  # Real embeddings for dev. Opt in with `docker compose --profile embed up`
  # and set SIDECAR_EMBED_PROVIDER=ollama on the sidecar; the default dev
  # stack keeps the stub so `up -d` needs no model download.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ["embed"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        pid=$$!
        sleep 5
        ollama pull "$${OLLAMA_EMBED_MODEL}" || echo "model pull failed; serving without it"
        wait $$pid
    environment:
      OLLAMA_EMBED_MODEL: nomic-embed-text
      OLLAMA_KEEP_ALIVE: 10m
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [app]

networks:
  app:
    driver: bridge

volumes:
  caddy_data:
  ollama_models:
  caddy_config:
  postgres_data:
  minio_data:
